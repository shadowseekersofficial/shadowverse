<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Shadowseekers</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
:root{
  --bg:#03020a;--border:rgba(255,255,255,.07);
  --accent:#8b6fff;--gold:#d4a843;--mist:#8880aa;--white:#f0ecff;--dim:#3a3560;
  --green:#10b981;--red:#e05c5c;
}
body{background:var(--bg);color:var(--white);font-family:'Cormorant Garamond',serif;overflow-x:hidden;cursor:none}
body::before{content:'';position:fixed;inset:0;z-index:-1;
  background:radial-gradient(ellipse 100% 55% at 50% 0%,rgba(70,35,160,.2) 0%,transparent 60%),
  radial-gradient(ellipse 45% 45% at 0% 70%,rgba(50,20,120,.12) 0%,transparent 50%),#03020a;
  pointer-events:none}
#cur,#curR{position:fixed;pointer-events:none;border-radius:50%;z-index:9999;transform:translate(-50%,-50%);transition:width .2s,height .2s,background .2s}
#cur{width:8px;height:8px;background:var(--accent)}
#curR{width:30px;height:30px;border:1px solid rgba(139,111,255,.35);z-index:9998}
body.hov #cur{width:14px;height:14px;background:var(--gold)}
body.hov #curR{width:44px;height:44px;border-color:rgba(212,168,67,.45)}
nav{position:fixed;top:0;left:0;right:0;z-index:800;height:64px;padding:0 3rem;display:flex;align-items:center;justify-content:space-between;background:rgba(3,2,10,.92);border-bottom:1px solid var(--border);backdrop-filter:blur(16px)}
.logo{font-family:'Cinzel Decorative',serif;font-size:.9rem;letter-spacing:.2em;color:var(--white);text-decoration:none;text-shadow:0 0 20px rgba(139,111,255,.5)}
.nav-center{display:flex;list-style:none;height:100%;gap:0}
.nav-center>li{position:relative;height:100%;display:flex;align-items:center}
.nav-center>li>a,.nav-center>li>span{font-family:'Space Mono',monospace;font-size:.52rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mist);text-decoration:none;cursor:pointer;padding:0 .9rem;height:100%;display:flex;align-items:center;transition:color .25s;border-bottom:2px solid transparent;white-space:nowrap}
.nav-center>li:hover>a,.nav-center>li>span:hover{color:var(--white);border-bottom-color:var(--accent)}
.drop-menu{display:none;position:absolute;top:100%;left:0;min-width:150px;background:rgba(5,3,18,.97);border:1px solid var(--border);border-top:2px solid var(--accent)}
.nav-center>li:hover .drop-menu{display:block}
.drop-menu a{display:block;padding:.55rem 1rem;font-family:'Space Mono',monospace;font-size:.5rem;letter-spacing:.15em;text-transform:uppercase;color:var(--mist);text-decoration:none;border-left:2px solid transparent;transition:all .2s}
.drop-menu a:hover{color:var(--white);background:rgba(139,111,255,.08);border-left-color:var(--accent)}
.nav-right{display:flex;align-items:center;gap:1rem}
.nav-login-btn{font-family:'Space Mono',monospace;font-size:.52rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);background:none;border:1px solid rgba(139,111,255,.4);padding:.4rem 1rem;cursor:pointer;transition:all .25s}
.nav-login-btn:hover{background:var(--accent);color:#fff}
.nav-user-badge{font-family:'Space Mono',monospace;font-size:.5rem;letter-spacing:.12em;color:var(--green);display:flex;align-items:center;gap:.5rem}
.nav-user-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.nav-logout-btn{font-family:'Space Mono',monospace;font-size:.46rem;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);background:none;border:none;cursor:pointer;transition:color .2s}
.nav-logout-btn:hover{color:var(--red)}
.hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px}
.hamburger span{display:block;width:22px;height:2px;background:var(--mist)}
.mob-menu{display:none;position:fixed;top:64px;left:0;right:0;bottom:0;background:rgba(3,2,10,.98);z-index:700;padding:2rem;overflow-y:auto;flex-direction:column;gap:.4rem}
.mob-menu.open{display:flex}
.mob-menu a,.mob-grp{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mist);text-decoration:none;padding:.75rem 0;border-bottom:1px solid var(--border);transition:color .2s}
.mob-menu a:hover{color:var(--white)}
.mob-grp{color:var(--accent);font-size:.48rem;margin-top:1rem;border-bottom:none;padding-bottom:.2rem}
.mob-sub{padding-left:1rem;font-size:.55rem}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.modal-overlay.hidden{display:none}
.modal-box{background:#08071a;border:1px solid var(--border);border-top:2px solid var(--accent);padding:3rem 2.5rem;width:min(440px,90vw);position:relative}
.modal-title{font-family:'Cinzel Decorative',serif;font-size:1.1rem;color:var(--white);margin-bottom:.3rem;text-shadow:0 0 20px rgba(139,111,255,.4)}
.modal-sub{font-family:'Space Mono',monospace;font-size:.48rem;letter-spacing:.25em;text-transform:uppercase;color:var(--mist);margin-bottom:2rem}
.modal-label{font-family:'Space Mono',monospace;font-size:.46rem;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:.4rem}
.modal-input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--white);font-family:'Space Mono',monospace;font-size:.62rem;padding:.7rem .9rem;outline:none;transition:border-color .2s;margin-bottom:1.2rem}
.modal-input:focus{border-color:var(--accent)}
.modal-input.err{border-color:var(--red)}
.modal-err{font-family:'Space Mono',monospace;font-size:.48rem;letter-spacing:.15em;color:var(--red);margin-bottom:1rem;display:none}
.modal-btn{width:100%;background:none;border:1px solid var(--accent);color:var(--accent);font-family:'Space Mono',monospace;font-size:.55rem;letter-spacing:.25em;text-transform:uppercase;padding:.85rem;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.modal-btn::before{content:'';position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s;z-index:-1}
.modal-btn:hover{color:#fff}.modal-btn:hover::before{transform:scaleX(1)}
.modal-btn.loading{opacity:.6;pointer-events:none}
.modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;color:var(--dim);cursor:pointer;font-size:1rem;transition:color .2s}
.modal-close:hover{color:var(--white)}
.dashboard-strip{position:fixed;bottom:0;left:0;right:0;z-index:600;background:rgba(8,7,26,.97);border-top:1px solid var(--border);padding:.8rem 3rem;display:none;align-items:center;justify-content:space-between;backdrop-filter:blur(12px)}
.dashboard-strip.visible{display:flex}
.dash-user{display:flex;align-items:center;gap:.8rem}
.dash-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.dash-id{font-family:'Space Mono',monospace;font-size:.52rem;letter-spacing:.15em;color:var(--green)}
.dash-name{font-family:'Cinzel',serif;font-size:.95rem;color:var(--white)}
.dash-links{display:flex;gap:.8rem}
.dash-link{font-family:'Space Mono',monospace;font-size:.5rem;letter-spacing:.18em;text-transform:uppercase;padding:.5rem 1.2rem;border:1px solid;text-decoration:none;transition:all .25s}
.dash-link.accent{color:var(--accent);border-color:rgba(139,111,255,.4)}.dash-link.accent:hover{background:var(--accent);color:#fff}
.dash-link.gold{color:var(--gold);border-color:rgba(212,168,67,.4)}.dash-link.gold:hover{background:var(--gold);color:#000}
.dash-link.dim{color:var(--mist);border-color:rgba(136,128,170,.3);font-size:.44rem;background:none;cursor:pointer}.dash-link.dim:hover{color:var(--white);border-color:var(--mist)}
.hero{position:relative;height:100vh;min-height:600px;display:flex;align-items:center;justify-content:center;overflow:hidden}
