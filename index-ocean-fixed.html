// ── API ──
async function apiCall(prompt, maxTok){
  const response = await fetch(WORKER_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"grok-3",max_tokens:maxTok||6000,messages:[{role:"user",content:prompt}]})
  });
  const d = await response.json();
  if(d.error) throw new Error(d.error.message||"API error");
  const out = (d.content||[]).map(i=>i.text||"").join("");
  if(!out) throw new Error("Empty response from AI.");
  return out;
}

// ── GET BANK QUESTIONS ──
function getBankQuestions(course, subject, level, count, excludeIds=new Set()){
  const subjectList = subject === "Mix" ? (COURSES[course]?.subjects||[]) : [subject];
  let pool = questionBank.filter(q=>{
    const matchCourse = q.course === course;
    const matchSubject = subjectList.some(s=>q.subject===s);
    const matchLevel = q.level === level;
    const notAttempted = !excludeIds.has(String(q.id));
    return matchCourse && matchSubject && matchLevel && notAttempted;
  });
  // Shuffle
  pool = pool.sort(()=>Math.random()-0.5);
  return pool.slice(0, count).map(q=>({...q, _source:"bank"}));
}

// ── GENERATE ──
// Priority: AI always generates ALL questions.
// Bank is ONLY used as fallback if AI completely fails.
async function generate(retries=3, _course, _subject, _level, _questionCount){
  // Capture these BEFORE setState — setState triggers render/saveState which can overwrite
  const course = _course || state.course;
  const subject = _subject || state.subject;
  const level = _level || state.level;
  const questionCount = _questionCount || state.questionCount;
  const courseData = COURSES[course];
  setState({loading:true, error:""});

  const subStr = subject==="Mix" ? "a balanced mix of all subjects ("+courseData.subjects.join(", ")+")" : subject;
  const lvlCriteria = LEVELS.find(l=>l.id===level)?.criteria||"";
  let jeeNote = "";
  if(courseData.jeeType==="mains") jeeNote="\n- JEE MAINS: single correct MCQ, NTA pattern.";
  else if(courseData.jeeType==="advanced") jeeNote="\n- JEE ADVANCED: high analytical difficulty, IIT-JEE pattern.";

  // Build exam-specific difficulty context
  const examDifficultyNote = {
    NDA:       `\n- NDA EXAM CONTEXT: NDA is conducted by UPSC. Mathematics section covers Class 11-12 level (Algebra, Trigonometry, Calculus, Matrices, Statistics). GAT covers Physics, Chemistry, History, Geography, Polity, Current Affairs at graduation-entry level. Questions must match actual NDA paper difficulty — NOT school exam difficulty.`,
    CDS:       `\n- CDS EXAM CONTEXT: Conducted by UPSC for defence officer roles. Elementary Mathematics is Class 10 level but tricky. English and GK must match actual CDS paper style — precise, elimination-based.`,
    AFCAT:     `\n- AFCAT EXAM CONTEXT: IAF officer selection. Verbal Ability is higher than average SSC. Military Aptitude has spatial reasoning. Questions must match actual AFCAT paper difficulty.`,
    JEE_MAINS: `\n- JEE MAINS CONTEXT: NTA pattern, single correct MCQ. Match actual JEE Mains paper difficulty. No NCERT-direct questions at Advanced level.`,
    JEE_ADV:   `\n- JEE ADVANCED CONTEXT: IIT-JEE pattern, highest difficulty. Multi-concept, tricky, requires deep understanding. Questions must genuinely challenge IIT aspirants.`,
    NEET:      `\n- NEET CONTEXT: NTA pattern, Biology is NCERT-heavy but questions are application-based. Physics and Chemistry match NEET paper difficulty. No trivially easy questions.`,
    SSC:       `\n- SSC CONTEXT: SSC CGL/CHSL pattern. Quant is calculation-heavy with time pressure. GK is specific and factual. Match actual SSC paper style.`,
  }[course] || "";

  const prompt = `You are SHADE, an elite exam generator for serious competitive exam aspirants in India. Generate EXACTLY ${questionCount} unique MCQ questions.

EXAM: ${courseData.label} (${courseData.fullName})
SUBJECT: ${subStr}
DIFFICULTY LEVEL: ${level} — ${lvlCriteria}
${examDifficultyNote}${jeeNote}

STRICT DIFFICULTY ENFORCEMENT:
- If level is Beginner: Class 11-12 NCERT standard only. NOT Class 8-10. A student who studied the chapter should solve these with effort — not instantly.
- If level is Intermediate: MUST be modelled on actual PYQs of ${courseData.label}. Match the real exam's style, trap options, and difficulty exactly. If it doesn't feel like a real exam question, discard it.
- If level is Advanced: HARDER than the actual ${courseData.label} exam. Well-prepared students should find these challenging. ZERO tolerance for easy or obvious questions. If a Class 10 student could answer it, DISCARD it.
- If level is Elite: Topper-killer questions only. Require connecting 2-3 concepts at once. Distractors must be so deceptive that even toppers second-guess themselves. If the question seems straightforward, it is NOT elite enough — make it harder.
- If level is Voidwalker: Beyond any real exam ever set. Questions that would challenge rank-1 students. Counter-intuitive answers, multi-layered reasoning, mastery-level edge cases. Every question must feel like the hardest question ever written for that topic. If it isn't brutally hard, DISCARD it and write something harder.

QUALITY RULES:
(1) Each question must have EXACTLY ONE correct answer. Before finalising, verify no other option is also valid. If ambiguous, reword to specify PRIMARY / MOST DIRECT / MOST SPECIFIC.
(2) For Biology: hormones, enzymes, organelles have overlapping roles — always specify the context (e.g. "primarily responsible for", "directly causes in the context of X").
(3) For Chemistry: specify conditions/reagents where needed so only one answer is valid.
(4) For Physics: specify frame of reference, conditions where ambiguity could exist.
(5) Distractors (wrong options) must be plausible — not obviously wrong. A student who half-knows the topic should find it hard to eliminate wrong options.
(6) Math in plain ASCII only like x^2+3x. No special characters or unicode.
(7) Every question must be distinct — no duplicates, no rephrasing of the same concept.
(8) Output ONLY raw JSON starting with { and ending with }. No markdown. The questions array MUST have EXACTLY ${questionCount} items.
(9) In the explanation, explain why each WRONG option is incorrect — this forces you to verify uniqueness of the correct answer.

Format: {"questions":[{"id":1,"subject":"subject","question":"question text","options":{"A":"opt1","B":"opt2","C":"opt3","D":"opt4"},"correct":"A","explanation":"Why A is correct. Why B is wrong. Why C is wrong. Why D is wrong."}]}`;

  let aiQuestions = [];

  try {
    const txt = await apiCall(prompt, Math.max(8000, questionCount * 500));
    let clean = txt.trim();
    clean = clean.replace(/^```json\s*/i,"").replace(/^```\s*/i,"").replace(/```\s*$/i,"").trim();
    const start=clean.indexOf("{"), end=clean.lastIndexOf("}");
    if(start!==-1&&end!==-1) clean=clean.slice(start,end+1);
    clean = clean.replace(/"((?:[^"\\]|\\.)*)"/g,(match)=>{
      return match.replace(/\n/g,"\\n").replace(/\r/g,"\\r").replace(/\t/g,"\\t").replace(/[\x00-\x1f]/g,"");
    });
    let parsed;
    try{parsed=JSON.parse(clean);}catch(jsonErr){
      if(retries>1){setState({loading:false});return generate(retries-1, course, subject, level, questionCount);}
      throw new Error("Could not parse AI response. Please try again.");
    }
    if(Array.isArray(parsed.questions)){
      aiQuestions = parsed.questions.map(q=>({...q, _source:"ai"}));
    }

    // ── VALIDATE COUNT — retry if AI gave fewer questions than requested ──
    if(aiQuestions.length < questionCount){
      if(retries > 1){
        // Don't bank incomplete set — just retry
        setState({loading:false});
        return generate(retries - 1, course, subject, level, questionCount);
      }
      // Last retry: if we got something (even partial), use it
      if(aiQuestions.length === 0){
        throw new Error(`AI returned 0 questions. Please try again.`);
      }
      // Partial — proceed with what we got (better than nothing on final retry)
    }

    // ── REVIEWER PASS — flag and remove ambiguous questions ──
    if(aiQuestions.length > 0){
      try {
        const reviewPrompt = `You are a strict MCQ quality reviewer for competitive exams (JEE/NEET/NDA etc).

Review the following questions. For each question, check:
1. Is there ONLY ONE correct answer among the 4 options? Or could another option also be considered correct?
2. Is the question wording specific enough to rule out ambiguity?

Return ONLY raw JSON (no markdown) in this format:
{"reviewed":[{"id":1,"ok":true},{"id":2,"ok":false,"reason":"Both Auxin and Gibberellin promote cell elongation — ambiguous"}]}

Questions to review:
${JSON.stringify(aiQuestions.map(q=>({id:q.id,question:q.question,options:q.options,correct:q.correct})))}`;

        const reviewTxt = await apiCall(reviewPrompt, 3000);
        let reviewClean = reviewTxt.trim().replace(/^```json\s*/i,"").replace(/^```\s*/i,"").replace(/```\s*$/i,"").trim();
        const rs = reviewClean.indexOf("{"), re = reviewClean.lastIndexOf("}");
        if(rs !== -1 && re !== -1) reviewClean = reviewClean.slice(rs, re+1);
        const reviewResult = JSON.parse(reviewClean);
        if(Array.isArray(reviewResult.reviewed)){
          const badIds = new Set(reviewResult.reviewed.filter(r=>!r.ok).map(r=>String(r.id)));
          if(badIds.size > 0){
            console.warn(`[SHADE Reviewer] Flagged ${badIds.size} ambiguous question(s):`, reviewResult.reviewed.filter(r=>!r.ok));
            aiQuestions = aiQuestions.filter(q=>!badIds.has(String(q.id)));
          }
        }
      } catch(reviewErr){
        // Reviewer failed — not critical, proceed with original questions
        console.warn("[SHADE Reviewer] Skipped:", reviewErr.message);
      }
    }

    // ── AUTO-ADD ALL AI QUESTIONS TO BANK ──
    if(aiQuestions.length>0){
      // Unique IDs: base timestamp + index so no two collide even in same map()
      const base = Date.now();
      const newBankQs = aiQuestions.map((q, i)=>({
        id: base + i,                          // guaranteed unique per batch
        course,
        subject: q.subject||subject,
        level,
        question: q.question,
        options: q.options,
        correct: q.correct,
        explanation: q.explanation,
      }));
      // Update local bank immediately
      questionBank.push(...newBankQs);
      localStorage.setItem("shade_bank", JSON.stringify(questionBank));
      // ONE single batch call to GAS — far more reliable than N concurrent calls
      // Uses addQuestions (batch). If GAS script is old and doesn't support it,
      // falls back to writeAll which always works.
      gasFetch("addQuestions", { questions: newBankQs })
        .then(res => {
          // If GAS returned an error (old script), fall back to full push
          if(res && res.error) throw new Error(res.error);
        })
        .catch(()=>{
          // Fallback: push entire bank via writeAll
          gasFetch("writeAll", {
            members: Object.entries(members).map(([shadowId,m])=>({shadowId,codename:m.codename,passphrase:m.passphrase})),
            questions: questionBank
          }).catch(()=>{}); // silent — localStorage already updated
        });
    }

  } catch(e){
    if(retries>1){setState({loading:false});return generate(retries-1, course, subject, level, questionCount);}
    // ── FALLBACK: AI failed all retries — use bank questions ──
    const excludeIds = loggedInUser ? (userAttempted[loggedInUser.shadowId]||new Set()) : new Set();
    const bankFallback = getBankQuestions(course, subject, level, questionCount, excludeIds);
    if(bankFallback.length>0){
      const finalQs = bankFallback.map((q,i)=>({...q,id:i+1}));
      setState({questions:finalQs,answers:{},elapsed:0,timeUp:false,loading:false,screen:"quiz",currentQuestionIndex:0});
      startTimer();
      return;
    }
    setState({error:e.message||"Generation failed. Please try again.",loading:false});
    return;
  }

  // All questions from AI
  let allQs = aiQuestions.slice(0, questionCount);
  if(allQs.length===0){
    setState({error:"No questions available. Please try again.",loading:false});
    return;
  }
  // Re-index IDs
  allQs = allQs.map((q,i)=>({...q,id:i+1}));

  setState({questions:allQs,answers:{},elapsed:0,timeUp:false,loading:false,screen:"quiz",currentQuestionIndex:0});
  startTimer();
}

// ── SUBMIT — pure client-side, zero AI tokens ──
async function submit(){
  // 🎬 CINEMATIC SUBMIT SEQUENCE
  if(window.triggerSubmitCinematic) window.triggerSubmitCinematic(null);

  clearInterval(state.timerInterval);
  setState({submitting:true, error:""});
  const {course,subject,level,questions,answers,elapsed,timerDuration} = state;
  const courseData = COURSES[course];

  // Grade client-side
  let score = 0;
  const breakdown = questions.map((q,i)=>{
    const userAnswer = answers[q.id] || null;
    const isCorrect = userAnswer === q.correct;
    if(isCorrect) score++;
    return {id:q.id, question:q.question, subject:q.subject||subject, userAnswer, correct:q.correct, isCorrect};
  });

  const total = questions.length;
  const percentage = Math.round((score/total)*100);
  const rank = getShadowRank(percentage);

  // Subject-wise breakdown
  const subjectMap = {};
  breakdown.forEach(b=>{
    const s = b.subject||subject;
    if(!subjectMap[s]) subjectMap[s]={correct:0,total:0};
    subjectMap[s].total++;
    if(b.isCorrect) subjectMap[s].correct++;
  });
  const subjectStats = Object.entries(subjectMap).map(([name,d])=>({
    name, correct:d.correct, total:d.total, pct:Math.round((d.correct/d.total)*100)
  }));

  const results = {rank:rank.rank, score, total, percentage, breakdown, subjectStats, elapsed, timerDuration};

  // Save result + leaderboard to sheet
  if(loggedInUser){
    const entry = {
      shadowId: loggedInUser.shadowId,
      codename: loggedInUser.codename,
      course, subject, level, score, total, percentage,
      grade: rank.rank, // use rank name as grade field in sheet
      elapsed, weekKey: getWeekKey()
    };
    // Fire and forget — don't block results render
    gasFetch("saveResult", entry).catch(()=>{});
    const attemptedIds = questions.map(q=>String(q.id));
    await saveAttempted(loggedInUser.shadowId, attemptedIds);
  }

  setState({results, screen:"results", submitting:false});

  // Load leaderboard from sheet after render
  setTimeout(loadAndRenderLeaderboard, 400);
}

// ── TIMER ──
function startTimer(preserveStart=false){
  clearInterval(state.timerInterval);
  if(!preserveStart){
    // Fresh start — save wall-clock timestamp
    state.startTime=Date.now();
    localStorage.setItem("shade_timer_start", String(state.startTime));
    localStorage.setItem("shade_timer_duration", String(state.timerDuration));
  }
  state.timerInterval=setInterval(()=>{
    const s=Math.floor((Date.now()-state.startTime)/1000);
    state.elapsed=s;
    if(s%5===0) localStorage.setItem("shade_timer_elapsed", String(s));
    if(state.timerDuration>0&&s>=state.timerDuration*60){
      clearInterval(state.timerInterval);
      state.timeUp=true;
      localStorage.setItem("shade_timer_elapsed", String(s));
    }
    updateQuizBar();
  },500);
}
function restoreTimer(){
  // Called on refresh — recalculate elapsed from wall clock
  try{
    const savedStart=localStorage.getItem("shade_timer_start");
    const savedDur=localStorage.getItem("shade_timer_duration");
    if(savedStart&&state.screen==="quiz"){
      const wallElapsed=Math.floor((Date.now()-Number(savedStart))/1000);
      state.startTime=Number(savedStart);
      state.timerDuration=Number(savedDur)||state.timerDuration;
      state.elapsed=wallElapsed;
      if(state.timerDuration>0&&wallElapsed>=state.timerDuration*60){
        state.timeUp=true;
        state.elapsed=state.timerDuration*60;
      }
      return true;
    }
  }catch(e){}
  return false;
}
function updateQuizBar(){
  const {questions,answers,elapsed,timerDuration,timeUp}=state;
  const answered=Object.keys(answers).length;
  const pct=questions.length>0?Math.round((answered/questions.length)*100):0;
  const timeRemaining=timerDuration>0?timerDuration*60-elapsed:0;
  const timerDanger=timerDuration>0&&timeRemaining<60&&!timeUp;
  const doneEl=el("qbar-done"),timeEl=el("qbar-time"),elEl=el("qbar-elapsed"),pfEl=el("pfill"),unEl=el("unanswered");
  if(doneEl)doneEl.textContent=`${answered}/${questions.length}`;
  if(elEl)elEl.textContent=fmt(elapsed);
  if(pfEl)pfEl.style.width=pct+"%";
  if(unEl)unEl.textContent=questions.length-answered>0?`${questions.length-answered} question${questions.length-answered!==1?"s":""} unanswered`:"✓ All questions answered";
  if(timeEl){timeEl.textContent=timeUp?"UP":fmt(Math.max(0,timeRemaining));timeEl.className="sv"+(timerDanger?" danger":"");}
  // Also update the side panel timer
  const panelTimer=el("qp-timer-val");
  if(panelTimer){
    panelTimer.textContent=timeUp?"00:00":fmt(Math.max(0,timeRemaining));
    panelTimer.className="qp-timer-val"+(timerDanger||timeUp?" danger":"");
  }
  if(timeUp){const tb=el("timeup-banner");if(tb)tb.style.display="block";}
}
function selectAnswer(qid,opt){
  if(state.submitting)return;
  state.answers={...state.answers,[qid]:opt};
  const qcard=el(`qc-${qid}`),qst=el(`qst-${qid}`);

function renderQuiz(app){
  const {course,subject,level,questions,answers,elapsed,timerDuration,timeUp,submitting,error,currentQuestionIndex}=state;
  const courseData=COURSES[course];
  const answered=Object.keys(answers).length;
  const pct=questions.length>0?Math.round((answered/questions.length)*100):0;
  const timeRemaining=timerDuration>0?timerDuration*60-elapsed:0;
  const timerDanger=timerDuration>0&&timeRemaining<60&&!timeUp;
  const idx=Math.min(Math.max(0,currentQuestionIndex||0),questions.length-1);
  const q=questions[idx];
  const isAnswered=!!answers[q.id];
  const allDone=answered===questions.length;

  // ── TOP PROGRESS BAR (sticky) ──
  const bar=document.createElement("div");
  bar.className="qbar";
  bar.innerHTML=`
    <div class="qbar-inner">
      <div class="qbar-lft">
        <div class="mlogo mlogo-animated" style="background-image:url('${LOGO_SHADE}')"></div>

        <div><div class="sv" id="qbar-elapsed">${fmt(elapsed)}</div><div class="slbl">Elapsed</div></div>
      </div>
    </div>
    <div class="ptrack"><div class="pfill" id="pfill" style="width:${pct}%"></div></div>`;
  app.appendChild(bar);

  // ── FULL-PAGE SHELL ──
  const shell=document.createElement("div");
  shell.className="quiz-shell";

  // ── LEFT: MAIN QUESTION ──

  mainDiv.className="quiz-main";

        <span class="sq-qnum">Q${String(idx+1).padStart(2,"0")} / ${questions.length}</span>

      </div>

      <div class="sq-qtxt" id="sq-qtxt">${q.question}</div>

      <div class="sq-options">
        ${Object.entries(q.options).map(([opt,txt])=>`
          <button class="sq-opt ${answers[q.id]===opt?"sel":""}" id="opt-cur-${opt}"
            ${submitting?"disabled":""}

            <span>${txt}</span>

      <div class="sq-nav">

        </div>
        ${idx<questions.length-1

  // Questions grid card
  const gridCard=document.createElement("div");

    return `<button class="qp-btn ${isAns?"answered":""} ${isCur?"current":""}" onclick="goQuestion(${i})" title="Q${i+1}: ${isAns?"Answered":"Pending"}">${String(i+1).padStart(2,"0")}</button>`;

  gridCard.innerHTML=`

    <div class="qp-legend" style="margin-top:12px">

      <div class="qp-leg-row"><div class="qp-leg-dot" style="border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.02)"></div>Pending</div>
    </div>`;
  panelDiv.appendChild(gridCard);

  // Progress card
  const progCard=document.createElement("div");
  progCard.className="qp-panel-card";
  progCard.innerHTML=`
    <div class="qp-title">Progress</div>
    <div class="qp-progress-num">${answered}<span style="color:var(--td);font-size:.75rem"> / ${questions.length}</span></div>
    <div style="font-family:'Share Tech Mono',monospace;font-size:.46rem;color:var(--td);letter-spacing:.12em;margin-top:2px">ANSWERED</div>
    <div class="qp-progress-bar"><div class="qp-progress-fill" id="qp-prog-fill" style="width:${pct}%"></div></div>`;
  panelDiv.appendChild(progCard);

  // Submit button in panel
  const submitCard=document.createElement("div");
  submitCard.className="qp-panel-card";
  submitCard.innerHTML=`
    <button class="qp-submit-btn" id="qp-submit-btn" ${submitting?"disabled":""} onclick="submit()">
      ${submitting?'<span class="spin"></span> Grading':'📋 Submit & Grade'}
    </button>
    <div style="font-family:'Share Tech Mono',monospace;font-size:.46rem;color:var(--td);letter-spacing:.08em;text-align:center;margin-top:6px" id="qp-unanswered-lbl">
      ${allDone?"All answered":questions.length-answered+" unanswered"}
    </div>`;
  panelDiv.appendChild(submitCard);

  shell.appendChild(panelDiv);
  app.appendChild(shell);

  setTimeout(typesetMath, 100);
}

function goQuestion(idx){
  if(idx<0||idx>=state.questions.length)return;
  state.currentQuestionIndex=idx;
  saveStateToStorage();
  renderQuizInPlace();
}

function renderQuizInPlace(){
  const app=el("app");
  Array.from(app.children).forEach(child=>{
    if(!child.classList.contains("bgfx")&&!child.classList.contains("scan")&&!child.classList.contains("topbar")&&!child.classList.contains("modal-overlay")&&!child.classList.contains("admin-overlay")){
      child.remove();
    }
  });
  renderQuiz(app);
}

function selectAnswerNav(qid,opt){
  if(state.submitting)return;
  state.answers={...state.answers,[qid]:opt};
  saveStateToStorage();
  // Update status badge
  const qstEl=el("qst-cur");
  if(qstEl){qstEl.textContent="✓ Answered";qstEl.className="sq-status done";}
  // Update option buttons
  ["A","B","C","D"].forEach(o=>{
    const btn=el(`opt-cur-${o}`);
    if(btn)btn.className="sq-opt"+(o===opt?" sel":"");
  });
  // Update panel grid
  const grid=el("qp-grid");
  if(grid){
    const idx=state.currentQuestionIndex;
    const btns=grid.querySelectorAll(".qp-btn");
    if(btns[idx]){btns[idx].classList.add("answered");}
  }
  updateQuizBar();
  // Update unanswered labels
  const answered=Object.keys(state.answers).length;
  const allDone=answered===state.questions.length;
  const unEl=el("unanswered");
  const unLbl=el("qp-unanswered-lbl");
  if(unEl){unEl.textContent=allDone?"✓ All questions answered":`${state.questions.length-answered} unanswered`;unEl.className="sq-unanswered"+(allDone?" all-done":"");}
  if(unLbl)unLbl.textContent=allDone?"All answered":`${state.questions.length-answered} unanswered`;
  // Update progress fill in panel
  const pct=Math.round((answered/state.questions.length)*100);
  const pFill=el("qp-prog-fill");
  if(pFill)pFill.style.width=pct+"%";
}

function getShadowRank(pct){
  if(pct>=95) return {rank:"VOID SOVEREIGN",  sigil:"⬡", color:"#e0f0ff", glow:"rgba(160,220,255,0.7)", desc:"You transcend the known. The Void itself bows."};
  if(pct>=85) return {rank:"SHADOW ELITE",    sigil:"◈", color:"#00e5f0", glow:"rgba(0,220,240,0.7)",  desc:"The darkness chose you. Few reach this far."};
  if(pct>=70) return {rank:"NIGHTBLADE",      sigil:"◆", color:"#a855f7", glow:"rgba(168,85,247,0.6)",  desc:"Sharp as obsidian. Cutting through the mist."};
  if(pct>=55) return {rank:"DUSK OPERATIVE",  sigil:"◇", color:"#f59e0b", glow:"rgba(245,158,11,0.6)",  desc:"You operate in twilight. Potential runs deep."};
  if(pct>=40) return {rank:"SHADOW RECRUIT",  sigil:"○", color:"#64748b", glow:"rgba(100,116,139,0.5)", desc:"The path is long. Begin again. Grow."};
  return       {rank:"GHOST",                 sigil:"·", color:"#334155", glow:"rgba(51,65,85,0.4)",    desc:"Shadows don't remember you yet."};
}

function resSelectQ(idx){
  _resQIdx = idx;
  const breakdown = state.results.breakdown||[];
  const item = breakdown[idx];
  if(!item) return;

  // Update dot highlights
  document.querySelectorAll(".res-dot").forEach((d,i)=>{
    d.classList.toggle("res-dot-active", i===idx);
  });

  const q = state.questions.find(q=>String(q.id)===String(item.id)) || {};
  const opts = q.options || {};
  const detail = document.getElementById("res-q-detail");
  if(!detail) return;

  detail.innerHTML=`
    <div class="rqd-meta">
      <span class="rqd-num">Q${String(idx+1).padStart(2,"0")}</span>
      <span class="rqd-sub">${item.subject||""}</span>
      <span class="rqd-verdict ${item.isCorrect?"rqd-ok":item.userAnswer?"rqd-err":"rqd-skip"}">
        ${item.isCorrect?"✓ Correct":item.userAnswer?"✗ Wrong":"— Skipped"}
      </span>
    </div>
    <div class="rqd-qtxt">${item.question}</div>
    <div class="rqd-opts">
      ${Object.entries(opts).map(([k,v])=>`
        <div class="rqd-opt ${k===item.correct?"rqd-opt-correct":""} ${k===item.userAnswer&&!item.isCorrect?"rqd-opt-wrong":""}">
          <span class="rqd-opt-key">${k}</span>
          <span class="rqd-opt-txt">${v}</span>
          ${k===item.correct?'<span class="rqd-opt-tag rqd-tag-correct">✓ Correct</span>':""}
          ${k===item.userAnswer&&!item.isCorrect?'<span class="rqd-opt-tag rqd-tag-wrong">Your answer</span>':""}
        </div>`).join("")}
    </div>
    ${!item.userAnswer?`<div class="rqd-skipped-note">You didn't answer this question.</div>`:""}
    <div class="rqd-nav">
      <button class="rqd-navbtn" onclick="resSelectQ(${idx-1})" ${idx===0?"disabled":""}>← Prev</button>

    </div>`;

  if(window.MathJax && window.MathJax.typesetPromise){
    MathJax.typesetPromise([detail]).catch(()=>{});
  }
}

function openExplModal(){
  const breakdown = state.results?.breakdown || [];
  const questions = state.questions || [];
  const itemsHTML = breakdown.map((item, i) => {
    const q = questions.find(q=>String(q.id)===String(item.id)) || {};
    const cls = item.isCorrect ? "expl-ok" : item.userAnswer ? "expl-err" : "expl-skip";
    const verdict = item.isCorrect ? "✓ Correct" : item.userAnswer ? "✗ Wrong" : "— Skipped";
    const yourAns = item.userAnswer ? `Your answer: <span style="color:${item.isCorrect?"#22c55e":"#ef4444"}">${item.userAnswer} — ${q.options?.[item.userAnswer]||""}</span>` : "Not answered";
    const correctAns = `Correct: <span style="color:#22c55e">${item.correct} — ${q.options?.[item.correct]||""}</span>`;
    return `<div class="expl-item ${cls}">
      <div class="expl-item-header">
        <span class="expl-item-num">Q${String(i+1).padStart(2,"0")}</span>
        <span class="expl-item-verdict">${verdict}</span>
        <span style="font-family:'Share Tech Mono',monospace;font-size:.5rem;color:var(--td);letter-spacing:.06em;margin-left:auto">${item.subject||""}</span>
      </div>
      <div class="expl-item-q">${item.question}</div>
      <div class="expl-item-answer">${yourAns} &nbsp;·&nbsp; ${correctAns}</div>
      ${q.explanation ? `<div class="expl-item-txt">${q.explanation}</div>` : `<div style="font-family:'Share Tech Mono',monospace;font-size:.5rem;color:var(--td);letter-spacing:.08em;padding-top:8px;border-top:1px solid rgba(255,255,255,0.05)">No explanation available.</div>`}
    </div>`;
  }).join("");

  const overlay = document.createElement("div");
  overlay.className = "expl-modal-overlay";
  overlay.id = "expl-modal-overlay";
  overlay.innerHTML = `
    <div class="expl-modal">
      <div class="expl-modal-header">
        <div class="expl-modal-title">◈ Full Explanations</div>
        <button class="expl-modal-close" onclick="closeExplModal()">✕ CLOSE</button>
      </div>
      <div class="expl-modal-body">${itemsHTML}</div>
    </div>`;
  overlay.addEventListener("click", e => { if(e.target === overlay) closeExplModal(); });
  document.getElementById("app").appendChild(overlay);
  if(window.MathJax && window.MathJax.typesetPromise){
    MathJax.typesetPromise([overlay]).catch(()=>{});
  }
}

function closeExplModal(){
  const el = document.getElementById("expl-modal-overlay");
  if(el) el.remove();
}

function spawnResParticles(color){
  const container = document.getElementById("res-particles");
  if(!container) return;
  for(let i=0;i<18;i++){
    const p=document.createElement("div");
    p.className="res-particle";
    p.style.cssText=`
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      background:${color};
      animation-delay:${Math.random()*2}s;
      animation-duration:${2+Math.random()*3}s;
      width:${2+Math.random()*4}px;
      height:${2+Math.random()*4}px;
      opacity:${0.3+Math.random()*0.5};
    `;
    container.appendChild(p);
  }
}

// ── INIT ──
(async()=>{
  // Restore logged-in user first (SS ID persists across refreshes)
  try{
    const savedUser=localStorage.getItem("shade_user");
    if(savedUser) loggedInUser=JSON.parse(savedUser);
  }catch(e){}

  // Load from local cache first for speed
  try{members=JSON.parse(localStorage.getItem("shade_members")||"{}");}catch(e){}
  try{questionBank=JSON.parse(localStorage.getItem("shade_bank")||"[]");}catch(e){}

  // Restore quiz session if interrupted by refresh
  const sessionRestored = loadStateFromStorage();

  // Fix timer: recalculate elapsed from wall clock so countdown is correct after refresh
  if(sessionRestored && state.screen==="quiz"){
    restoreTimer();
  }

  render();

  // If quiz was in progress and not timed out, restart live ticker
  if(sessionRestored && state.screen==="quiz" && !state.timeUp){
    startTimer(true); // preserveStart=true, don't reset the wall-clock
  }

  // If user was logged in, load their attempted questions
  if(loggedInUser){
    await loadUserAttempted(loggedInUser.shadowId);
  }

  // Pull fresh data from sheets in background
  await pullData();
  if(state.screen==="home") render();

  // ── EMBER PARTICLE SYSTEM ──
  (function(){
    const canvas = document.getElementById("ember-canvas");
    if(!canvas) return;
    const ctx = canvas.getContext("2d");
    let W, H, embers = [];
    function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
    resize();
    window.addEventListener("resize", resize);
    function Ember(){
      this.x = Math.random()*W;
      this.y = H + 10;
      this.vx = (Math.random()-.5)*0.6;
      this.vy = -(0.4 + Math.random()*1.2);
      this.life = 1;
      this.decay = 0.003 + Math.random()*0.004;
      this.size = 1 + Math.random()*2.5;
      this.hue = Math.random()<0.6 ? 180+Math.random()*40 : 200+Math.random()*30;
    }
    function tick(){
      ctx.clearRect(0,0,W,H);
      if(embers.length < 55 && Math.random()<0.4){
        embers.push(new Ember());
      }
      embers = embers.filter(e => e.life > 0);
      embers.forEach(e => {
        e.x += e.vx; e.y += e.vy; e.life -= e.decay;
        ctx.save();
        ctx.globalAlpha = e.life * 0.55;
        ctx.shadowBlur = 8;
        ctx.shadowColor = `hsl(${e.hue},100%,60%)`;
        ctx.fillStyle = `hsl(${e.hue},100%,70%)`;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size * e.life, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      });
      requestAnimationFrame(tick);
    }
    tick();
  })();

  // ── CINEMATIC LOGO SWITCHER ──
  // Full sequence: charge rings → burst logo → flash → glitch text → inhale brand → aberration sub
  function cinematicLogoSwitch(){
    const logos   = document.querySelectorAll(".logo-dual");
    const brand   = document.querySelector(".brand");
    const brandSub= document.querySelector(".brand-sub");
    const isWolf  = logos[0]?.classList.contains("wolf");

    // 1. CHARGE — rings speed up (500ms before burst)
    logos.forEach(l => l.classList.add("logo-charging"));

    setTimeout(()=>{
      // 2. BURST — logo container explodes, faces swap, shockwaves fire
      logos.forEach(l => {
        l.classList.remove("logo-charging");
        l.classList.toggle("wolf");
        // reset burst class first so animation can re-trigger
        l.classList.remove("logo-burst");
        void l.offsetWidth; // force reflow
        l.classList.add("logo-burst");
      });

      // 3. BRAND INHALE — text shrinks as logo explodes
      if(brand){
        brand.classList.remove("brand-inhale","brand-glitch");
        void brand.offsetWidth;
        brand.classList.add("brand-inhale");
      }

      // 4. GLITCH — letters scramble 200ms after burst
      setTimeout(()=>{
        if(brand){
          brand.classList.remove("brand-glitch");
          void brand.offsetWidth;
          brand.classList.add("brand-glitch");
        }
        if(brandSub){
          brandSub.classList.remove("brand-aberration");
          void brandSub.offsetWidth;
          brandSub.classList.add("brand-aberration");
        }
      }, 200);

      // 5. Cleanup animation classes after they finish
      setTimeout(()=>{
        logos.forEach(l => l.classList.remove("logo-burst"));
        if(brand) brand.classList.remove("brand-inhale","brand-glitch");
        if(brandSub) brandSub.classList.remove("brand-aberration");
      }, 900);

    }, 500); // delay after charge starts
  }

  setInterval(cinematicLogoSwitch, 5500);

  // ── CINEMATIC SUBMIT FLASH ──
  // Inject the flash overlay div once
  const flashEl = document.createElement("div");
  flashEl.id = "cinematic-flash";
  document.body.appendChild(flashEl);

  window.triggerSubmitCinematic = function(btnEl){
    // Burst the button
    if(btnEl){
      btnEl.classList.remove("submitting-burst");
      void btnEl.offsetWidth;
      btnEl.classList.add("submitting-burst");
      setTimeout(()=>btnEl.classList.remove("submitting-burst"), 600);
    }
    // Also burst all visible submit buttons
    document.querySelectorAll(".subbtn,.qp-submit-btn").forEach(b=>{
      b.classList.remove("submitting-burst");
      void b.offsetWidth;
      b.classList.add("submitting-burst");
      setTimeout(()=>b.classList.remove("submitting-burst"),600);
    });
    // Full screen flash
    const f = document.getElementById("cinematic-flash");
    if(f){
      f.classList.remove("flash-go");
      void f.offsetWidth;
      f.classList.add("flash-go");
      setTimeout(()=>f.classList.remove("flash-go"), 1300);
    }
    // Also fire logo burst on all visible logos
    setTimeout(()=>{
      document.querySelectorAll(".logo-dual").forEach(l=>{
        l.classList.remove("logo-burst");
        void l.offsetWidth;
        l.classList.add("logo-burst");
        setTimeout(()=>l.classList.remove("logo-burst"),800);
      });
      const brand = document.querySelector(".brand");
      if(brand){
        brand.classList.remove("brand-inhale");
        void brand.offsetWidth;
        brand.classList.add("brand-inhale");
        setTimeout(()=>brand.classList.remove("brand-inhale"),800);
      }
    }, 150);
  };
})();
</script>
