<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SHADE — Elite AI Exam Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700;900&family=Oswald:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']] },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] },
  startup: { typeset: false }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  /* ── Deep Ocean / Abyss palette ── */
  --r:#00c8d4;
  --rb:#00e5f0;
  --rg:rgba(0,200,212,0.55);
  --rd:rgba(0,200,212,0.10);
  --bg:#020810;
  --br:rgba(0,140,180,0.22);
  --brb:rgba(0,200,220,0.50);
  --t:#e8f4f8;
  --td:#5a8a9a;
  --tm:#0d2a35;
  --gold:#e8a020;
  --green:#10B981;
  --red:#E63946;
  --fire:#00b4d8;
  --void:#000d1a;
  --shadow:#00080f;
  --c-cyan:#00f5ff;
  --c-amber:#e8a020;
  --c-violet:#0077b6;
  --pink-flash:#00e5f0;
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{background:var(--bg);overflow-x:hidden;-webkit-tap-highlight-color:transparent;}

/* ══ CINEMATIC CANVAS ══ */
.app{min-height:100vh;background:var(--bg);color:var(--t);font-family:'Oswald',sans-serif;position:relative;overflow-x:hidden;}

/* Film grain overlay */
.app::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
  opacity:0.028;animation:grainShift 0.15s steps(1) infinite;
}
@keyframes grainShift{
  0%{transform:translate(0,0);}12%{transform:translate(-2px,1px);}25%{transform:translate(1px,-2px);}
  37%{transform:translate(-1px,2px);}50%{transform:translate(2px,0);}62%{transform:translate(0,-1px);}
  75%{transform:translate(-2px,-2px);}87%{transform:translate(1px,1px);}100%{transform:translate(0,0);}
}

/* Cinematic letterbox bars (subtle) */
.app::before{
  content:'';position:fixed;left:0;right:0;z-index:998;pointer-events:none;
  top:0;height:3px;
  background:linear-gradient(90deg,transparent 0%,rgba(0,220,240,0.08) 20%,rgba(0,220,255,0.06) 60%,rgba(0,220,240,0.08) 80%,transparent 100%);
}

.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.bgfx::before{
  content:'';position:absolute;top:-20%;left:50%;transform:translateX(-50%);
  width:200vw;height:100vh;
  background:
    radial-gradient(ellipse 80% 60% at 30% 40%,rgba(0,100,180,0.12) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 70% 30%,rgba(0,160,220,0.08) 0%,transparent 55%),
    radial-gradient(ellipse at center,rgba(0,90,160,0.15) 0%,rgba(0,40,80,0.06) 40%,transparent 70%);
  animation:breathe 8s ease-in-out infinite;
}
.bgfx::after{
  content:'';position:absolute;bottom:-10%;right:-20%;width:90vw;height:80vh;
  background:
    radial-gradient(ellipse at 70% 80%,rgba(0,100,180,0.07) 0%,transparent 60%),
    radial-gradient(ellipse at center,rgba(0,60,120,0.04) 0%,transparent 65%);
  animation:breathe 11s ease-in-out infinite reverse;
}
@keyframes breathe{0%,100%{opacity:.5;transform:translateX(-50%) scale(1);}50%{opacity:1;transform:translateX(-50%) scale(1.12);}}
.bgfx-embers{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}

/* Cinematic scan lines */
.scan{
  position:fixed;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.022) 2px,rgba(0,0,0,0.022) 4px);
}



/* ══ CINEMATIC DUAL LOGO ══ */
.logo-w.logo-dual{
  position:relative;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:transform 0.6s cubic-bezier(.2,0,.1,1);
}

/* ── Shockwave ring — hidden by default, fires on .logo-burst ── */
.logo-shockwave{
  position:absolute;inset:0;border-radius:50%;pointer-events:none;
  border:2px solid rgba(0,220,240,0.9);
  opacity:0;transform:scale(1);
}
.logo-dual.logo-burst .logo-shockwave{
  animation:shockwave 0.7s cubic-bezier(.2,0,.1,1) forwards;
}
@keyframes shockwave{
  0%{opacity:0.9;transform:scale(1);border-color:rgba(0,220,240,0.9);}
  60%{opacity:0.3;transform:scale(2.8);border-color:rgba(0,220,255,0.4);}
  100%{opacity:0;transform:scale(3.8);border-color:rgba(0,220,255,0);}
}

/* Second delayed shockwave */
.logo-shockwave2{
  position:absolute;inset:0;border-radius:50%;pointer-events:none;
  border:1px solid rgba(255,120,0,0.7);
  opacity:0;transform:scale(1);
}
.logo-dual.logo-burst .logo-shockwave2{
  animation:shockwave2 0.9s 0.12s cubic-bezier(.2,0,.1,1) forwards;
}
@keyframes shockwave2{
  0%{opacity:0.7;transform:scale(1.1);border-color:rgba(0,180,240,0.7);}
  100%{opacity:0;transform:scale(3.2);border-color:rgba(0,180,240,0);}
}

/* Flash overlay — camera-flash white burst */
.logo-flash{
  position:absolute;inset:-6px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(200,250,255,0.95) 0%,rgba(0,200,240,0.5) 40%,transparent 70%);
  opacity:0;
}
.logo-dual.logo-burst .logo-flash{
  animation:logoFlash 0.35s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes logoFlash{
  0%{opacity:0;}
  15%{opacity:1;}
  100%{opacity:0;}
}

/* Outer dramatic rings */
.logo-ring-outer{
  position:absolute;inset:-14px;border-radius:50%;
  border:1px solid transparent;
  background:linear-gradient(var(--bg),var(--bg)) padding-box,
    conic-gradient(from 0deg, rgba(0,220,240,0), rgba(0,220,240,0.7), rgba(0,220,255,0.4), rgba(0,180,220,0.4), rgba(0,220,240,0)) border-box;
  animation:spin 10s linear infinite;
  transition:animation-duration 0.3s;
}
.logo-ring-inner{
  position:absolute;inset:-5px;border-radius:50%;
  border:1px solid transparent;
  background:linear-gradient(var(--bg),var(--bg)) padding-box,
    conic-gradient(from 180deg, rgba(255,120,0,0), rgba(0,180,220,0.4), rgba(180,0,255,0.4), rgba(0,220,255,0.3), rgba(255,120,0,0)) border-box;
  animation:spin 6s linear infinite reverse;
}

/* Third orbital ring */
.logo-ring-outer::after{
  content:'';position:absolute;inset:-8px;border-radius:50%;
  border:1px dashed rgba(0,220,255,0.15);
  animation:spin 20s linear infinite;
}

/* Speed-up class — rings charge before burst */
.logo-dual.logo-charging .logo-ring-outer{animation-duration:1.5s!important;}
.logo-dual.logo-charging .logo-ring-inner{animation-duration:0.8s!important;}

.logo-face{
  position:absolute;inset:0;border-radius:50%;
  background-size:cover;background-position:center;
  border:2px solid rgba(0,220,240,0.6);
  box-shadow:
    0 0 0 1px rgba(0,220,255,0.15),
    0 0 20px rgba(0,200,212,0.5),
    0 0 50px rgba(0,200,212,0.2),
    0 0 100px rgba(0,100,180,0.1),
    inset 0 0 20px rgba(0,0,0,0.5);
  transition:opacity 0.5s cubic-bezier(.4,0,.2,1),transform 0.6s cubic-bezier(.2,0,.1,1),filter 0.5s ease;
}
/* Default states */
.logo-face-shade{opacity:1;transform:scale(1);filter:brightness(1);}
.logo-face-wolf{opacity:0;transform:scale(0.6) rotate(15deg);filter:brightness(1.3) saturate(1.5);}

/* Wolf mode — shade collapses, wolf explodes in */
.logo-dual.wolf .logo-face-shade{opacity:0;transform:scale(1.5) rotate(-8deg);filter:brightness(2) blur(3px);}
.logo-dual.wolf .logo-face-wolf{opacity:1;transform:scale(1) rotate(0deg);filter:brightness(1.2) saturate(1.3);}

/* Wolf glow = cold cyan */
.logo-dual.wolf .logo-glow-ring{
  animation:logoGlowWolf 3.5s ease-in-out infinite!important;
}
@keyframes logoGlowWolf{
  0%,100%{box-shadow:0 0 25px rgba(0,220,255,0.5),0 0 50px rgba(0,220,255,0.2),0 0 90px rgba(0,150,255,0.1);}
  50%{box-shadow:0 0 50px rgba(0,220,255,0.7),0 0 100px rgba(0,220,255,0.3),0 0 160px rgba(0,150,255,0.15);}
}

/* During burst — logo container explodes out then snaps back */
.logo-dual.logo-burst{
  animation:logoBurst 0.7s cubic-bezier(.2,0,.1,1) forwards;
}
@keyframes logoBurst{
  0%{transform:scale(1);}
  25%{transform:scale(1.55);}
  60%{transform:scale(0.92);}
  80%{transform:scale(1.06);}
  100%{transform:scale(1);}
}

/* Pulsing halo glow */
.logo-glow-ring{
  position:absolute;inset:-3px;border-radius:50%;background:transparent;
  box-shadow:
    0 0 25px rgba(0,200,212,0.5),
    0 0 50px rgba(0,200,212,0.2),
    0 0 90px rgba(0,100,180,0.1);
  pointer-events:none;
  animation:logoGlow 3.5s ease-in-out infinite;
}
@keyframes logoGlow{
  0%,100%{box-shadow:0 0 25px rgba(0,200,212,0.5),0 0 50px rgba(0,200,212,0.2),0 0 90px rgba(0,100,180,0.1);}
  33%{box-shadow:0 0 40px rgba(0,180,220,0.5),0 0 80px rgba(0,100,180,0.25),0 0 140px rgba(0,160,220,0.1);}
  66%{box-shadow:0 0 35px rgba(0,220,255,0.4),0 0 70px rgba(0,180,255,0.15),0 0 120px rgba(0,220,255,0.05);}
}

/* ── Spinning corona dots ── */
.logo-corona{
  position:absolute;inset:-18px;border-radius:50%;pointer-events:none;
  animation:spin 8s linear infinite;
}
.logo-corona::before,.logo-corona::after{
  content:'';position:absolute;width:5px;height:5px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,220,240,1),rgba(0,220,240,0));
  box-shadow:0 0 8px 3px rgba(0,220,240,0.6);
}
.logo-corona::before{top:0;left:50%;transform:translate(-50%,0);}
.logo-corona::after{bottom:0;left:50%;transform:translate(-50%,0);background:radial-gradient(circle,rgba(0,220,255,1),rgba(0,220,255,0));box-shadow:0 0 8px 3px rgba(0,220,255,0.6);}

/* ══ BRAND TEXT CINEMATIC STATES ══ */
/* Normal shimmer — defined below in brand section */

/* Brand glitch on transition */
.brand.brand-glitch{
  animation:brandGlitch 0.6s steps(1) forwards, brandShimmer 6s linear infinite!important;
}
@keyframes brandGlitch{
  0%{clip-path:inset(0 0 0 0);transform:none;text-shadow:none;letter-spacing:.22em;}
  10%{clip-path:inset(20% 0 60% 0);transform:translate(-4px,0);filter:hue-rotate(90deg);letter-spacing:.28em;}
  20%{clip-path:inset(60% 0 10% 0);transform:translate(4px,0);filter:hue-rotate(-60deg);letter-spacing:.15em;}
  30%{clip-path:inset(0 0 0 0);transform:translate(-2px,0);letter-spacing:.35em;}
  40%{clip-path:inset(40% 0 30% 0);transform:translate(2px,0);filter:hue-rotate(45deg);letter-spacing:.08em;}
  50%{clip-path:inset(0 0 0 0);transform:none;letter-spacing:.22em;}
  60%{filter:brightness(2);letter-spacing:.25em;}
  70%{filter:brightness(1);letter-spacing:.20em;}
  100%{clip-path:inset(0 0 0 0);transform:none;letter-spacing:.22em;filter:none;}
}

/* Brand inhale — shrinks as logo explodes */
.brand.brand-inhale{
  animation:brandInhale 0.7s cubic-bezier(.2,0,.1,1) forwards;
}
@keyframes brandInhale{
  0%{transform:scale(1);letter-spacing:.22em;opacity:1;}
  30%{transform:scale(0.82);letter-spacing:.08em;opacity:0.6;filter:blur(1px);}
  65%{transform:scale(1.05);letter-spacing:.26em;opacity:1;filter:blur(0);}
  100%{transform:scale(1);letter-spacing:.22em;opacity:1;filter:none;}
}

/* Chromatic aberration ghost effect */
.brand-sub.brand-aberration{
  animation:chromaticAb 0.5s steps(1) forwards;
}
@keyframes chromaticAb{
  0%{text-shadow:none;}
  20%{text-shadow:-3px 0 rgba(255,0,100,0.6), 3px 0 rgba(0,220,255,0.6);}
  40%{text-shadow:3px 0 rgba(255,0,100,0.4), -2px 0 rgba(0,220,255,0.4);}
  60%{text-shadow:-1px 0 rgba(255,0,100,0.3), 1px 0 rgba(0,220,255,0.3);}
  100%{text-shadow:none;}
}

/* Topbar mini logo */
.mlogo.mlogo-animated{
  background-size:cover;background-position:center;
  border:1.5px solid rgba(0,220,240,0.5)!important;
  box-shadow:0 0 12px rgba(0,200,212,0.4),0 0 24px rgba(0,200,212,0.1)!important;
  animation:logoGlow 3.5s ease-in-out infinite;
  position:relative;
}
.mlogo.mlogo-animated::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:1px solid transparent;
  background:linear-gradient(var(--bg),var(--bg)) padding-box,
    conic-gradient(from 0deg, rgba(0,220,240,0), rgba(0,220,240,0.6), rgba(0,220,255,0.4), rgba(0,220,240,0)) border-box;
  animation:spin 6s linear infinite;
}

/* ══ SUBMIT CINEMATIC FLASH OVERLAY ══ */
#cinematic-flash{
  position:fixed;inset:0;z-index:9999;pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(0,220,240,0.95) 0%, rgba(0,80,160,0.8) 40%, rgba(0,4,14,0.97) 100%);
  opacity:0;
}
#cinematic-flash.flash-go{
  animation:cinematicFlash 1.2s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes cinematicFlash{
  0%{opacity:0;}
  12%{opacity:1;}
  35%{opacity:0.85;}
  60%{opacity:0.4;}
  100%{opacity:0;}
}

/* Submit button explosion state */
.subbtn.submitting-burst, .qp-submit-btn.submitting-burst{
  animation:submitBurst 0.5s cubic-bezier(.2,0,.1,1) forwards;
}
@keyframes submitBurst{
  0%{transform:scale(1);box-shadow:0 0 20px rgba(0,150,200,0.15);}
  40%{transform:scale(1.12);box-shadow:0 0 80px rgba(0,220,240,0.8),0 0 140px rgba(0,180,220,0.35);}
  70%{transform:scale(0.96);}
  100%{transform:scale(1);box-shadow:0 0 20px rgba(0,150,200,0.15);}
}


/* ══ CINEMATIC TOPBAR ══ */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(2,6,16,0.98);
  backdrop-filter:blur(32px) saturate(1.5);
  border-bottom:1px solid rgba(180,0,180,0.15);
  padding:8px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  box-shadow:0 1px 40px rgba(0,60,120,0.12),0 4px 0 rgba(0,0,0,0.4);
}
.topbar::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,80,120,0.04) 0%,rgba(0,150,200,0.03) 50%,rgba(0,200,255,0.02) 100%);
  pointer-events:none;
}
.topbar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,
    transparent 0%,
    rgba(0,220,240,0.0) 5%,
    rgba(0,220,240,0.5) 25%,
    rgba(0,220,255,0.3) 50%,
    rgba(0,220,240,0.5) 75%,
    rgba(0,220,240,0.0) 95%,
    transparent 100%);
  animation:topbarGlow 4s ease-in-out infinite;
}
@keyframes topbarGlow{
  0%,100%{opacity:0.6;}
  50%{opacity:1;filter:blur(0.5px);}
}
.topbar-brand{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(.9rem,3vw,1.15rem);
  color:var(--rb);
  text-shadow:0 0 20px var(--rg),0 0 50px rgba(0,100,180,0.2),0 0 80px rgba(0,220,255,0.08);
  letter-spacing:.2em;
  animation:brandFlicker 12s ease-in-out infinite;
}
@keyframes brandFlicker{
  0%,90%,92%,94%,100%{opacity:1;text-shadow:0 0 20px var(--rg),0 0 50px rgba(0,100,180,0.2);}
  91%,93%{opacity:.7;text-shadow:0 0 10px var(--rg);}
}
.topbar-right{display:flex;align-items:center;gap:8px;}
.session-badge{font-family:'Share Tech Mono',monospace;font-size:.6rem;color:var(--green);letter-spacing:.1em;display:flex;align-items:center;gap:6px;}
.session-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;box-shadow:0 0 6px rgba(16,185,129,0.6);}
.login-btn{
  font-family:'Share Tech Mono',monospace;font-size:.6rem;color:var(--r);
  border:1px solid var(--brb);background:rgba(0,200,212,0.04);
  padding:5px 12px;border-radius:6px;cursor:pointer;letter-spacing:.1em;
  transition:all .25s;
  box-shadow:0 0 12px rgba(0,200,212,0.1);
}
.login-btn:hover{background:var(--rd);box-shadow:0 0 20px rgba(0,200,212,0.25);transform:translateY(-1px);}
.logout-btn{font-family:'Share Tech Mono',monospace;font-size:.58rem;color:var(--td);border:1px solid rgba(255,255,255,0.08);background:none;padding:4px 10px;border-radius:6px;cursor:pointer;letter-spacing:.08em;transition:all .2s;}
.logout-btn:hover{color:var(--red);border-color:rgba(230,57,70,0.4);}

/* HOLD BUTTON */
.hold-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;}
.hold-btn{width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);cursor:pointer;position:relative;z-index:2;transition:all .2s;}
.hold-btn:active{background:var(--rd);}
.hold-ring{position:absolute;inset:-4px;pointer-events:none;display:none;}
.hold-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.hold-circle{fill:none;stroke:var(--rb);stroke-width:2;stroke-dasharray:100;stroke-dashoffset:100;stroke-linecap:round;transition:stroke-dashoffset .05s linear;}

/* PAGES */
.pg{position:relative;z-index:2;max-width:880px;margin:0 auto;padding:0 16px 80px;width:100%;}
.hd{text-align:center;padding:40px 0 28px;}
.hd::after{
  content:'';display:block;height:1px;
  background:linear-gradient(90deg,
    transparent 0%,
    rgba(0,220,240,0.0) 5%,
    rgba(0,220,240,1) 35%,
    rgba(0,220,255,0.7) 50%,
    rgba(0,180,220,0.8) 65%,
    rgba(0,220,240,0.0) 95%,
    transparent 100%);
  margin-top:28px;
  box-shadow:0 0 16px rgba(0,220,240,0.4),0 0 32px rgba(0,220,255,0.15);
  animation:sweepLine 6s ease-in-out infinite;
}
@keyframes sweepLine{
  0%,100%{opacity:0.6;filter:blur(0);}
  50%{opacity:1;filter:blur(0.3px);}
}
.logo-w{position:relative;display:inline-block;margin-bottom:12px;}
.logo-ring{position:absolute;inset:-7px;border-radius:50%;border:1px dashed rgba(220,16,16,0.4);animation:spin 14s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.logo-img{display:block;border-radius:50%;border:2px solid var(--r);box-shadow:0 0 30px var(--rg),0 0 60px rgba(0,220,255,0.2);object-fit:cover;background:rgba(0,200,212,0.15);}

/* CINEMATIC BRAND TEXT */
.brand{
  font-family:'Cinzel Decorative',serif;font-weight:900;
  color:transparent;
  background:linear-gradient(135deg,#00e5f0 0%,#fff0fa 30%,#00e5f0 50%,#ff9500 75%,#00e5f0 100%);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;
  text-shadow:none;
  filter:drop-shadow(0 0 20px rgba(0,220,240,0.6)) drop-shadow(0 0 60px rgba(0,220,240,0.2));
  letter-spacing:.22em;line-height:1.1;
  font-size:clamp(1.8rem,7vw,3.4rem);
  word-break:keep-all;white-space:nowrap;
  animation:brandShimmer 6s linear infinite, flicker 9s ease-in-out infinite;
}
@keyframes brandShimmer{
  0%{background-position:200% 0;}
  100%{background-position:-200% 0;}
}
@keyframes flicker{
  0%,93%,95%,97%,100%{opacity:1;filter:drop-shadow(0 0 20px rgba(0,220,240,0.6)) drop-shadow(0 0 60px rgba(0,220,240,0.2));}
  94%,96%{opacity:.75;filter:drop-shadow(0 0 8px rgba(0,220,240,0.3));}
}
.brand-sub{
  font-size:clamp(.58rem,2vw,.72rem);letter-spacing:clamp(.12em,1.5vw,.25em);
  color:var(--td);text-transform:uppercase;margin-top:6px;
  font-family:'Cinzel',serif;font-weight:400;

.atag{font-size:clamp(.66rem,2vw,.72rem);padding:3px 11px;border-radius:999px;font-family:'Share Tech Mono',monospace;word-break:break-word;}
.t-uc{background:rgba(34,197,94,0.13);border:1px solid rgba(34,197,94,0.35);color:#22c55e;}
.t-uw{background:rgba(239,68,68,0.13);border:1px solid rgba(239,68,68,0.35);color:#ef4444;}
.t-c{background:rgba(34,197,94,0.13);border:1px solid rgba(34,197,94,0.35);color:#22c55e;}
.t-sk{background:rgba(100,100,100,0.08);border:1px solid rgba(100,100,100,0.25);color:#555;}
.expl{font-size:clamp(.74rem,2vw,.78rem);color:#777;line-height:1.6;border-top:1px solid rgba(255,255,255,0.04);padding-top:9px;font-weight:300;word-break:break-word;}
.expl::before{content:'💡 ';}
.ba{display:flex;justify-content:center;gap:12px;margin-top:28px;flex-wrap:wrap;}
.errmsg{color:#ff6060;text-align:center;font-size:.83rem;margin:8px 0;padding:12px 16px;background:rgba(255,0,60,0.06);border-radius:10px;border:1px solid rgba(255,0,60,0.2);word-break:break-word;font-family:'Share Tech Mono',monospace;letter-spacing:.06em;}

/* ═══════════════════════════════
   RESULTS SCREEN — CINEMATIC 10X
═══════════════════════════════ */
.res-shell{
  position:relative;z-index:2;
  display:grid;
  grid-template-columns:1fr 400px;
  gap:0;
  min-height:calc(100vh - 52px);
  max-width:1240px;
  margin:0 auto;
  align-items:start;
}
@media(max-width:900px){.res-shell{grid-template-columns:1fr;}}
.res-main{padding:clamp(16px,3vw,28px) clamp(14px,3vw,24px) 80px;display:flex;flex-direction:column;gap:14px;}

/* ── HERO CARD ── */
.res-hero{
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(2,12,28,0.99),rgba(2,6,16,0.99));
  border:1px solid rgba(255,255,255,0.09);border-radius:22px;
  box-shadow:0 0 80px rgba(0,120,180,0.08),0 0 140px rgba(0,220,255,0.03);
  animation:resSlideUp .65s cubic-bezier(.2,0,.1,1) both;
}
@keyframes resSlideUp{from{opacity:0;transform:translateY(36px);}to{opacity:1;transform:none;}}
.res-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--rb),rgba(0,220,255,0.5),var(--rb),transparent);}
.res-hero::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(0,120,180,0.1) 0%,transparent 65%);pointer-events:none;}
.res-hero-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.res-particle{position:absolute;border-radius:50%;animation:resFloat linear infinite;}
@keyframes resFloat{0%{transform:translateY(0) scale(1);opacity:.7;}50%{transform:translateY(-40px) scale(1.4);opacity:.9;}100%{transform:translateY(-80px) scale(0.3);opacity:0;}}
.res-hero-inner{position:relative;z-index:2;padding:clamp(28px,6vw,52px) clamp(20px,5vw,44px) clamp(24px,5vw,40px);text-align:center;}
.res-mission-tag{font-family:'Share Tech Mono',monospace;font-size:clamp(.48rem,1.5vw,.58rem);color:var(--td);letter-spacing:.24em;text-transform:uppercase;margin-bottom:24px;display:flex;align-items:center;justify-content:center;gap:8px;}
.res-mission-tag::before,.res-mission-tag::after{content:'';flex:1;max-width:60px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1));}
.res-mission-tag::after{background:linear-gradient(90deg,rgba(255,255,255,0.1),transparent);}
.res-sigil{font-size:clamp(4rem,14vw,7rem);line-height:1;margin-bottom:4px;animation:resSigilPop .9s cubic-bezier(.2,0,.1,1) .15s both;filter:drop-shadow(0 0 30px currentColor);}
@keyframes resSigilPop{from{opacity:0;transform:scale(.2) rotate(-20deg);}60%{transform:scale(1.18) rotate(3deg);}to{opacity:1;transform:scale(1) rotate(0deg);}}
.res-rank-name{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(1.3rem,5vw,2.6rem);
  font-weight:900;letter-spacing:.18em;
  margin:14px 0 10px;line-height:1.1;
  animation:resFadeUp .65s ease .35s both;
}
@keyframes resFadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.res-rank-desc{font-size:clamp(.72rem,2vw,.85rem);color:var(--td);font-weight:300;max-width:400px;margin:0 auto 28px;line-height:1.65;animation:resFadeUp .65s ease .48s both;font-style:italic;}
.res-score-row{display:flex;justify-content:center;align-items:stretch;gap:0;margin-bottom:28px;animation:resFadeUp .65s ease .58s both;border:1px solid rgba(255,255,255,0.06);border-radius:16px;overflow:hidden;background:rgba(0,0,0,0.2);}
.res-stat-big{padding:clamp(14px,3vw,22px) clamp(18px,4vw,36px);text-align:center;flex:1;position:relative;}
.res-stat-big+.res-stat-big::before{content:'';position:absolute;left:0;top:20%;height:60%;width:1px;background:rgba(255,255,255,0.07);}
.res-stat-num{font-family:'Cinzel Decorative',serif;font-size:clamp(1.7rem,5vw,2.6rem);font-weight:900;color:var(--t);line-height:1;}
.res-stat-lbl{font-family:'Share Tech Mono',monospace;font-size:clamp(.44rem,1.4vw,.52rem);color:var(--td);letter-spacing:.22em;text-transform:uppercase;margin-top:6px;}
.res-arc-wrap{max-width:360px;margin:0 auto;animation:resFadeUp .65s ease .68s both;}
.res-arc-svg{width:100%;display:block;}
.res-arc-labels{display:flex;justify-content:space-between;font-family:'Share Tech Mono',monospace;font-size:clamp(.48rem,1.5vw,.56rem);color:var(--td);letter-spacing:.1em;margin-top:5px;}

/* ── STAT PILLS ── */
.res-pills{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;animation:resSlideUp .5s ease .28s both;}
.res-pill{border-radius:16px;padding:clamp(14px,3vw,20px) 10px;text-align:center;border:1px solid rgba(255,255,255,0.07);position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;}
.res-pill:hover{transform:translateY(-2px);}
.res-pill::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;}
.res-pill-ok{background:linear-gradient(160deg,rgba(34,197,94,0.08),rgba(34,197,94,0.03));border-color:rgba(34,197,94,0.22);}
.res-pill-ok::before{background:linear-gradient(90deg,transparent,rgba(34,197,94,0.4),transparent);}
.res-pill-ok:hover{box-shadow:0 4px 24px rgba(34,197,94,0.12);}
.res-pill-err{background:linear-gradient(160deg,rgba(239,68,68,0.08),rgba(239,68,68,0.03));border-color:rgba(239,68,68,0.22);}
.res-pill-err::before{background:linear-gradient(90deg,transparent,rgba(239,68,68,0.4),transparent);}
.res-pill-err:hover{box-shadow:0 4px 24px rgba(239,68,68,0.12);}
.res-pill-skip{background:linear-gradient(160deg,rgba(100,116,139,0.08),rgba(100,116,139,0.03));border-color:rgba(100,116,139,0.18);}
.res-pill-skip::before{background:linear-gradient(90deg,transparent,rgba(100,116,139,0.3),transparent);}
.res-pill-icon{font-size:1.2rem;margin-bottom:8px;}
.res-pill-ok .res-pill-icon{color:#22c55e;}
.res-pill-err .res-pill-icon{color:#ef4444;}
.res-pill-skip .res-pill-icon{color:#64748b;}
.res-pill-num{font-family:'Cinzel Decorative',serif;font-size:clamp(1.6rem,5vw,2rem);font-weight:900;color:var(--t);line-height:1;}
.res-pill-lbl{font-family:'Share Tech Mono',monospace;font-size:clamp(.44rem,1.4vw,.5rem);color:var(--td);letter-spacing:.18em;text-transform:uppercase;margin-top:5px;}

/* ── GENERIC CARD ── */
.res-card{background:linear-gradient(145deg,rgba(2,10,24,0.9),rgba(5,1,14,0.95));border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:clamp(14px,3vw,20px);animation:resSlideUp .5s ease both;position:relative;overflow:hidden;}
.res-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,170,210,0.25),transparent);}
.res-card-title{font-family:'Share Tech Mono',monospace;font-size:clamp(.5rem,1.6vw,.56rem);color:var(--r);letter-spacing:.28em;text-transform:uppercase;margin-bottom:16px;}

/* ── SUBJECT BARS ── */
.rsub-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.rsub-name{font-family:'Share Tech Mono',monospace;font-size:clamp(.5rem,1.6vw,.58rem);color:var(--td);letter-spacing:.06em;min-width:90px;flex-shrink:0;word-break:break-word;}
.rsub-bar-wrap{flex:1;height:7px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden;}
.rsub-bar{height:100%;width:0;border-radius:4px;transition:width 1.4s cubic-bezier(.2,0,.1,1);box-shadow:0 0 8px currentColor;}
.rsub-num{font-family:'Share Tech Mono',monospace;font-size:clamp(.52rem,1.6vw,.6rem);min-width:38px;text-align:right;flex-shrink:0;font-weight:600;}

/* ── LEADERBOARD ── */
.lb-loading{font-family:'Share Tech Mono',monospace;font-size:.54rem;color:var(--td);letter-spacing:.12em;padding:10px 0;animation:flicker 1.5s infinite;}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,0.05);background:rgba(255,255,255,0.015);margin-bottom:7px;transition:all .2s;}
.lb-row:hover{border-color:rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);}
.lb-row.lb-me{border-color:var(--brb);background:rgba(0,200,212,0.07);box-shadow:0 0 20px rgba(0,200,212,0.07);}
.lb-rank{font-family:'Share Tech Mono',monospace;font-size:.75rem;min-width:28px;text-align:center;flex-shrink:0;}
.lb-info{flex:1;min-width:0;}
.lb-name{font-family:'Oswald',sans-serif;font-size:.85rem;font-weight:600;color:var(--t);letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb-meta{font-family:'Share Tech Mono',monospace;font-size:.46rem;color:var(--td);letter-spacing:.05em;margin-top:2px;}
.lb-score{text-align:right;flex-shrink:0;}
.lb-pct{font-family:'Cinzel Decorative',serif;font-size:.95rem;font-weight:700;}
.lb-time{font-family:'Share Tech Mono',monospace;font-size:.46rem;color:var(--td);margin-top:1px;}

/* ── ACTIONS ── */
.res-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px;}

/* ── EXPLANATION BUTTON ── */
.res-expl-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:14px 20px;
  background:linear-gradient(135deg,rgba(0,200,212,0.1),rgba(0,60,120,0.08));
  border:1px solid var(--brb);border-radius:13px;
  color:var(--rb);font-family:'Oswald',sans-serif;
  font-size:clamp(.82rem,2.5vw,.95rem);font-weight:600;
  letter-spacing:.15em;text-transform:uppercase;
  cursor:pointer;transition:all .25s;
  animation:resSlideUp .5s ease .6s both;
}
.res-expl-btn:hover{background:linear-gradient(135deg,rgba(0,200,212,0.18),rgba(0,60,120,0.14));box-shadow:0 0 30px rgba(0,200,212,0.2);transform:translateY(-1px);}

/* ── EXPLANATION MODAL ── */
.expl-modal-overlay{position:fixed;inset:0;background:rgba(0,4,12,0.90);backdrop-filter:blur(12px);z-index:150;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:explFadeIn .25s ease both;}
@media(min-width:600px){.expl-modal-overlay{align-items:center;padding:20px;}}
@keyframes explFadeIn{from{opacity:0;}to{opacity:1;}}
.expl-modal{
  background:linear-gradient(160deg,rgba(10,2,24,0.99),rgba(2,6,16,0.99));
  border:1px solid var(--brb);
  border-radius:20px 20px 0 0;
  width:100%;max-width:740px;
  max-height:90vh;
  display:flex;flex-direction:column;
  animation:explSlideUp .3s cubic-bezier(.2,0,.1,1) both;
  position:relative;overflow:hidden;
}
@media(min-width:600px){.expl-modal{border-radius:20px;max-height:85vh;}}
@keyframes explSlideUp{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:none;}}
.expl-modal::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--rb),transparent);}
.expl-modal-header{padding:18px 20px 14px;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.expl-modal-title{font-family:'Cinzel Decorative',serif;font-size:clamp(.85rem,3vw,1rem);color:var(--rb);letter-spacing:.15em;}
.expl-modal-close{background:none;border:1px solid rgba(255,255,255,0.1);color:var(--td);font-family:'Share Tech Mono',monospace;font-size:.6rem;padding:5px 12px;border-radius:6px;cursor:pointer;letter-spacing:.1em;transition:all .2s;}
.expl-modal-close:hover{color:#fff;border-color:rgba(255,255,255,0.3);}
.expl-modal-body{flex:1;overflow-y:auto;padding:16px 20px 24px;}
.expl-item{margin-bottom:20px;padding:14px 16px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:14px;border-left:3px solid #333;transition:border-color .2s;}
.expl-item.expl-ok{border-left-color:rgba(34,197,94,0.6);}
.expl-item.expl-err{border-left-color:rgba(239,68,68,0.6);}
.expl-item.expl-skip{border-left-color:rgba(100,116,139,0.4);}
.expl-item-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.expl-item-num{font-family:'Share Tech Mono',monospace;font-size:.56rem;color:var(--r);letter-spacing:.15em;}
.expl-item-verdict{font-family:'Share Tech Mono',monospace;font-size:.5rem;padding:2px 8px;border-radius:4px;letter-spacing:.08em;}
.expl-ok .expl-item-verdict{background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.3);color:#22c55e;}
.expl-err .expl-item-verdict{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);color:#ef4444;}
.expl-skip .expl-item-verdict{background:rgba(100,116,139,0.08);border:1px solid rgba(100,116,139,0.2);color:#64748b;}
.expl-item-q{font-size:clamp(.8rem,2.5vw,.88rem);color:#e0d8f0;line-height:1.6;margin-bottom:10px;font-weight:300;word-break:break-word;}
.expl-item-answer{font-family:'Share Tech Mono',monospace;font-size:.58rem;color:var(--td);letter-spacing:.08em;margin-bottom:8px;}
.expl-item-answer span{color:#22c55e;}
.expl-item-txt{font-size:clamp(.76rem,2.2vw,.82rem);color:#aaa;line-height:1.7;font-weight:300;word-break:break-word;padding-top:8px;border-top:1px solid rgba(255,255,255,0.05);}
.expl-item-txt::before{content:'💡 ';font-size:.9em;}

/* ── RIGHT PANEL ── */
.res-panel{
  border-left:1px solid rgba(255,255,255,0.06);
  background:rgba(3,0,10,0.7);
  backdrop-filter:blur(10px);
  position:sticky;top:52px;
  height:calc(100vh - 52px);
  overflow-y:auto;
  display:flex;flex-direction:column;
}
@media(max-width:900px){.res-panel{position:relative;top:0;height:auto;border-left:none;border-top:1px solid rgba(255,255,255,0.06);max-height:none;}}
.res-panel-header{padding:16px 18px;border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
.res-panel-title{font-family:'Cinzel Decorative',serif;font-size:.88rem;color:var(--rb);letter-spacing:.15em;}
.res-panel-sub{font-family:'Share Tech Mono',monospace;font-size:.5rem;color:var(--td);letter-spacing:.12em;}

/* ── DOT GRID ── */
.res-dot-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:14px;border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;}
@media(max-width:900px){.res-dot-grid{grid-template-columns:repeat(10,1fr);}}
@media(max-width:480px){.res-dot-grid{grid-template-columns:repeat(6,1fr);}}
.res-dot{
  aspect-ratio:1;border-radius:9px;
  font-family:'Share Tech Mono',monospace;font-size:.5rem;
  cursor:pointer;transition:all .18s;
  display:flex;align-items:center;justify-content:center;
  border:1px solid transparent;
}
.res-dot-ok{background:rgba(34,197,94,0.12);border-color:rgba(34,197,94,0.3);color:#22c55e;}
.res-dot-err{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.3);color:#ef4444;}
.res-dot-skip{background:rgba(100,116,139,0.08);border-color:rgba(100,116,139,0.2);color:#64748b;}
.res-dot-active{transform:scale(1.2);box-shadow:0 0 16px rgba(0,220,240,0.5);border-color:var(--rb)!important;color:#fff!important;z-index:1;position:relative;}
.res-dot-ok.res-dot-active{box-shadow:0 0 16px rgba(34,197,94,0.6);}
.res-dot-err.res-dot-active{box-shadow:0 0 16px rgba(239,68,68,0.6);}

/* ── QUESTION DETAIL ── */
.res-q-detail{flex:1;padding:14px 16px;overflow-y:auto;}
.res-q-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:48px 20px;text-align:center;}
.res-q-placeholder-sigil{font-size:2rem;opacity:.2;}
.res-q-placeholder-txt{font-family:'Share Tech Mono',monospace;font-size:.56rem;color:var(--td);letter-spacing:.14em;}
.rqd-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
.rqd-num{font-family:'Share Tech Mono',monospace;font-size:.58rem;color:var(--r);letter-spacing:.15em;}
.rqd-sub{font-family:'Share Tech Mono',monospace;font-size:.5rem;color:var(--td);letter-spacing:.08em;}
.rqd-verdict{font-family:'Share Tech Mono',monospace;font-size:.5rem;padding:3px 9px;border-radius:5px;letter-spacing:.08em;margin-left:auto;}
.rqd-ok{background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.3);color:#22c55e;}
.rqd-err{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);color:#ef4444;}
.rqd-skip{background:rgba(100,116,139,0.08);border:1px solid rgba(100,116,139,0.2);color:#64748b;}
.rqd-qtxt{font-size:clamp(.82rem,2.5vw,.9rem);color:#e8e0f8;line-height:1.7;margin-bottom:13px;font-weight:300;word-break:break-word;}
.rqd-opts{display:flex;flex-direction:column;gap:7px;margin-bottom:10px;}
.rqd-opt{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.05);background:rgba(255,255,255,0.02);word-break:break-word;}
.rqd-opt-correct{background:rgba(34,197,94,0.08);border-color:rgba(34,197,94,0.3);}
.rqd-opt-wrong{background:rgba(239,68,68,0.08);border-color:rgba(239,68,68,0.3);}
.rqd-opt-key{font-family:'Share Tech Mono',monospace;font-size:.62rem;color:var(--td);min-width:16px;flex-shrink:0;margin-top:2px;}
.rqd-opt-correct .rqd-opt-key{color:#22c55e;}
.rqd-opt-wrong .rqd-opt-key{color:#ef4444;}
.rqd-opt-txt{font-size:.78rem;color:#ccc;line-height:1.45;flex:1;}
.rqd-opt-tag{font-family:'Share Tech Mono',monospace;font-size:.44rem;padding:2px 6px;border-radius:4px;letter-spacing:.08em;flex-shrink:0;margin-top:3px;}
.rqd-tag-correct{background:rgba(34,197,94,0.15);color:#22c55e;border:1px solid rgba(34,197,94,0.3);}
.rqd-tag-wrong{background:rgba(239,68,68,0.12);color:#ef4444;border:1px solid rgba(239,68,68,0.3);}
.rqd-skipped-note{font-family:'Share Tech Mono',monospace;font-size:.52rem;color:#64748b;letter-spacing:.08em;margin-bottom:10px;padding:9px;background:rgba(100,116,139,0.06);border-radius:8px;border:1px solid rgba(100,116,139,0.15);}
.rqd-nav{display:flex;gap:8px;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.05);}
.rqd-navbtn{flex:1;padding:9px;border-radius:9px;font-family:'Oswald',sans-serif;font-size:.76rem;font-weight:500;letter-spacing:.1em;cursor:pointer;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);color:var(--td);transition:all .2s;}
.rqd-navbtn:hover:not(:disabled){border-color:var(--brb);color:var(--rb);background:rgba(0,200,212,0.06);}
.rqd-navbtn:disabled{opacity:.2;cursor:not-allowed;}
.home-cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
@media(max-width:560px){.home-cards{grid-template-columns:repeat(2,1fr);}}
.hcard{padding:18px 12px;text-align:center;margin-bottom:0;cursor:pointer;transition:all .28s;position:relative;overflow:hidden;}
.hcard::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(0,120,180,0.07) 0%,transparent 70%);opacity:0;transition:opacity .3s;}
.hcard:hover::before{opacity:1;}
.hcard:hover{border-color:rgba(0,220,240,0.4)!important;transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,120,180,0.15)!important;}
.hcard-name{font-family:'Cinzel Decorative',serif;font-size:clamp(.85rem,3vw,1rem);color:var(--rb);margin-bottom:6px;text-shadow:0 0 15px rgba(0,220,240,0.3);}
.hcard-full{font-size:clamp(.54rem,1.8vw,.62rem);color:var(--td);margin-bottom:9px;letter-spacing:.04em;line-height:1.3;word-break:break-word;}
.hcard-tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;}
.htag{font-size:clamp(.5rem,1.6vw,.58rem);background:rgba(180,0,200,0.08);border:1px solid rgba(180,0,200,0.18);border-radius:4px;padding:2px 6px;color:var(--td);word-break:break-word;transition:all .2s;}
.hcard:hover .htag{border-color:rgba(0,220,240,0.25);color:#c090d0;}

/* SOURCE TAG */
.src-tag{display:inline-flex;align-items:center;gap:4px;font-family:'Share Tech Mono',monospace;font-size:.52rem;letter-spacing:.1em;padding:2px 8px;border-radius:4px;margin-bottom:6px;}
.src-ai{background:rgba(0,200,212,0.1);border:1px solid rgba(0,200,212,0.25);color:var(--r);}
.src-bank{background:rgba(240,165,0,0.1);border:1px solid rgba(240,165,0,0.25);color:var(--gold);}

/* LOGIN MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,4,12,0.88);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:linear-gradient(135deg,rgba(3,10,22,0.99),rgba(2,6,16,0.99));border:1px solid var(--brb);border-radius:16px;padding:32px 24px;width:100%;max-width:380px;position:relative;}
.modal-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--rb),transparent);}
.modal-title{font-family:'Cinzel Decorative',serif;font-size:1.1rem;color:var(--rb);letter-spacing:.15em;margin-bottom:6px;text-align:center;}
.modal-sub{font-size:.62rem;color:var(--td);letter-spacing:.15em;text-align:center;margin-bottom:24px;font-family:'Share Tech Mono',monospace;}
.modal-field{margin-bottom:14px;}
.modal-label{font-family:'Share Tech Mono',monospace;font-size:.58rem;color:var(--td);letter-spacing:.2em;display:block;margin-bottom:6px;}
.modal-input{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--br);border-radius:8px;color:var(--t);font-family:'Share Tech Mono',monospace;font-size:.82rem;padding:10px 14px;outline:none;transition:border-color .2s;letter-spacing:.05em;}
.modal-input:focus{border-color:var(--rb);}
.modal-input.error{border-color:var(--red);}
.modal-err{font-family:'Share Tech Mono',monospace;font-size:.58rem;color:var(--red);letter-spacing:.1em;margin-top:8px;display:none;}
.modal-btn{width:100%;padding:12px;background:linear-gradient(135deg,#007a8a,#003d5c);border:1px solid var(--rb);border-radius:10px;color:#fff;font-family:'Oswald',sans-serif;font-size:.9rem;font-weight:600;letter-spacing:.15em;cursor:pointer;transition:all .2s;margin-top:8px;}
.modal-btn:hover{box-shadow:0 0 30px rgba(0,150,200,0.4);}
.modal-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--td);font-size:1rem;cursor:pointer;padding:4px;transition:color .2s;}
.modal-close:hover{color:var(--t);}

/* ADMIN PANEL */
.admin-overlay{position:fixed;inset:0;background:rgba(0,4,12,0.92);backdrop-filter:blur(10px);z-index:200;display:flex;flex-direction:column;}
.admin-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--br);background:rgba(2,6,14,0.98);}
.admin-title{font-family:'Cinzel Decorative',serif;font-size:.9rem;color:var(--gold);letter-spacing:.2em;}
.admin-close{background:none;border:1px solid rgba(255,255,255,0.1);color:var(--td);font-family:'Share Tech Mono',monospace;font-size:.6rem;padding:6px 12px;border-radius:6px;cursor:pointer;letter-spacing:.1em;transition:all .2s;}
.admin-close:hover{border-color:var(--red);color:var(--red);}
.admin-body{display:flex;flex:1;overflow:hidden;}
.admin-sidebar{width:200px;flex-shrink:0;border-right:1px solid var(--br);padding:12px 8px;overflow-y:auto;background:rgba(2,6,14,0.8);}
.admin-tab{display:block;width:100%;text-align:left;background:none;border:none;color:var(--td);font-family:'Share Tech Mono',monospace;font-size:.58rem;padding:8px 12px;border-radius:6px;cursor:pointer;letter-spacing:.08em;transition:all .2s;margin-bottom:2px;}
.admin-tab:hover{background:rgba(255,255,255,0.04);color:var(--t);}
.admin-tab.active{background:rgba(0,200,212,0.1);color:var(--rb);border-left:2px solid var(--rb);}
.admin-divider{height:1px;background:var(--br);margin:8px 4px;}
.admin-content{flex:1;overflow-y:auto;padding:20px;}
.admin-section-title{font-family:'Share Tech Mono',monospace;font-size:.6rem;color:var(--gold);letter-spacing:.25em;text-transform:uppercase;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(240,165,0,0.2);}
.admin-field{margin-bottom:14px;}
.admin-label{font-family:'Share Tech Mono',monospace;font-size:.58rem;color:var(--td);letter-spacing:.15em;display:block;margin-bottom:6px;}
.admin-input{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--br);border-radius:8px;color:var(--t);font-family:'Share Tech Mono',monospace;font-size:.78rem;padding:8px 12px;outline:none;transition:border-color .2s;}
.admin-input:focus{border-color:var(--rb);}
.admin-select{width:100%;background:rgba(2,6,14,0.9);border:1px solid var(--br);border-radius:8px;color:var(--t);font-family:'Share Tech Mono',monospace;font-size:.78rem;padding:8px 12px;outline:none;}
.admin-textarea{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--br);border-radius:8px;color:var(--t);font-family:'Share Tech Mono',monospace;font-size:.72rem;padding:8px 12px;outline:none;resize:vertical;min-height:80px;}
.admin-btn{padding:9px 18px;background:linear-gradient(135deg,rgba(0,70,100,0.5),rgba(0,40,80,0.4));border:1px solid var(--brb);border-radius:8px;color:#fff;font-family:'Share Tech Mono',monospace;font-size:.62rem;cursor:pointer;letter-spacing:.1em;transition:all .2s;margin-top:8px;}
.admin-btn:hover{box-shadow:0 0 20px rgba(0,150,200,0.3);}
.admin-btn.danger{background:rgba(230,57,70,0.15);border-color:rgba(230,57,70,0.4);color:var(--red);}
.admin-q-row{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.admin-q-info{flex:1;min-width:0;}
.admin-q-text{font-size:.72rem;color:var(--t);line-height:1.5;word-break:break-word;margin-bottom:4px;}
.admin-q-meta{font-family:'Share Tech Mono',monospace;font-size:.52rem;color:var(--td);letter-spacing:.06em;}
.admin-q-del{background:none;border:1px solid rgba(230,57,70,0.3);color:var(--red);font-family:'Share Tech Mono',monospace;font-size:.55rem;padding:4px 8px;border-radius:4px;cursor:pointer;flex-shrink:0;transition:all .2s;}
.admin-q-del:hover{background:rgba(230,57,70,0.1);}
.admin-status{font-family:'Share Tech Mono',monospace;font-size:.6rem;padding:8px 12px;border-radius:6px;margin-top:8px;letter-spacing:.08em;}
.admin-status.ok{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:var(--green);}
.admin-status.err{background:rgba(230,57,70,0.08);border:1px solid rgba(230,57,70,0.3);color:var(--red);}
.admin-stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;}
.admin-stat-box{background:rgba(255,255,255,0.02);border:1px solid var(--br);border-radius:8px;padding:12px;text-align:center;}
.admin-stat-val{font-family:'Cinzel Decorative',serif;font-size:1.4rem;color:var(--rb);display:block;}
.admin-stat-lbl{font-family:'Share Tech Mono',monospace;font-size:.52rem;color:var(--td);letter-spacing:.15em;margin-top:4px;display:block;}
@media(max-width:600px){.admin-body{flex-direction:column;}.admin-sidebar{width:100%;border-right:none;border-bottom:1px solid var(--br);display:flex;flex-wrap:wrap;gap:4px;}.admin-tab{width:auto;}}

/* ══════════════════════════════════════════
   FULL-PAGE QUIZ LAYOUT — immersive, spacious
   ══════════════════════════════════════════ */
.quiz-shell{
  display:grid;
  grid-template-columns:1fr 260px;
  grid-template-rows:1fr;
  height:calc(100vh - 52px); /* fill below topbar */
  max-height:calc(100vh - 52px);
  position:relative;z-index:2;
  overflow:hidden;
}
/* LEFT — main question area fills all remaining height */
.quiz-main{
  display:flex;flex-direction:column;
  overflow-y:auto;
  padding:28px 32px 28px 28px;
  scrollbar-width:thin;scrollbar-color:var(--br) transparent;
}
/* RIGHT — side panel */
.quiz-panel{
  border-left:1px solid var(--br);
  background:rgba(4,0,14,0.97);
  display:flex;flex-direction:column;
  overflow-y:auto;
  padding:20px 14px;
  gap:12px;
  scrollbar-width:thin;scrollbar-color:var(--br) transparent;
}
@media(max-width:800px){
  .quiz-shell{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;max-height:none;overflow:visible;}
  .quiz-panel{border-left:none;border-top:1px solid var(--br);flex-direction:row;flex-wrap:wrap;padding:12px;gap:8px;overflow:visible;}
  .quiz-main{padding:18px 16px;overflow:visible;}
  .qp-panel-card{flex:1;min-width:160px;}
}

/* QUESTION CARD — full-width, dramatic */
.sq-card{
  flex:1; /* grow to fill .quiz-main */
  background:linear-gradient(160deg,rgba(12,2,26,0.99) 0%,rgba(5,0,16,1) 60%,rgba(14,0,30,0.99) 100%);
  border:1px solid rgba(0,200,212,0.18);
  border-radius:20px;
  padding:40px 44px;
  position:relative;overflow:hidden;
  box-shadow:0 0 60px rgba(0,120,180,0.07),0 8px 60px rgba(0,0,0,0.6);
  display:flex;flex-direction:column;
  min-height:0;
}
.sq-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent 0%,var(--rb) 40%,rgba(0,220,255,0.6) 70%,transparent 100%);
}
.sq-card::after{
  content:'';position:absolute;bottom:0;right:0;
  width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(180,0,220,0.06) 0%,transparent 70%);
  pointer-events:none;
}
/* question number badge */
.sq-badge{
  display:inline-flex;align-items:center;gap:10px;
  margin-bottom:20px;flex-wrap:wrap;
}
.sq-qnum{
  font-family:'Share Tech Mono',monospace;
  font-size:.62rem;letter-spacing:.22em;color:var(--r);
  background:rgba(0,200,212,0.08);border:1px solid rgba(0,200,212,0.2);
  border-radius:6px;padding:3px 10px;
}
.sq-subject{
  font-family:'Share Tech Mono',monospace;
  font-size:.58rem;letter-spacing:.14em;color:var(--td);
}
.sq-status{
  margin-left:auto;font-family:'Share Tech Mono',monospace;
  font-size:.58rem;letter-spacing:.12em;
  color:var(--td);transition:color .2s;
}
.sq-status.done{color:#22c55e;}

/* the actual question text — BIG */
.sq-qtxt{
  font-size:clamp(1.05rem,2.2vw,1.32rem);
  line-height:1.9;color:#f0eaff;
  font-weight:300;
  margin-bottom:32px;
  flex-shrink:0;
  letter-spacing:.01em;
}

/* options grid */
.sq-options{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;
  margin-bottom:auto;
}
@media(max-width:600px){.sq-options{grid-template-columns:1fr;}}
.sq-opt{
  display:flex;align-items:flex-start;gap:14px;
  padding:18px 20px;border-radius:14px;
  border:1px solid rgba(255,255,255,0.07);
  background:rgba(255,255,255,0.025);
  color:#888;cursor:pointer;
  font-family:'Oswald',sans-serif;
  font-size:clamp(.88rem,1.8vw,1rem);
  font-weight:300;line-height:1.55;
  text-align:left;
  transition:all .18s cubic-bezier(.4,0,.2,1);
  position:relative;overflow:hidden;
  min-height:60px;
}
.sq-opt::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,200,212,0.1),rgba(120,0,180,0.06));
  opacity:0;transition:opacity .18s;border-radius:14px;
}
.sq-opt:hover{border-color:rgba(0,200,212,0.35);color:#ddd;transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,0.3);}
.sq-opt:hover::before{opacity:1;}
.sq-opt.sel{
  border-color:var(--rb);color:#fff;
  background:linear-gradient(135deg,rgba(0,180,210,0.2),rgba(100,0,160,0.12));
  box-shadow:0 0 20px rgba(0,170,210,0.18),0 4px 20px rgba(0,0,0,0.3);
  transform:translateY(-2px);
}
.sq-opt.sel::before{opacity:1;}
.sq-optkey{
  font-family:'Share Tech Mono',monospace;
  font-size:.82rem;color:var(--r);font-weight:700;
  min-width:22px;flex-shrink:0;margin-top:2px;
}
.sq-opt.sel .sq-optkey{color:#ff6fd8;}

/* nav row */
.sq-nav{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin-top:32px;flex-shrink:0;
  padding-top:24px;border-top:1px solid rgba(255,255,255,0.06);
}
.sq-progress{
  font-family:'Share Tech Mono',monospace;
  font-size:.72rem;color:var(--td);letter-spacing:.1em;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.sq-progress-bar{
  width:80px;height:3px;background:rgba(255,255,255,0.07);
  border-radius:2px;overflow:hidden;
}
.sq-progress-fill{height:100%;background:var(--rb);border-radius:2px;transition:width .3s;}
.sq-navbtn{
  padding:13px 32px;border-radius:12px;
  font-family:'Oswald',sans-serif;font-size:.95rem;
  font-weight:600;letter-spacing:.12em;cursor:pointer;transition:all .2s;
}
.sq-prev{border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:var(--td);}
.sq-prev:hover:not(:disabled){border-color:rgba(255,255,255,0.25);color:var(--t);background:rgba(255,255,255,0.05);}
.sq-prev:disabled{opacity:.25;cursor:not-allowed;}
.sq-next{border:1px solid var(--brb);background:linear-gradient(135deg,rgba(180,0,110,0.5),rgba(0,60,100,0.4));color:#fff;box-shadow:0 0 0 rgba(200,0,120,0);}
.sq-next:hover:not(:disabled){box-shadow:0 0 28px rgba(0,150,200,0.4);transform:translateY(-1px);}
.sq-next:disabled{opacity:.35;cursor:not-allowed;}

/* submit area */
.sq-submit{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;margin-top:16px;flex-shrink:0;
  padding:16px 20px;border-radius:14px;
  background:rgba(255,255,255,0.015);border:1px solid rgba(255,255,255,0.05);
}
.sq-unanswered{font-family:'Share Tech Mono',monospace;font-size:.6rem;color:var(--td);letter-spacing:.12em;}
.sq-unanswered.all-done{color:#22c55e;}

/* SIDE PANEL CARDS */
.qp-panel-card{
  background:rgba(8,2,20,0.8);border:1px solid var(--br);
  border-radius:12px;padding:14px 12px;
}
.qp-title{
  font-family:'Share Tech Mono',monospace;font-size:.5rem;
  color:var(--td);letter-spacing:.22em;margin-bottom:10px;
  text-transform:uppercase;
}
/* timer in panel */
.qp-timer-val{
  font-family:'Share Tech Mono',monospace;
  font-size:2rem;color:var(--t);
  letter-spacing:.04em;line-height:1;text-align:center;
  display:block;margin-bottom:2px;
}
.qp-timer-val.danger{color:#ff2222;text-shadow:0 0 16px rgba(255,34,34,0.7);animation:flicker .9s infinite;}
.qp-timer-lbl{font-family:'Share Tech Mono',monospace;font-size:.46rem;color:var(--td);letter-spacing:.18em;text-align:center;display:block;}
/* question grid */
.qp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.qp-btn{
  width:100%;aspect-ratio:1;border-radius:7px;
  border:1px solid rgba(255,255,255,0.07);
  background:rgba(255,255,255,0.02);
  color:#444;font-family:'Share Tech Mono',monospace;
  font-size:.58rem;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;justify-content:center;
}
.qp-btn:hover{border-color:rgba(220,16,16,0.4);color:#bbb;}
.qp-btn.current{border-color:var(--rb);color:#fff;background:rgba(0,170,210,0.18);box-shadow:0 0 10px rgba(0,170,210,0.25);}
.qp-btn.answered{border-color:rgba(34,197,94,0.5);background:rgba(34,197,94,0.1);color:#22c55e;}
.qp-btn.answered.current{border-color:#22c55e;box-shadow:0 0 10px rgba(34,197,94,0.3);}
.qp-legend{display:flex;flex-direction:column;gap:5px;margin-top:10px;}
.qp-leg-row{display:flex;align-items:center;gap:7px;font-family:'Share Tech Mono',monospace;font-size:.48rem;color:var(--td);letter-spacing:.06em;}
.qp-leg-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
/* progress in panel */
.qp-progress-num{font-family:'Share Tech Mono',monospace;font-size:1.1rem;color:var(--t);}
.qp-progress-bar{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;margin-top:8px;overflow:hidden;}
.qp-progress-fill{height:100%;background:linear-gradient(90deg,#005580,var(--rb));border-radius:2px;transition:width .4s;}
/* submit button in panel */
.qp-submit-btn{
  width:100%;padding:13px;
  background:linear-gradient(135deg,rgba(0,100,140,0.6),rgba(80,0,120,0.5));
  border:1px solid var(--brb);border-radius:10px;
  color:#fff;font-family:'Oswald',sans-serif;
  font-size:.88rem;font-weight:600;letter-spacing:.12em;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.qp-submit-btn:hover{box-shadow:0 0 24px rgba(0,150,200,0.4);transform:translateY(-1px);}
.qp-submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
/* timeup banner */
.tuban{
  background:rgba(255,34,34,0.09);border:1px solid rgba(255,34,34,0.3);
  border-radius:10px;padding:12px 18px;text-align:center;
  font-size:clamp(.72rem,2vw,.82rem);color:#ff5555;
  font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  margin-bottom:16px;animation:flicker .9s infinite;flex-shrink:0;
}

/* ── ADMIN ADD BTN ── */
.admin-add-fab{display:block;width:100%;padding:10px 14px;background:linear-gradient(135deg,rgba(0,70,100,0.6),rgba(0,40,80,0.5));border:1px solid var(--brb);border-radius:8px;color:#fff;font-family:'Share Tech Mono',monospace;font-size:.62rem;cursor:pointer;letter-spacing:.1em;transition:all .2s;text-align:center;margin-bottom:6px;}
.admin-add-fab:hover{box-shadow:0 0 20px rgba(0,150,200,0.35);}

/* ── HOME CARD IMPROVEMENTS ── */
.hcard{
  padding:22px 14px;text-align:center;margin-bottom:0;
  background:linear-gradient(160deg,rgba(2,10,24,0.97),rgba(2,8,18,0.99));

.hcard:hover{border-color:rgba(0,200,212,0.45);transform:translateY(-5px) scale(1.02);box-shadow:0 12px 40px rgba(0,0,0,0.5),0 0 30px rgba(0,120,180,0.18);}
.hcard:hover::before,.hcard:hover::after{opacity:1;}
.hcard-name{font-family:'Cinzel Decorative',serif;font-size:clamp(.9rem,3vw,1.05rem);color:var(--rb);margin-bottom:6px;text-shadow:0 0 20px rgba(0,200,212,0.4);transition:text-shadow .3s;}
.hcard:hover .hcard-name{text-shadow:0 0 30px rgba(0,200,212,0.7),0 0 60px rgba(0,160,200,0.2);}
.hcard-full{font-size:clamp(.55rem,1.7vw,.62rem);color:var(--td);margin-bottom:10px;letter-spacing:.04em;line-height:1.4;word-break:break-word;}
.hcard-tags{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;}
.htag{font-size:clamp(.5rem,1.5vw,.57rem);background:rgba(0,170,210,0.07);border:1px solid rgba(0,170,210,0.14);border-radius:4px;padding:2px 6px;color:var(--td);transition:all .2s;}
.hcard:hover .htag{border-color:rgba(0,220,240,0.25);color:#c090d0;}

/* ══ CINEMATIC EXTRAS ══ */
.stag{display:inline-flex;align-items:center;gap:7px;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--r);font-family:'Share Tech Mono',monospace;font-weight:600;margin-bottom:16px;}
.stag-n{width:18px;height:18px;border-radius:50%;background:var(--rd);border:1px solid var(--brb);display:flex;align-items:center;justify-content:center;font-size:.56rem;font-family:'Share Tech Mono',monospace;flex-shrink:0;box-shadow:0 0 8px rgba(0,200,212,0.2);}
@keyframes plse{0%,100%{box-shadow:0 0 30px var(--rg),0 0 60px rgba(0,100,180,0.1);transform:scale(1);}33%{box-shadow:0 0 80px rgba(0,220,240,0.7),0 0 140px rgba(0,100,180,0.2),0 0 200px rgba(0,220,255,0.08);transform:scale(1.1);}66%{box-shadow:0 0 60px rgba(0,220,255,0.5),0 0 120px rgba(0,180,255,0.15);transform:scale(1.05);}}
.lb[data-level="Voidwalker"].sel{border-color:#0088cc;background:linear-gradient(145deg,rgba(0,80,160,0.25),rgba(30,0,80,0.2));box-shadow:0 0 40px rgba(0,160,220,0.4),0 0 80px rgba(0,70,150,0.15),inset 0 0 30px rgba(0,80,160,0.05);}
.modal-box{background:linear-gradient(135deg,rgba(3,10,22,0.99),rgba(2,6,16,0.99));border:1px solid var(--brb);border-radius:20px;padding:36px 28px;width:100%;max-width:380px;position:relative;box-shadow:0 0 80px rgba(0,160,200,0.15),0 0 140px rgba(0,0,0,0.8);animation:modalIn .3s cubic-bezier(.2,0,.1,1);}
@keyframes modalIn{from{opacity:0;transform:scale(0.94) translateY(20px);}to{opacity:1;transform:none;}}
.modal-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--rb),rgba(0,220,255,0.5),var(--rb),transparent);}
.modal-title{font-family:'Cinzel Decorative',serif;font-size:1.1rem;color:var(--rb);letter-spacing:.18em;margin-bottom:6px;text-align:center;text-shadow:0 0 20px rgba(0,220,240,0.4);}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.4);opacity:.6;}}
.pfill,.qp-progress-fill{animation:fillShimmer 3s ease-in-out infinite;}
@keyframes fillShimmer{0%,100%{filter:brightness(1);}50%{filter:brightness(1.3) drop-shadow(0 0 4px rgba(0,220,240,0.5));}}

</style>
</head>
<body>
<div class="app" id="app">
  <div class="bgfx"></div>
  <canvas id="ember-canvas" class="bgfx-embers" style="position:fixed;inset:0;pointer-events:none;z-index:0;width:100%;height:100%;"></canvas>
  <div class="scan"></div>

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-brand">SHADE</div>
    <div class="topbar-right" id="topbar-right">
      <div class="hold-wrap" title="Hold for admin">
        <button class="hold-btn" id="hold-btn" onmousedown="startHold()" onmouseup="cancelHold()" onmouseleave="cancelHold()" ontouchstart="startHold()" ontouchend="cancelHold()"></button>
        <div class="hold-ring" id="hold-ring">
          <svg viewBox="0 0 36 36"><circle class="hold-circle" id="hold-circle" cx="18" cy="18" r="15.9"/></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- LOGIN MODAL -->
  <div class="modal-overlay" id="modal-login" style="display:none">
    <div class="modal-box">
      <button class="modal-close" onclick="closeLogin()">✕</button>
      <div class="modal-title">OPERATIVE LOGIN</div>
      <div class="modal-sub">SHADOW ID + PASSPHRASE</div>
      <div class="modal-field">
        <label class="modal-label">SHADOW ID</label>
        <input class="modal-input" id="login-id" placeholder="SS0001" maxlength="8" onkeydown="if(event.key==='Enter')submitLogin()" />
      </div>
      <div class="modal-field">
        <label class="modal-label">PASSPHRASE</label>
        <input class="modal-input" id="login-pw" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')submitLogin()" />
      </div>
      <div class="modal-err" id="login-err">▲ INVALID CREDENTIALS · ACCESS DENIED</div>
      <button class="modal-btn" onclick="submitLogin()">◉ IDENTIFY · ENTER SHADE</button>
    </div>
  </div>

  <!-- ADMIN AUTH MODAL -->
  <div class="modal-overlay" id="modal-admin-auth" style="display:none">
    <div class="modal-box">
      <button class="modal-close" onclick="closeAdminAuth()">✕</button>
      <div class="modal-title">ADMIN ACCESS</div>
      <div class="modal-sub">CLEARANCE REQUIRED</div>
      <div class="modal-field">
        <label class="modal-label">ADMIN PASSWORD</label>
        <input class="modal-input" id="admin-auth-input" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')submitAdminAuth()" />
      </div>
      <div class="modal-err" id="admin-auth-err">▲ ACCESS DENIED</div>
      <button class="modal-btn" onclick="submitAdminAuth()">◉ ENTER COMMAND</button>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div class="admin-overlay" id="admin-panel" style="display:none">
    <div class="admin-header">
      <div class="admin-title">⬡ SHADE COMMAND · ADMIN PORTAL</div>
      <button class="admin-close" onclick="closeAdmin()">[ CLOSE ]</button>
    </div>
    <div class="admin-body">
      <div class="admin-sidebar" id="admin-sidebar"></div>
      <div class="admin-content" id="admin-content"></div>
    </div>
  </div>

</div>

let holdInterval = null, holdElapsed = 0;
const HOLD_DURATION = 2000;
function startHold(){
  holdElapsed=0;clearInterval(holdInterval);
  document.getElementById("hold-ring").style.display="block";
  holdInterval=setInterval(()=>{
    holdElapsed+=50;
    const pct=Math.min(100,(holdElapsed/HOLD_DURATION)*100);
    document.getElementById("hold-circle").style.strokeDashoffset=String(100-pct);
    if(holdElapsed>=HOLD_DURATION){cancelHold();openAdminAuth();}
  },50);
}
function cancelHold(){
  clearInterval(holdInterval);holdElapsed=0;
  document.getElementById("hold-ring").style.display="none";
  document.getElementById("hold-circle").style.strokeDashoffset="100";
}

// ── STATE PERSISTENCE ──
function saveStateToStorage(){
  // Never save loading state — it wipes questionCount mid-generation on refresh
  if(state.loading) return;
  if(state.screen==="quiz"||state.screen==="setup"||state.screen==="results"){
    const toSave={
      screen:state.screen, course:state.course, subject:state.subject, level:state.level,
      timerDuration:state.timerDuration, questionCount:state.questionCount,
      questions:state.questions, answers:state.answers, results:state.results,
      elapsed:state.elapsed, timeUp:state.timeUp, currentQuestionIndex:state.currentQuestionIndex||0
    };
    try{localStorage.setItem("shade_session",JSON.stringify(toSave));}catch(e){}
  } else {
    localStorage.removeItem("shade_session");
  }
}
function loadStateFromStorage(){
  try{
    const raw=localStorage.getItem("shade_session");
    if(raw){
      const saved=JSON.parse(raw);
      // Only restore quiz/setup/results states
      if(saved.screen&&saved.screen!=="home"){
        Object.assign(state,saved);
        // Restore answers map
        if(saved.answers) state.answers=saved.answers;
        return true;
      }
    }
  }catch(e){}
  return false;
}

function openLogin(){el("login-id").value="";el("login-pw").value="";el("login-err").style.display="none";el("modal-login").style.display="flex";setTimeout(()=>el("login-id").focus(),50);}
function closeLogin(){el("modal-login").style.display="none";}
async function submitLogin(){
  const id=(el("login-id").value||"").trim().toUpperCase();
  const pw=el("login-pw").value;
  el("login-id").classList.remove("error");el("login-pw").classList.remove("error");el("login-err").style.display="none";
  // Check against pulled members data
  if(members[id] && members[id].passphrase === pw){
    loggedInUser={shadowId:id, codename:members[id].codename||id};
    // Persist login across refreshes
    localStorage.setItem("shade_user", JSON.stringify(loggedInUser));
    // Load user attempted questions from sheet
    await loadUserAttempted(id);
    closeLogin();
    renderTopbar();
  } else {
    el("login-err").style.display="block";
    el("login-id").classList.add("error");el("login-pw").classList.add("error");
  }
}
function logout(){loggedInUser=null;localStorage.removeItem("shade_user");renderTopbar();}

// ── GAS FETCH ──
async function gasFetch(action, data={}){
  try {
    const res = await fetch(GAS_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({action,...data}),
      redirect:"follow"
    });
    const text = await res.text();
    try{return JSON.parse(text);}catch(e){
      const m=text.match(/([\[{][\s\S]*[\]}])/);
      if(m)return JSON.parse(m[1]);
      throw new Error("Invalid response from server");
    }
  } catch(e){
    throw new Error("Sync failed: "+e.message);
  }
}

// ── PULL MEMBERS & QUESTIONS FROM SHEET ──
async function pullData(){
  try {
    const data = await gasFetch("readShade");
    if(data.members){
      members={};
      data.members.forEach(m=>{if(m.shadowId)members[m.shadowId]={passphrase:m.passphrase||"",codename:m.codename||m.shadowId};});
    }
    if(data.questions){
      questionBank = data.questions;
    }
    // Save to local cache
    localStorage.setItem("shade_members", JSON.stringify(members));
    localStorage.setItem("shade_bank", JSON.stringify(questionBank));
  } catch(e){
    // Fall back to local cache
    try{members=JSON.parse(localStorage.getItem("shade_members")||"{}");}catch(e2){}
    try{questionBank=JSON.parse(localStorage.getItem("shade_bank")||"[]");}catch(e2){}
  }
}

async function loadUserAttempted(shadowId){
  try {
    const data = await gasFetch("getAttempted", {shadowId});
    if(data.attempted){
