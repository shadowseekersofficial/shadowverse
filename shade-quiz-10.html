<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SHADE — Elite AI Exam Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Oswald:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --r: #e0199a; --rb: #ff2db0; --rg: rgba(224,25,154,0.55); --rd: rgba(224,25,154,0.12);
  --bg: #03000a; --br: rgba(180,20,180,0.25); --brb: rgba(255,45,176,0.55);
  --t: #f0e8f8; --td: #9a70b0; --tm: #3a1a4a;
}

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: var(--bg); overflow-x: hidden; -webkit-tap-highlight-color: transparent; }

.app {
  min-height: 100vh; background: var(--bg); color: var(--t);
  font-family: 'Oswald', sans-serif; position: relative; overflow-x: hidden;
}

.bgfx { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.bgfx::before {
  content: ''; position: absolute; top: -30%; left: 50%; transform: translateX(-50%);
  width: 140vw; height: 80vh;
  background: radial-gradient(ellipse at center, rgba(180,0,220,0.13) 0%, transparent 70%);
  animation: breathe 6s ease-in-out infinite;
}
@keyframes breathe {
  0%,100% { opacity:.6; transform: translateX(-50%) scale(1); }
  50% { opacity:1; transform: translateX(-50%) scale(1.12); }
}
.scan {
  position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.02) 2px, rgba(0,0,0,0.02) 4px);
}

.pg {
  position: relative; z-index: 2;
  max-width: 880px; margin: 0 auto;
  padding: 0 16px 80px;
  width: 100%;
}

.hd { text-align: center; padding: 32px 0 20px; }
.hd::after {
  content: ''; display: block; height: 1px;
  background: linear-gradient(90deg, transparent, var(--r), transparent);
  margin-top: 20px;
}
.logo-w { position: relative; display: inline-block; margin-bottom: 12px; }
.logo-ring {
  position: absolute; inset: -7px; border-radius: 50%;
  border: 1px dashed rgba(220,16,16,0.4); animation: spin 14s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.logo-img {
  display: block; border-radius: 50%; border: 2px solid var(--r);
  box-shadow: 0 0 30px var(--rg), 0 0 60px rgba(0,200,255,0.2); object-fit: cover;
  background: rgba(224,25,154,0.15);
}
.brand {
  font-family: 'Cinzel Decorative', serif; font-weight: 900; color: var(--rb);
  text-shadow: 0 0 20px var(--rg), 0 0 60px rgba(0,200,255,0.25);
  letter-spacing: .2em; line-height: 1.1;
  font-size: clamp(1.8rem, 7vw, 3.4rem);
  word-break: keep-all; white-space: nowrap;
  animation: flicker 9s ease-in-out infinite;
}
@keyframes flicker { 0%,93%,95%,97%,100%{opacity:1} 94%,96%{opacity:.82} }
.brand-sub {
  font-size: clamp(.58rem, 2vw, .7rem);
  letter-spacing: clamp(.1em, 1.5vw, .22em);
  color: var(--td); text-transform: uppercase; margin-top: 5px; font-weight: 300;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}

.card {
  background: linear-gradient(135deg, rgba(8,2,20,0.96), rgba(4,1,14,0.98));
  border: 1px solid var(--br); border-radius: 14px;
  padding: 18px; margin-bottom: 14px;
  position: relative; overflow: hidden;
  transition: border-color .3s, box-shadow .3s;
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(220,16,16,0.3), transparent);
}
.card.active  { border-color: var(--brb); box-shadow: 0 0 20px rgba(224,25,154,0.1); }
.card.locked  { opacity: .38; pointer-events: none; filter: grayscale(.3); }

.stag {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: .62rem; letter-spacing: .28em; text-transform: uppercase;
  color: var(--r); font-weight: 600; margin-bottom: 14px;
}
.stag-n {
  width: 17px; height: 17px; border-radius: 50%;
  background: var(--rd); border: 1px solid var(--brb);
  display: flex; align-items: center; justify-content: center;
  font-size: .56rem; font-family: 'Share Tech Mono', monospace; flex-shrink: 0;
}

.cg { display: grid; gap: 10px; grid-template-columns: repeat(4,1fr); }
@media (max-width: 560px) { .cg { grid-template-columns: repeat(2,1fr); } }

.cb {
  border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.025);
  border-radius: 12px; padding: 14px 8px; cursor: pointer;
  transition: all .2s; text-align: center; color: #777;
  font-family: 'Oswald', sans-serif; min-width: 0;
}
.cb:hover  { border-color: rgba(220,16,16,0.35); color: #ccc; background: rgba(220,16,16,0.05); }
.cb.sel    { border-color: var(--r); color: #fff; background: linear-gradient(135deg,rgba(220,25,160,0.18),rgba(100,0,150,0.08)); box-shadow: 0 0 14px rgba(220,16,16,0.18); }
.cb-lbl    { font-family: 'Cinzel Decorative', serif; font-size: clamp(.85rem,3vw,1rem); font-weight: 700; }
.cb-sub    { font-size: clamp(.55rem,1.8vw,.64rem); margin-top: 3px; opacity: .55; font-weight: 300; word-break: break-word; line-height: 1.3; }

.jee-sub-grid { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; margin-top: 12px; }
.jee-sub-btn {
  border-radius: 12px; padding: 16px 12px; cursor: pointer;
  transition: all .2s; text-align: center;
  font-family: 'Oswald', sans-serif; min-width: 0;
  position: relative; overflow: hidden;
}
.jee-sub-btn::before {
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background: linear-gradient(90deg, transparent, rgba(220,16,16,0.4), transparent);
}
.jee-mains-btn { border: 1px solid rgba(100,180,255,0.2); background: rgba(0,100,200,0.06); color: #7ab0ee; }
.jee-mains-btn:hover { border-color: rgba(100,180,255,0.45); color: #aad0ff; background: rgba(0,100,200,0.12); }
.jee-mains-btn.sel { border-color: #4da8ff; color: #fff; background: linear-gradient(135deg,rgba(0,120,255,0.2),rgba(0,60,140,0.1)); box-shadow: 0 0 20px rgba(0,120,255,0.2); }
.jee-adv-btn { border: 1px solid rgba(255,140,0,0.2); background: rgba(180,80,0,0.06); color: #e09040; }
.jee-adv-btn:hover { border-color: rgba(255,160,40,0.45); color: #ffcc80; background: rgba(180,80,0,0.12); }
.jee-adv-btn.sel { border-color: #ff9900; color: #fff; background: linear-gradient(135deg,rgba(255,120,0,0.2),rgba(140,50,0,0.1)); box-shadow: 0 0 20px rgba(255,120,0,0.2); }
.jee-sub-title { font-family:'Cinzel Decorative',serif; font-size:clamp(.9rem,3vw,1.1rem); font-weight:700; margin-bottom:4px; }
.jee-sub-desc { font-size:clamp(.56rem,1.8vw,.66rem); opacity:.6; font-weight:300; line-height:1.35; }
.jee-badge { display:inline-block; font-size:.5rem; letter-spacing:.18em; text-transform:uppercase; border-radius:4px; padding:2px 6px; margin-bottom:6px; font-family:'Share Tech Mono',monospace; }
.jee-badge-mains { background:rgba(0,120,255,0.15); border:1px solid rgba(0,120,255,0.35); color:#4da8ff; }
.jee-badge-adv   { background:rgba(255,120,0,0.15); border:1px solid rgba(255,120,0,0.35); color:#ff9900; }

.pg2 { display: flex; flex-wrap: wrap; gap: 8px; }
.pl {
  border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.025);
  color: #666; padding: 7px 14px; border-radius: 999px; cursor: pointer;
  font-family: 'Oswald', sans-serif; font-size: clamp(.75rem,2.5vw,.82rem);
  font-weight: 400; letter-spacing: .04em; transition: all .2s;
  white-space: normal; word-break: break-word; line-height: 1.35; text-align: center;
}
.pl:hover  { border-color: rgba(220,16,16,0.35); color: #bbb; }
.pl.sel    { border-color: var(--r); color: #fff; background: rgba(220,16,16,0.14); box-shadow: 0 0 10px rgba(220,16,16,0.18); }
.pl.mix    { border-color: rgba(255,140,0,0.25); }
.pl.mix.sel{ border-color: #ff8c00; background: rgba(255,140,0,0.14); box-shadow: 0 0 10px rgba(255,140,0,0.2); }

.lg { display: grid; gap: 10px; grid-template-columns: repeat(3,1fr); }
@media (max-width: 500px) { .lg { grid-template-columns: 1fr; } }

.lb {
  border: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.02);
  border-radius: 12px; padding: 16px 12px; cursor: pointer;
  transition: all .25s; text-align: left; color: #555;
  font-family: 'Oswald', sans-serif; min-width: 0;
}
.lb:hover { border-color: rgba(220,16,16,0.3); color: #aaa; }
.lb.sel   { border-color: var(--r); color: #fff; background: linear-gradient(135deg,rgba(200,20,160,0.17),rgba(100,0,140,0.09)); box-shadow: 0 4px 20px rgba(220,16,16,0.12); }
.li { font-size: .72rem; color: var(--r); margin-bottom: 6px; letter-spacing: .06em; }
.ln { font-size: clamp(.82rem,2.5vw,.95rem); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.ld { font-size: clamp(.62rem,2vw,.7rem); margin-top: 3px; opacity: .45; font-weight: 300; line-height: 1.35; }

.slider-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.qn  { font-family: 'Share Tech Mono', monospace; font-size: clamp(2rem,6vw,2.8rem); color: var(--rb); text-shadow: 0 0 20px var(--rg); line-height: 1; flex-shrink: 0; }
.ql  { font-size: .6rem; color: var(--td); letter-spacing: .2em; text-transform: uppercase; margin-top: 2px; }
.slider-wrap { flex: 1; min-width: 120px; }
input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 4px;
  background: linear-gradient(90deg, var(--r) var(--fill,0%), rgba(255,255,255,0.07) var(--fill,0%));
  border-radius: 2px; cursor: pointer; margin-top: 12px; display: block;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 20px; height: 20px; background: #fff;
  border-radius: 50%; border: 3px solid var(--r); box-shadow: 0 0 10px var(--rg);
}
.slider-marks {
  display: flex; justify-content: space-between;
  font-size: .62rem; color: var(--tm); margin-top: 5px;
  font-family: 'Share Tech Mono', monospace;
}

.genbtn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 16px 12px;
  background: linear-gradient(135deg,#c0008a,#5a0070);
  border: 1px solid var(--rb); border-radius: 13px; color: #fff;
  font-family: 'Oswald', sans-serif;
  font-size: clamp(.85rem, 2.5vw, 1.05rem);
  font-weight: 600; letter-spacing: .15em; text-transform: uppercase;
  cursor: pointer; transition: all .25s;
  box-shadow: 0 0 24px rgba(200,0,0,0.26), 0 4px 16px rgba(0,0,0,0.5);
  margin-top: 8px; word-break: break-word; text-align: center; line-height: 1.3;
}
.genbtn:hover    { box-shadow: 0 0 46px rgba(200,0,0,0.46), 0 4px 28px rgba(0,0,0,0.6); transform: translateY(-2px); }
.genbtn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.spin { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.25); border-top-color: #fff; border-radius: 50%; animation: sp .8s linear infinite; display: inline-block; flex-shrink: 0; }
@keyframes sp { to { transform: rotate(360deg); } }

.ghostbtn {
  padding: 12px 22px; border: 1px solid var(--brb); background: transparent;
  color: var(--r); border-radius: 10px; cursor: pointer;
  font-family: 'Oswald', sans-serif; font-size: .88rem; font-weight: 500;
  letter-spacing: .1em; transition: all .2s; white-space: nowrap;
}
.ghostbtn:hover { background: var(--rd); }

.btn-row { display: flex; gap: 10px; align-items: stretch; }
.btn-row .ghostbtn { flex-shrink: 0; }
.btn-row .genbtn   { flex: 1; margin-top: 8px; }

.lov { text-align: center; padding: 60px 0; }
.lpulse {
  border-radius: 50%; border: 2px solid var(--r); box-shadow: 0 0 40px var(--rg);
  animation: plse 1.6s ease-in-out infinite; object-fit: cover;
  margin: 0 auto 20px; display: block; width: 76px; height: 76px;
  background: rgba(224,25,154,0.15);
}
@keyframes plse {
  0%,100% { box-shadow: 0 0 20px var(--rg); transform: scale(1); }
  50% { box-shadow: 0 0 70px var(--rg), 0 0 120px rgba(200,0,0,0.22); transform: scale(1.05); }
}
.ltxt  { font-family: 'Cinzel Decorative', serif; font-size: clamp(1rem,4vw,1.25rem); color: var(--rb); letter-spacing: .18em; animation: flicker 2s ease-in-out infinite; }
.lsub  { font-size: clamp(.65rem,2.5vw,.78rem); color: var(--td); margin-top: 8px; letter-spacing: .1em; word-break: break-word; }
.ldots { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
.ldot  { width: 8px; height: 8px; background: var(--r); border-radius: 50%; animation: db 1.4s ease-in-out infinite both; }
.ldot:nth-child(2){animation-delay:.2s} .ldot:nth-child(3){animation-delay:.4s}
@keyframes db { 0%,80%,100%{transform:scale(0);opacity:.3} 40%{transform:scale(1);opacity:1} }

.qbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(2,0,12,0.97); backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--br);
}
.qbar-inner {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  max-width: 880px; margin: 0 auto; padding: 10px 14px; flex-wrap: nowrap; min-width: 0;
}
.qbar-lft { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; overflow: hidden; }
.mlogo { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--r); box-shadow: 0 0 10px var(--rg); object-fit: cover; flex-shrink: 0; background: rgba(224,25,154,0.15); }
.qmeta { min-width: 0; overflow: hidden; }
.qmeta strong { color: var(--r); font-size: clamp(.65rem,2.5vw,.78rem); display: block; font-family: 'Cinzel Decorative', serif; letter-spacing: .1em; white-space: nowrap; }
.qmeta span   { font-size: clamp(.56rem,1.8vw,.66rem); color: var(--td); letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; max-width: 100%; }
.qstats { display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
.sv     { font-family: 'Share Tech Mono', monospace; font-size: clamp(.78rem,2.5vw,.95rem); color: var(--t); text-align: center; white-space: nowrap; }
.sv.danger { color: #ff2222; text-shadow: 0 0 10px rgba(255,34,34,0.5); animation: flicker .9s infinite; }
.slbl   { font-size: clamp(.48rem,1.5vw,.56rem); color: var(--tm); letter-spacing: .15em; text-transform: uppercase; margin-top: 1px; text-align: center; white-space: nowrap; }
.ptrack { height: 2px; background: rgba(255,255,255,0.04); }
.pfill  { height: 100%; background: linear-gradient(90deg,#7a00aa,var(--rb)); transition: width .4s ease; box-shadow: 0 0 8px var(--rg), 0 0 16px rgba(0,200,255,0.2); }

.qc {
  background: linear-gradient(135deg,rgba(10,2,22,0.98),rgba(5,1,14,0.99));
  border: 1px solid rgba(220,16,16,0.1); border-radius: 14px;
  padding: 18px 16px; margin-bottom: 12px;
  position: relative; overflow: hidden; transition: border-color .2s;
}
.qc::before {
  content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 3px;
  background: rgba(255,255,255,0.04); transition: background .2s;
}
.qc.ans { border-color: rgba(220,16,16,0.2); }
.qc.ans::before { background: linear-gradient(180deg,var(--rb),#440066); }

.qnum {
  font-family: 'Share Tech Mono', monospace; font-size: clamp(.58rem,2vw,.66rem);
  color: var(--r); letter-spacing: .16em; display: flex;
  justify-content: space-between; align-items: flex-start;
  gap: 8px; margin-bottom: 8px; flex-wrap: wrap;
}
.qnum-left { flex: 1; min-width: 0; word-break: break-word; }
.qst       { color: var(--tm); white-space: nowrap; }
.qst.done  { color: #22c55e; }

.qtxt { font-size: clamp(.88rem,2.5vw,.95rem); line-height: 1.7; color: #eee; margin-bottom: 14px; font-weight: 300; word-break: break-word; }

.og { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 480px) { .og { grid-template-columns: 1fr; } }

.ob {
  border: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.02);
  color: #888; padding: 10px 12px; border-radius: 10px; cursor: pointer;
  font-family: 'Oswald', sans-serif; font-size: clamp(.78rem,2.2vw,.84rem);
  font-weight: 300; text-align: left; transition: all .15s;
  display: flex; gap: 8px; align-items: flex-start;
  line-height: 1.45; word-break: break-word; min-width: 0;
}
.ob:hover { border-color: rgba(220,16,16,0.3); color: #ccc; }
.ob.sel   { background: linear-gradient(135deg,rgba(220,25,160,0.22),rgba(100,0,160,0.13)); border-color: var(--rb); color: #fff; box-shadow: 0 0 12px rgba(220,16,16,0.18); }
.ok { color: var(--r); font-weight: 700; font-size: .8rem; flex-shrink: 0; margin-top: 1px; }

.sarea { text-align: center; padding: 20px 0; }
.subbtn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 36px;
  background: linear-gradient(135deg,#a00080,#500060);
  border: 1px solid var(--r); border-radius: 12px; color: #fff;
  font-family: 'Oswald', sans-serif;
  font-size: clamp(.88rem,2.5vw,1rem);
  font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
  cursor: pointer; transition: all .2s; box-shadow: 0 0 26px rgba(160,0,0,0.26);
  white-space: nowrap;
}
.subbtn:hover    { box-shadow: 0 0 48px rgba(200,0,0,0.46); transform: translateY(-2px); }
.subbtn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.un { font-size: clamp(.68rem,2vw,.75rem); color: var(--tm); margin-bottom: 10px; letter-spacing: .1em; }

.tuban {
  background: rgba(224,25,154,0.08); border: 1px solid var(--r); border-radius: 12px;
  padding: 12px 16px; text-align: center; color: var(--rb);
  font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  font-size: clamp(.78rem,2.5vw,.9rem); margin-bottom: 14px; animation: flicker 1.8s infinite;
  word-break: break-word;
}

.rh {
  background: linear-gradient(135deg,rgba(12,2,28,0.98),rgba(5,1,16,0.99));
  border: 1px solid var(--brb); border-radius: 18px;
  padding: clamp(24px,5vw,44px) clamp(16px,4vw,28px);
  text-align: center; position: relative; overflow: hidden;
  margin-bottom: 20px; box-shadow: 0 0 60px rgba(180,0,220,0.1), 0 0 120px rgba(0,200,255,0.04);
}
.rh::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center top,rgba(180,0,220,0.1) 0%,transparent 70%); }
.gl  { font-family: 'Cinzel Decorative', serif; font-size: clamp(4rem,14vw,7.5rem); font-weight: 900; line-height: 1; position: relative; }
.gA  { color: #ff2db0; text-shadow: 0 0 40px rgba(255,45,176,0.75), 0 0 80px rgba(0,200,255,0.35); }
.gB  { color: #ff6600; text-shadow: 0 0 40px rgba(255,102,0,0.75), 0 0 80px rgba(255,102,0,0.35); }
.gC  { color: #f59e0b; text-shadow: 0 0 40px rgba(245,158,11,0.75), 0 0 80px rgba(245,158,11,0.35); }
.gD  { color: #888;   text-shadow: 0 0 20px rgba(136,136,136,0.4); }

.sr  { display: flex; justify-content: center; gap: clamp(16px,4vw,36px); margin: 16px 0; flex-wrap: wrap; }
.si  { text-align: center; }
.sn  { font-family: 'Share Tech Mono', monospace; font-size: clamp(1.4rem,4vw,1.9rem); color: var(--t); }
.sll { font-size: clamp(.56rem,1.8vw,.62rem); color: var(--td); letter-spacing: .2em; text-transform: uppercase; margin-top: 2px; }
.divr{ height: 1px; background: linear-gradient(90deg,transparent,var(--r),transparent); margin: 18px 0; }
.sumtxt { font-size: clamp(.82rem,2.3vw,.88rem); color: #bbb; line-height: 1.7; max-width: 480px; margin: 0 auto; font-weight: 300; word-break: break-word; position: relative; }
.tnote  { font-size: clamp(.7rem,2vw,.76rem); color: var(--td); margin-top: 9px; font-style: italic; word-break: break-word; position: relative; }

.bklbl { font-size: .62rem; letter-spacing: .28em; text-transform: uppercase; color: var(--r); margin-bottom: 12px; font-weight: 600; }
.bkc   { background: linear-gradient(135deg,rgba(9,2,20,0.98),rgba(4,1,12,0.99)); border-radius: 13px; padding: 16px; margin-bottom: 11px; border-left: 3px solid #222; transition: border-color .2s; }
.bkc.cor { border-left-color: #22c55e; }
.bkc.wrg { border-left-color: #ef4444; }
.bkh  { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 9px; flex-wrap: wrap; }

<body>
<div class="app" id="app">
  <div class="bgfx"></div>
  <div class="scan"></div>
</div>

<script>
// ── DATA ──
const COURSES = {
  NDA:      { label:"NDA",        fullName:"National Defence Academy",              subjects:["Mathematics","General Ability","Physics","Chemistry","English","History","Geography","Current Affairs"] },
  JEE_MAINS:{ label:"JEE Mains",  fullName:"Joint Entrance Exam — Mains",           subjects:["Physics","Chemistry","Mathematics"], jeeType:"mains" },
  JEE_ADV:  { label:"JEE Advanced",fullName:"Joint Entrance Exam — Advanced",       subjects:["Physics","Chemistry","Mathematics"], jeeType:"advanced" },
  NEET:     { label:"NEET",       fullName:"National Eligibility cum Entrance Test", subjects:["Physics","Chemistry","Biology (Botany)","Biology (Zoology)"] },
  SSC:      { label:"SSC",        fullName:"Staff Selection Commission",            subjects:["General Intelligence & Reasoning","General Awareness","Quantitative Aptitude","English Comprehension"] },
};

const LEVELS = [
  { id:"Beginner",     icon:"◈",     desc:"Fundamentals & recall",   criteria:"basic definitions, formulae, and simple recall — suitable for beginners" },
  { id:"Intermediate", icon:"◈◈",   desc:"Applied concepts",         criteria:"application-based, moderate problem-solving, conceptual understanding" },
  { id:"Advanced",     icon:"◈◈◈", desc:"Complex & analytical",     criteria:"multi-step problems, high-difficulty analysis, as seen in top competitive exams" },
];

const TIMER_DURATIONS = [
  {val:0,label:"No Limit"},{val:5,label:"5 min"},{val:10,label:"10 min"},
  {val:15,label:"15 min"},{val:20,label:"20 min"},{val:25,label:"25 min"},{val:30,label:"30 min"},
];

// ── STATE ──
let state = {
  screen: "home",
  course: null, subject: null, level: null,
  timerDuration: 0, questionCount: 10,
  questions: [], answers: {}, results: null,
  loading: false, submitting: false, error: "",
  elapsed: 0, timeUp: false, timerInterval: null, startTime: null,
};

// ── HELPERS ──
const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;

function setState(patch) { Object.assign(state, patch); render(); }

// ── API ──
async function apiCall(prompt, maxTok) {
  const response = await fetch("https://winter-frost-06b8.shadowseekersofficial.workers.dev/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "grok-3",
      max_tokens: maxTok || 4000,
      messages: [{ role: "user", content: prompt }]
    })
  });
  const d = await response.json();
  if (d.error) throw new Error(d.error.message || "API error");
  const out = (d.content || []).map(i => i.text || "").join("");
  if (!out) throw new Error("Empty response from AI.");
  return out;
}

async function generate(retries = 3) {
  const { course, subject, level, questionCount } = state;
  const courseData = COURSES[course];
  setState({ loading: true, error: "" });

  const subStr = subject === "Mix"
    ? "a balanced mix of all subjects (" + courseData.subjects.join(", ") + ")"
    : subject;
  const lvlCriteria = LEVELS.find(l => l.id === level)?.criteria || "";

  let jeeNote = "";
  if (courseData.jeeType === "mains") {
    jeeNote = "\n- This is JEE MAINS level: single correct MCQ, NTA pattern, moderate difficulty, standard NCERT + coaching syllabus.";
  } else if (courseData.jeeType === "advanced") {
    jeeNote = "\n- This is JEE ADVANCED level: can include multi-correct, paragraph-based, matrix-match style questions in MCQ format. High analytical difficulty, IIT-JEE pattern.";
  }

  const prompt = `You are SHADE, an exam generator. You MUST generate EXACTLY ${questionCount} questions — not more, not less. This is the most important rule. Course: ${courseData.label}, Subject: ${subStr}, Level: ${level} (${lvlCriteria})${jeeNote}. RULES: (1) Accurate MCQ questions with exactly 4 options A B C D. (2) Difficulty matches ${level}. (3) Math in plain ASCII only like x^2+3x. (4) No special characters or unicode. (5) Output ONLY raw JSON starting with { and ending with }. No markdown, no backticks, no explanation. (6) The questions array MUST have EXACTLY ${questionCount} items. Count them before responding. Format: {"questions":[{"id":1,"subject":"subject","question":"question text","options":{"A":"opt1","B":"opt2","C":"opt3","D":"opt4"},"correct":"A","explanation":"why A is correct"}]}`;

  try {
    const txt = await apiCall(prompt, 6000);
    let clean = txt.trim();
    // Remove markdown fences
    clean = clean.replace(/^```json\s*/i, "").replace(/^```\s*/i, "").replace(/```\s*$/i, "").trim();
    // Extract only the JSON object (from first { to last })
    const start = clean.indexOf("{");
    const end = clean.lastIndexOf("}");
    if (start !== -1 && end !== -1) clean = clean.slice(start, end + 1);
    // Fix control characters inside JSON string values only
    // Replace literal newlines/tabs inside strings with escaped versions
    clean = clean.replace(/"((?:[^"\\]|\\.)*)"/g, (match) => {
      return match
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "\\r")
        .replace(/\t/g, "\\t")
        .replace(/[\x00-\x1f]/g, "");
    });
    let parsed;
    try {
      // Sanitize each string value in the JSON to escape problematic chars
      clean = clean.replace(/"((?:[^"\\]|\\[\s\S])*?)"/g, (match, inner) => {
        const fixed = inner
          .replace(/\n/g, " ")
          .replace(/\r/g, " ")
          .replace(/\t/g, " ")
          .replace(/[\x00-\x1f\x7f]/g, "")
          .replace(/\\(?!["\\/bfnrtu])/g, "\\\\");
        return '"' + fixed + '"';
      });
      parsed = JSON.parse(clean);
    } catch(jsonErr) {
      setState({ error: "Parse failed: " + jsonErr.message + " | Start: " + clean.substring(0, 200), loading: false });
      return;
    }
    if (!Array.isArray(parsed.questions) || parsed.questions.length === 0) {
      throw new Error("AI returned no questions. Please try again.");
    }
    // If wrong number of questions returned, retry
    if (parsed.questions.length !== questionCount && retries > 1) {
      return generate(retries - 1);
    }
    setState({ questions: parsed.questions, answers: {}, elapsed: 0, timeUp: false, loading: false, screen: "quiz" });
    startTimer();
  } catch(e) {
    if (retries > 1) {
      return generate(retries - 1);
    }
    setState({ error: e.message || "Generation failed. Please try again.", loading: false });
  }
}

async function submit() {
  clearInterval(state.timerInterval);
  setState({ submitting: true, error: "" });
  const { course, subject, level, questions, answers, elapsed, timerDuration } = state;
  const courseData = COURSES[course];
  const timeStr = timerDuration > 0
    ? Math.floor(elapsed/60) + "m " + (elapsed%60) + "s (limit: " + timerDuration + "min)"
    : Math.floor(elapsed/60) + "m " + (elapsed%60) + "s (no limit)";
  const qaSummary = questions.map(q => ({
    id: q.id, subject: q.subject, question: q.question,
    correct: q.correct, userAnswer: answers[q.id] || null, explanation: q.explanation
  }));
  const prompt = `You are SHADE, an elite exam evaluator.\n\nTest: Course=${courseData.label}, Subject=${subject}, Level=${level}, Questions=${questions.length}, Time=${timeStr}\n\nQ&A:\n${JSON.stringify(qaSummary)}\n\nGrade: A=>=80%, B=60-79%, C=40-59%, D<40%. Upgrade if timed+fast+accurate. Unanswered = wrong.\n\nReturn ONLY valid JSON (no markdown):\n{"grade":"A","score":8,"total":10,"percentage":80,"timeAnalysis":"one sentence","summary":"2-3 sentence summary","breakdown":[{"id":1,"question":"...","subject":"...","userAnswer":"A","correct":"B","isCorrect":false,"explanation":"..."}]}`;
  try {
    const txt = await apiCall(prompt, 3000);
    const clean = txt.replace(/^```json\s*/,"").replace(/^```\s*/,"").replace(/```\s*$/,"").trim();
    const parsed = JSON.parse(clean);
    setState({ results: parsed, screen: "results", submitting: false });
  } catch(e) {
    setState({ error: e.message || "Grading failed. Please try again.", submitting: false });
  }
}

function startTimer() {
  clearInterval(state.timerInterval);
  state.startTime = Date.now();
  state.timerInterval = setInterval(() => {
    const s = Math.floor((Date.now() - state.startTime) / 1000);
    state.elapsed = s;
    if (state.timerDuration > 0 && s >= state.timerDuration * 60) {
      clearInterval(state.timerInterval);
      state.timeUp = true;
    }
    updateQuizBar();
  }, 500);
}

function updateQuizBar() {
  const { questions, answers, elapsed, timerDuration, timeUp } = state;
  const answered = Object.keys(answers).length;
  const pct = questions.length > 0 ? Math.round((answered / questions.length) * 100) : 0;
  const timeRemaining = timerDuration > 0 ? timerDuration * 60 - elapsed : 0;
  const timerDanger = timerDuration > 0 && timeRemaining < 60 && !timeUp;

  const doneEl = document.getElementById('qbar-done');
  const timeEl = document.getElementById('qbar-time');
  const elEl   = document.getElementById('qbar-elapsed');
  const pfEl   = document.getElementById('pfill');
  const unEl   = document.getElementById('unanswered');

  if (doneEl) doneEl.textContent = `${answered}/${questions.length}`;
  if (elEl)   elEl.textContent   = fmt(elapsed);
  if (pfEl)   pfEl.style.width   = pct + '%';
  if (unEl)   unEl.textContent   = questions.length - answered > 0
    ? `${questions.length - answered} question${questions.length - answered !== 1 ? "s" : ""} unanswered`
    : "✓ All questions answered";
  if (timeEl) {
    timeEl.textContent = timeUp ? "UP" : fmt(Math.max(0, timeRemaining));
    timeEl.className = 'sv' + (timerDanger ? ' danger' : '');
  }
  if (timeUp) {
    const tubanEl = document.getElementById('timeup-banner');
    if (tubanEl) tubanEl.style.display = 'block';
  }
}

function selectAnswer(qid, opt) {
  if (state.submitting) return;
  state.answers = { ...state.answers, [qid]: opt };

  const qcard = document.getElementById(`qc-${qid}`);
  const qst   = document.getElementById(`qst-${qid}`);
  if (qcard) qcard.classList.add('ans');
  if (qst)   { qst.textContent = '✓ Answered'; qst.className = 'qst done'; }

  ['A','B','C','D'].forEach(o => {
    const btn = document.getElementById(`opt-${qid}-${o}`);
    if (btn) btn.className = 'ob' + (o === opt ? ' sel' : '');
  });

  updateQuizBar();
}

function reset() {
  clearInterval(state.timerInterval);
  state = { screen:"home", course:null, subject:null, level:null, timerDuration:0, questionCount:10,
    questions:[], answers:{}, results:null, loading:false, submitting:false, error:"", elapsed:0, timeUp:false, timerInterval:null, startTime:null };
  render();
}

// ── RENDER ──
function render() {
  const app = document.getElementById('app');
  while (app.children.length > 2) app.removeChild(app.lastChild);
  const { screen } = state;
  if (screen === 'home')    renderHome(app);
  else if (screen === 'setup')   renderSetup(app);
  else if (screen === 'quiz')    renderQuiz(app);
  else if (screen === 'results') renderResults(app);
}

  const { course, subject, level, questions, answers, elapsed, timerDuration, timeUp, submitting, error } = state;
  const courseData = COURSES[course];
  const answered = Object.keys(answers).length;
  const pct = questions.length > 0 ? Math.round((answered / questions.length) * 100) : 0;
  const timeRemaining = timerDuration > 0 ? timerDuration * 60 - elapsed : 0;
  const timerDanger = timerDuration > 0 && timeRemaining < 60 && !timeUp;

  const bar = document.createElement('div');
  bar.className = 'qbar';
  bar.innerHTML = `
    <div class="qbar-inner">
      <div class="qbar-lft">
        <div class="mlogo" style="display:flex;align-items:center;justify-content:center;font-family:'Cinzel Decorative',serif;font-size:12px;color:var(--rb);font-weight:900">S</div>
        <div class="qmeta">
          <strong>SHADE</strong>
          <span>${courseData.label} · ${subject} · ${level}</span>
        </div>
      </div>
      <div class="qstats">
        <div><div class="sv" id="qbar-done">${answered}/${questions.length}</div><div class="slbl">Done</div></div>
        ${timerDuration > 0 ? `<div><div class="sv ${timerDanger?'danger':''}" id="qbar-time">${timeUp?'UP':fmt(Math.max(0,timeRemaining))}</div><div class="slbl">Left</div></div>` : ''}
        <div><div class="sv" id="qbar-elapsed">${fmt(elapsed)}</div><div class="slbl">Time</div></div>
      </div>
    </div>
    <div class="ptrack"><div class="pfill" id="pfill" style="width:${pct}%"></div></div>
  `;
  app.appendChild(bar);

  const div = document.createElement('div');
  div.className = 'pg';
  div.style.paddingTop = '22px';

  div.innerHTML = `
    <div id="timeup-banner" class="tuban" style="display:${timeUp?'block':'none'}">⏰ Time's Up — Submit Your Answers Now</div>

    ${questions.map((q,i) => `
      <div class="qc ${answers[q.id]?'ans':''}" id="qc-${q.id}">
        <div class="qnum">
          <span class="qnum-left">Q${String(i+1).padStart(2,"0")} · ${q.subject}</span>
          <span class="qst ${answers[q.id]?'done':''}" id="qst-${q.id}">${answers[q.id]?'✓ Answered':'○ Pending'}</span>
        </div>
        <div class="qtxt">${q.question}</div>
        <div class="og">
          ${Object.entries(q.options).map(([opt,txt]) => `
            <button class="ob ${answers[q.id]===opt?'sel':''}" id="opt-${q.id}-${opt}"
              style="opacity:${submitting?0.6:1};cursor:${submitting?'not-allowed':'pointer'}"
              onclick="selectAnswer('${q.id}','${opt}')">
              <span class="ok">${opt}.</span><span>${txt}</span>
            </button>`).join('')}
        </div>
      </div>`).join('')}

    ${error ? `<div class="errmsg">${error}</div>` : ''}

    <div class="sarea">
      <div class="un" id="unanswered">${questions.length - answered > 0
        ? `${questions.length-answered} question${questions.length-answered!==1?'s':''} unanswered`
        : '✓ All questions answered'}</div>
      <button class="subbtn" ${submitting?'disabled':''} onclick="submit()">
        ${submitting
          ? '<span class="spin"></span> Grading…'
          : '<span>📋</span> Submit &amp; Grade'}
      </button>
    </div>
  `;
  app.appendChild(div);
}

function renderResults(app) {
  const { results, elapsed, timerDuration } = state;
  const div = document.createElement('div');
  div.className = 'pg';

  div.innerHTML = `
    <header class="hd" style="padding-top:22px">
      ${logoHTML(64)}
      <div class="brand" style="font-size:clamp(1.5rem,5vw,2.2rem)">SHADE</div>
      <div class="brand-sub">Made by Shadowseekers for Shadowseekers</div>
    </header>

    <div class="rh">
      <div class="grade-label">Your Grade</div>
      <div class="gl g${results.grade}">${results.grade}</div>
      <div class="sr">
        <div class="si"><div class="sn">${results.score}/${results.total}</div><div class="sll">Score</div></div>
        <div class="si">
          <div class="sn" style="color:${results.percentage>=80?'#ff2222':results.percentage>=60?'#ff6600':results.percentage>=40?'#f59e0b':'#888'}">${results.percentage}%</div>
          <div class="sll">Accuracy</div>
        </div>
        <div class="si"><div class="sn" style="font-family:'Share Tech Mono',monospace">${fmt(elapsed)}</div><div class="sll">Time Taken</div></div>
      </div>
      <div class="divr"></div>
      <div class="sumtxt">${results.summary}</div>
      ${results.timeAnalysis && timerDuration > 0 ? `<div class="tnote">${results.timeAnalysis}</div>` : ''}
    </div>

    <div class="bklbl">Question Breakdown</div>

    ${(results.breakdown || []).map((item, i) => `
      <div class="bkc ${item.isCorrect?'cor':'wrg'}">
        <div class="bkh">
          <div>
            <div class="bkq2">Q${String(i+1).padStart(2,"0")}</div>
            <div class="bksb">${item.subject}</div>
          </div>
          <div class="bkv ${item.isCorrect?'cor':'wrg'}">${item.isCorrect?'✓ Correct':'✗ Incorrect'}</div>
        </div>
        <div class="bkqtxt">${item.question}</div>
        <div class="atags">
          ${item.userAnswer
            ? `<span class="atag ${item.isCorrect?'t-uc':'t-uw'}">Your: ${item.userAnswer}</span>`
            : '<span class="atag t-sk">Not answered</span>'}
          ${!item.isCorrect ? `<span class="atag t-c">Correct: ${item.correct}</span>` : ''}
        </div>
        <div class="expl">${item.explanation}</div>
      </div>`).join('')}

    <div class="ba">
      <button class="ghostbtn" onclick="setState({screen:'setup',level:null,subject:null})">⟳ New Test</button>
      <button class="genbtn" style="max-width:180px" onclick="reset()">⌂ Home</button>
    </div>
  `;
  app.appendChild(div);
}

// ── INIT ──
render();
</script>
</body>
</html>
