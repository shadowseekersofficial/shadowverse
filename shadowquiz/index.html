.ember{position:fixed;pointer-events:none;z-index:0;border-radius:50%;
  background:radial-gradient(circle,rgba(0,200,240,.9),rgba(0,200,240,0));
  animation:emberRise linear infinite;}
@keyframes emberRise{0%{transform:translateY(0) translateX(0) scale(1);opacity:.7}
  50%{transform:translateY(-40vh) translateX(var(--dx)) scale(.6);opacity:.4}
  100%{transform:translateY(-90vh) translateX(var(--dx2)) scale(.1);opacity:0}}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:50;background:rgba(2,8,16,.92);backdrop-filter:blur(32px);
  border-bottom:1px solid rgba(0,120,160,.22);padding:0 16px;height:52px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  box-shadow:0 2px 40px rgba(160,0,20,.12);}
.topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,200,212,.6) 25%,rgba(0,220,240,.3) 50%,rgba(0,200,212,.6) 75%,transparent);
  animation:tglow 4s ease-in-out infinite;}
@keyframes tglow{0%,100%{opacity:.5}50%{opacity:1}}
.topbar-brand{font-family:'Cinzel Decorative',serif;font-size:clamp(.85rem,3vw,1.05rem);color:var(--rb);
  text-shadow:0 0 20px var(--rg),0 0 50px rgba(0,120,180,.2);letter-spacing:.2em;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.daily-badge{font-family:'Share Tech Mono',monospace;font-size:.52rem;letter-spacing:.14em;
  color:var(--rb);background:rgba(0,200,212,.06);border:1px solid rgba(0,200,212,.3);
  padding:4px 10px;border-radius:4px;white-space:nowrap;}
.session-badge{font-family:'Share Tech Mono',monospace;font-size:.56rem;color:var(--green);letter-spacing:.1em;display:flex;align-items:center;gap:6px;}
.session-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;box-shadow:0 0 6px rgba(34,197,94,.6);}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.6}}
.login-btn{font-family:'Share Tech Mono',monospace;font-size:.56rem;color:var(--rb);
  border:1px solid var(--brb);background:rgba(0,200,212,.04);padding:5px 12px;border-radius:5px;cursor:pointer;letter-spacing:.1em;transition:all .25s;}
.login-btn:hover{background:var(--rd);box-shadow:0 0 18px rgba(0,200,212,.25);}
.logout-btn{font-family:'Share Tech Mono',monospace;font-size:.54rem;color:var(--td);border:1px solid rgba(255,255,255,.07);background:none;padding:4px 10px;border-radius:5px;cursor:pointer;letter-spacing:.08em;transition:all .2s;}
.logout-btn:hover{color:var(--rb);border-color:rgba(0,200,212,.35);}

/* PAGE */
.pg{position:relative;z-index:2;max-width:900px;margin:0 auto;padding:0 16px 80px;width:100%;}

/* HERO */
.daily-hero{text-align:center;padding:40px 0 28px;}
.daily-hero-tag{font-family:'Share Tech Mono',monospace;font-size:.54rem;letter-spacing:.3em;color:var(--td);margin-bottom:18px;}
.daily-title{font-family:'Cinzel Decorative',serif;font-size:clamp(1.7rem,6vw,2.8rem);color:var(--rb);
  text-shadow:0 0 40px var(--rg),0 0 80px rgba(200,0,0,.25);letter-spacing:.18em;line-height:1.1;margin-bottom:8px;}
.daily-sub{font-size:clamp(.56rem,2vw,.66rem);color:var(--td);letter-spacing:.15em;margin-bottom:22px;font-family:'Share Tech Mono',monospace;}
.daily-divider{height:1px;background:linear-gradient(90deg,transparent,var(--rb),rgba(255,60,60,.7),var(--rb),transparent);
  box-shadow:0 0 16px rgba(220,40,40,.5),0 0 32px rgba(180,0,20,.2);margin:0 auto;max-width:560px;}
.hero-strip{display:flex;justify-content:center;gap:clamp(12px,3vw,28px);margin:18px 0 0;flex-wrap:wrap;}
.hero-check{font-family:'Share Tech Mono',monospace;font-size:.56rem;color:var(--td);letter-spacing:.12em;display:flex;align-items:center;gap:6px;}
.hero-check::before{content:'✓';color:#ff3030;font-weight:900;}

.countdown-wrap{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
.countdown-unit{text-align:center;background:rgba(0,100,160,.06);border:1px solid rgba(0,120,160,.18);border-radius:8px;padding:8px 14px;min-width:56px;}
.countdown-num{font-family:'Share Tech Mono',monospace;font-size:1.2rem;color:var(--t);line-height:1;}
.countdown-lbl{font-family:'Share Tech Mono',monospace;font-size:.4rem;color:var(--td);letter-spacing:.18em;margin-top:3px;}

/* CARD */
.card{background:linear-gradient(160deg,rgba(2,8,20,.98),rgba(2,6,16,.99));
  border:1px solid rgba(0,120,160,.14);border-radius:14px;padding:18px 16px;margin-bottom:12px;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,200,212,.3),transparent);}
.stag{display:inline-flex;align-items:center;gap:7px;font-size:.56rem;letter-spacing:.28em;text-transform:uppercase;color:var(--r);font-family:'Share Tech Mono',monospace;margin-bottom:14px;}
.stag-n{width:18px;height:18px;border-radius:50%;background:var(--rd);border:1px solid var(--brb);display:flex;align-items:center;justify-content:center;font-size:.5rem;flex-shrink:0;box-shadow:0 0 8px rgba(0,200,212,.25);}

.exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:8px;}
.exam-btn{border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);color:#555;
  padding:12px 10px;border-radius:10px;cursor:pointer;font-family:'Oswald',sans-serif;
  font-size:.82rem;font-weight:400;letter-spacing:.06em;text-align:center;transition:all .2s;line-height:1.35;}
.exam-btn:hover{border-color:rgba(0,200,212,.35);color:#ccc;box-shadow:0 0 12px rgba(180,0,20,.12);}
.exam-btn.sel{background:linear-gradient(135deg,rgba(0,140,200,.18),rgba(0,60,120,.12));border-color:var(--rb);color:#fff;box-shadow:0 0 16px rgba(0,140,200,.22);}
.exam-btn .eb-full{font-size:.46rem;color:var(--td);display:block;margin-top:3px;}

.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px;}
.level-btn{border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.015);
  padding:13px 10px;border-radius:10px;cursor:pointer;text-align:center;transition:all .2s;}
.level-btn:hover{border-color:rgba(0,200,212,.3);box-shadow:0 0 12px rgba(180,0,20,.1);}
.level-btn.sel{background:linear-gradient(135deg,rgba(0,140,200,.18),rgba(0,60,120,.12));border-color:var(--rb);box-shadow:0 0 20px rgba(0,140,200,.2);}
.level-icon{font-size:.7rem;color:var(--r);letter-spacing:.04em;margin-bottom:4px;}
.level-name{font-family:'Oswald',sans-serif;font-size:.84rem;color:var(--t);font-weight:500;letter-spacing:.06em;}
.level-desc{font-size:.47rem;color:var(--td);margin-top:3px;letter-spacing:.04em;}

.info-bubble{background:rgba(180,0,20,.05);border:1px solid rgba(0,120,160,.2);border-radius:10px;
  padding:11px 14px;font-family:'Share Tech Mono',monospace;font-size:.54rem;color:var(--td);letter-spacing:.06em;line-height:1.75;margin-bottom:12px;}
.info-bubble strong{color:var(--r);}

.genbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 28px;
  background:linear-gradient(135deg,rgba(0,80,120,.5),rgba(0,40,100,.4));
  border:1px solid var(--brb);border-radius:12px;color:#fff;
  font-family:'Oswald',sans-serif;font-size:1rem;font-weight:600;letter-spacing:.16em;
  cursor:pointer;transition:all .28s;box-shadow:0 0 20px rgba(200,0,20,.14);}
.genbtn:hover:not(:disabled){box-shadow:0 0 45px rgba(220,20,20,.35),0 0 80px rgba(180,0,20,.1);transform:translateY(-1px);}
.genbtn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.ghostbtn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.02);color:var(--td);border-radius:9px;font-family:'Oswald',sans-serif;font-size:.84rem;letter-spacing:.1em;cursor:pointer;transition:all .2s;}
.ghostbtn:hover{border-color:rgba(255,255,255,.2);color:var(--t);}
.errmsg{color:#ff5555;font-size:.74rem;padding:10px 14px;background:rgba(255,0,30,.05);border-radius:8px;border:1px solid rgba(255,0,30,.18);font-family:'Share Tech Mono',monospace;letter-spacing:.06em;margin-bottom:12px;}

/* LOADING */
.lov{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:65vh;gap:18px;}
.ltxt{font-family:'Cinzel Decorative',serif;font-size:clamp(.9rem,3vw,1.2rem);color:var(--rb);letter-spacing:.22em;text-shadow:0 0 20px var(--rg);}
.lsub{font-size:clamp(.54rem,2vw,.66rem);color:var(--td);letter-spacing:.1em;font-family:'Share Tech Mono',monospace;}
.ldots{display:flex;gap:8px;}
.ldot{width:8px;height:8px;background:var(--r);border-radius:50%;animation:db 1.4s ease-in-out infinite both;box-shadow:0 0 8px var(--rg);}
.ldot:nth-child(2){animation-delay:.2s}.ldot:nth-child(3){animation-delay:.4s}
@keyframes db{0%,80%,100%{transform:scale(0);opacity:.3}40%{transform:scale(1);opacity:1}}

/* QUIZ */
.qbar{position:sticky;top:52px;z-index:20;background:rgba(2,8,16,.92);backdrop-filter:blur(24px);border-bottom:1px solid rgba(0,120,160,.18);}
.qbar-inner{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:100%;margin:0;padding:10px 24px;}
.qbar-lft{display:flex;align-items:center;gap:9px;min-width:0;flex:1;}
.qmeta strong{color:var(--rb);font-size:clamp(.58rem,2.4vw,.7rem);display:block;font-family:'Cinzel Decorative',serif;letter-spacing:.1em;white-space:nowrap;text-shadow:0 0 12px var(--rg);}
.qmeta span{font-size:clamp(.48rem,1.7vw,.58rem);color:var(--td);letter-spacing:.06em;white-space:nowrap;display:block;}
.qstats{display:flex;gap:12px;align-items:center;flex-shrink:0;}
.sv{font-family:'Share Tech Mono',monospace;font-size:clamp(.74rem,2.3vw,.88rem);color:var(--t);text-align:center;white-space:nowrap;}
.sv.danger{color:#ff2222;text-shadow:0 0 10px rgba(255,34,34,.6);animation:flicker .9s infinite;}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.4}}
.slbl{font-size:clamp(.4rem,1.3vw,.5rem);color:var(--td);letter-spacing:.15em;text-transform:uppercase;margin-top:1px;text-align:center;white-space:nowrap;}
.ptrack{height:2px;background:rgba(255,255,255,.04);}
.pfill{height:100%;background:linear-gradient(90deg,rgba(0,60,120,1),var(--rb));transition:width .4s ease;box-shadow:0 0 8px var(--rg);}

.quiz-shell{display:grid;grid-template-columns:1fr 300px;gap:0;width:100%;min-height:calc(100vh - 104px);align-items:start;position:relative;z-index:2;}
@media(max-width:720px){.quiz-shell{grid-template-columns:1fr;}}
.quiz-main{padding:24px 32px 40px;max-width:900px;width:100%;}
.quiz-panel{padding:16px 16px 40px;display:flex;flex-direction:column;gap:10px;position:sticky;top:104px;background:rgba(2,8,16,.6);backdrop-filter:blur(12px);border-left:1px solid rgba(0,140,180,.15);min-height:calc(100vh - 104px);}
@media(max-width:720px){.quiz-panel{position:static;min-height:auto;border-left:none;border-top:1px solid rgba(0,140,180,.15);padding:16px;}}

.sq-card{background:linear-gradient(135deg,rgba(2,8,20,.98),rgba(2,6,16,.99));border:1px solid rgba(180,20,40,.15);border-radius:16px;padding:20px 18px;position:relative;overflow:hidden;}
.sq-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--rb),#003050);}
.sq-badge{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:13px;}
.sq-qnum{font-family:'Share Tech Mono',monospace;font-size:.6rem;color:var(--r);letter-spacing:.14em;}
.sq-subject{font-family:'Share Tech Mono',monospace;font-size:.5rem;color:var(--td);letter-spacing:.08em;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);padding:2px 8px;border-radius:4px;}
.sq-status{font-family:'Share Tech Mono',monospace;font-size:.5rem;color:#333;letter-spacing:.08em;margin-left:auto;}
.sq-status.done{color:#22c55e;}
.sq-qtxt{font-size:clamp(.92rem,1.6vw,1.08rem);line-height:1.78;color:#eedede;margin-bottom:20px;font-weight:300;}
.sq-options{display:flex;flex-direction:column;gap:8px;}
.sq-opt{border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.015);color:#777;
  padding:13px 18px;border-radius:10px;cursor:pointer;font-family:'Oswald',sans-serif;
  font-size:clamp(.8rem,1.4vw,.95rem);font-weight:300;text-align:left;transition:all .15s;
  display:flex;gap:12px;align-items:flex-start;line-height:1.5;}
.sq-opt:hover{border-color:rgba(0,200,212,.3);color:#ccc;background:rgba(180,0,20,.04);}
.sq-opt.sel{background:linear-gradient(135deg,rgba(0,140,200,.2),rgba(80,0,40,.14));border-color:var(--rb);color:#fff;box-shadow:0 0 14px rgba(0,140,200,.18);}
.sq-optkey{color:var(--r);flex-shrink:0;font-weight:700;}
.sq-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.05);}
.sq-navbtn{padding:10px 22px;border-radius:9px;font-family:'Oswald',sans-serif;font-size:.84rem;font-weight:600;letter-spacing:.1em;cursor:pointer;transition:all .2s;}
.sq-prev{border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.02);color:var(--td);}
.sq-prev:hover:not(:disabled){border-color:rgba(255,255,255,.22);color:var(--t);}
.sq-prev:disabled{opacity:.22;cursor:not-allowed;}
.sq-next{border:1px solid var(--brb);background:linear-gradient(135deg,rgba(0,80,140,.5),rgba(0,40,100,.4));color:#fff;}
.sq-next:hover:not(:disabled){box-shadow:0 0 28px rgba(0,180,200,.4);transform:translateY(-1px);}
.sq-next:disabled{opacity:.3;cursor:not-allowed;}
.sq-progress{font-family:'Share Tech Mono',monospace;font-size:.56rem;color:var(--td);display:flex;flex-direction:column;align-items:center;gap:4px;}
.sq-progress-bar{width:70px;height:2px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;}
.sq-progress-fill{height:100%;background:var(--rb);border-radius:2px;transition:width .3s;}
.tuban{background:rgba(255,20,20,.07);border:1px solid rgba(255,20,20,.25);border-radius:10px;padding:10px 16px;text-align:center;font-size:.75rem;color:#ff4444;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;animation:flicker .9s infinite;}

.qp-panel-card{background:rgba(2,8,20,.88);border:1px solid rgba(0,120,160,.18);border-radius:12px;padding:13px 12px;}
.qp-title{font-family:'Share Tech Mono',monospace;font-size:.45rem;color:var(--td);letter-spacing:.22em;margin-bottom:9px;text-transform:uppercase;}
.qp-timer-val{font-family:'Share Tech Mono',monospace;font-size:1.9rem;color:var(--t);letter-spacing:.04em;line-height:1;text-align:center;display:block;margin-bottom:2px;}
.qp-timer-val.danger{color:#ff2222;text-shadow:0 0 16px rgba(255,34,34,.7);animation:flicker .9s infinite;}
.qp-timer-lbl{font-family:'Share Tech Mono',monospace;font-size:.42rem;color:var(--td);letter-spacing:.16em;text-align:center;display:block;}
.qp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
.qp-btn{width:100%;aspect-ratio:1;border-radius:6px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.015);color:#2a2a2a;font-family:'Share Tech Mono',monospace;font-size:.52rem;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.qp-btn:hover{border-color:rgba(0,200,212,.35);color:#bbb;}
.qp-btn.current{border-color:var(--rb);color:#fff;background:rgba(0,140,200,.18);box-shadow:0 0 8px rgba(0,140,200,.2);}
.qp-btn.answered{border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.08);color:#22c55e;}
.qp-leg-row{display:flex;align-items:center;gap:6px;font-family:'Share Tech Mono',monospace;font-size:.43rem;color:var(--td);margin-top:5px;}
.qp-leg-dot{width:8px;height:8px;border-radius:3px;flex-shrink:0;}
.qp-submit-btn{width:100%;padding:12px;background:linear-gradient(135deg,rgba(0,80,120,.6),rgba(0,40,100,.5));border:1px solid var(--brb);border-radius:9px;color:#fff;font-family:'Oswald',sans-serif;font-size:.86rem;font-weight:600;letter-spacing:.12em;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.qp-submit-btn:hover{box-shadow:0 0 24px rgba(0,180,200,.4);transform:translateY(-1px);}
.qp-submit-btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}

/* RESULTS */
.res-shell{display:grid;grid-template-columns:1fr 356px;gap:0;max-width:900px;margin:0 auto;align-items:start;position:relative;z-index:2;}
@media(max-width:840px){.res-shell{grid-template-columns:1fr;}}
.res-main{padding:clamp(14px,3vw,24px) clamp(12px,3vw,20px) 60px;display:flex;flex-direction:column;gap:12px;}

.res-hero{position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(10,2,16,.99),rgba(6,0,10,.99));
  border:1px solid rgba(255,255,255,.08);border-radius:20px;box-shadow:0 0 80px rgba(160,0,20,.08);
  animation:slideUp .65s cubic-bezier(.2,0,.1,1) both;}
@keyframes slideUp{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
.res-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--rb),rgba(255,80,80,.4),var(--rb),transparent);}
.res-hero-inner{position:relative;z-index:2;padding:clamp(24px,5vw,44px) clamp(16px,4vw,36px) clamp(20px,4vw,36px);text-align:center;}
.res-mission-tag{font-family:'Share Tech Mono',monospace;font-size:clamp(.42rem,1.3vw,.52rem);color:var(--td);letter-spacing:.22em;text-transform:uppercase;margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:8px;}
.res-mission-tag::before,.res-mission-tag::after{content:'';flex:1;max-width:50px;height:1px;background:rgba(255,255,255,.06);}
.res-sigil{font-size:clamp(3.5rem,12vw,5.5rem);line-height:1;margin-bottom:4px;filter:drop-shadow(0 0 30px currentColor);animation:sigilPop .9s cubic-bezier(.2,0,.1,1) .15s both;}
@keyframes sigilPop{from{opacity:0;transform:scale(.2) rotate(-20deg)}60%{transform:scale(1.18) rotate(3deg)}to{opacity:1;transform:scale(1) rotate(0deg)}}
.res-rank-name{font-family:'Cinzel Decorative',serif;font-size:clamp(1rem,3.5vw,1.8rem);font-weight:900;letter-spacing:.16em;margin:12px 0 8px;animation:fadeUp .65s ease .35s both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.res-rank-desc{font-size:clamp(.64rem,2vw,.76rem);color:var(--td);font-weight:300;max-width:360px;margin:0 auto 22px;line-height:1.65;animation:fadeUp .65s ease .48s both;font-style:italic;}
.res-score-row{display:flex;justify-content:center;gap:0;margin-bottom:20px;animation:fadeUp .65s ease .55s both;border:1px solid rgba(255,255,255,.06);border-radius:14px;overflow:hidden;background:rgba(0,0,0,.25);}
.res-stat-big{padding:clamp(12px,2.5vw,20px) clamp(14px,3vw,28px);text-align:center;flex:1;position:relative;}
.res-stat-big+.res-stat-big::before{content:'';position:absolute;left:0;top:20%;height:60%;width:1px;background:rgba(255,255,255,.06);}
.res-stat-num{font-family:'Cinzel Decorative',serif;font-size:clamp(1.4rem,4vw,2rem);font-weight:900;color:var(--t);line-height:1;}
.res-stat-lbl{font-family:'Share Tech Mono',monospace;font-size:clamp(.38rem,1.2vw,.47rem);color:var(--td);letter-spacing:.2em;text-transform:uppercase;margin-top:5px;}
.res-arc-wrap{max-width:300px;margin:0 auto;animation:fadeUp .65s ease .65s both;}
.res-arc-labels{display:flex;justify-content:space-between;font-family:'Share Tech Mono',monospace;font-size:clamp(.42rem,1.3vw,.5rem);color:var(--td);margin-top:5px;}

.res-pills{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;animation:slideUp .5s ease .28s both;}
.res-pill{border-radius:13px;padding:clamp(11px,2.5vw,16px) 10px;text-align:center;border:1px solid rgba(255,255,255,.06);position:relative;overflow:hidden;transition:transform .2s;}
.res-pill:hover{transform:translateY(-2px);}
.res-pill::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;}
.res-pill-ok{background:linear-gradient(160deg,rgba(34,197,94,.07),rgba(34,197,94,.02));border-color:rgba(34,197,94,.2);}
.res-pill-ok::before{background:linear-gradient(90deg,transparent,rgba(34,197,94,.35),transparent);}
.res-pill-err{background:linear-gradient(160deg,rgba(239,68,68,.07),rgba(239,68,68,.02));border-color:rgba(239,68,68,.2);}
.res-pill-err::before{background:linear-gradient(90deg,transparent,rgba(239,68,68,.35),transparent);}
.res-pill-skip{background:linear-gradient(160deg,rgba(100,116,139,.07),rgba(100,116,139,.02));border-color:rgba(100,116,139,.15);}
.res-pill-icon{font-size:1rem;margin-bottom:5px;}
.res-pill-ok .res-pill-icon{color:#22c55e;}
.res-pill-err .res-pill-icon{color:#ef4444;}
.res-pill-skip .res-pill-icon{color:#64748b;}
.res-pill-num{font-family:'Cinzel Decorative',serif;font-size:clamp(1.3rem,4vw,1.7rem);font-weight:900;color:var(--t);line-height:1;}
.res-pill-lbl{font-family:'Share Tech Mono',monospace;font-size:clamp(.38rem,1.2vw,.45rem);color:var(--td);letter-spacing:.16em;text-transform:uppercase;margin-top:4px;}

.res-card{background:linear-gradient(145deg,rgba(2,8,18,.95),rgba(2,5,14,.98));border:1px solid rgba(180,20,40,.12);border-radius:14px;padding:clamp(12px,2.5vw,18px);animation:slideUp .5s ease both;position:relative;overflow:hidden;}
.res-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,200,212,.2),transparent);}
.res-card-title{font-family:'Share Tech Mono',monospace;font-size:clamp(.45rem,1.5vw,.52rem);color:var(--r);letter-spacing:.26em;text-transform:uppercase;margin-bottom:13px;}

/* LEADERBOARD */
.lb-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.04);background:rgba(255,255,255,.012);margin-bottom:6px;transition:all .2s;}
.lb-row:hover{border-color:rgba(255,255,255,.09);}
.lb-row.lb-me{border-color:var(--brb);background:rgba(0,160,200,.07);box-shadow:0 0 18px rgba(0,160,200,.07);}
.lb-rank{font-family:'Share Tech Mono',monospace;font-size:.68rem;min-width:26px;text-align:center;flex-shrink:0;}
.lb-info{flex:1;min-width:0;}
.lb-name{font-family:'Oswald',sans-serif;font-size:.8rem;font-weight:600;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb-meta{font-family:'Share Tech Mono',monospace;font-size:.42rem;color:var(--td);letter-spacing:.05em;margin-top:2px;}
.lb-score{text-align:right;flex-shrink:0;}
.lb-pct{font-family:'Cinzel Decorative',serif;font-size:.88rem;font-weight:700;}
.lb-time{font-family:'Share Tech Mono',monospace;font-size:.42rem;color:var(--td);margin-top:1px;}

/* REVIEW PANEL */
.res-panel{padding:clamp(14px,3vw,24px) clamp(12px,3vw,18px) 60px;}
.res-panel-title{font-family:'Cinzel Decorative',serif;font-size:.88rem;color:var(--rb);letter-spacing:.12em;text-shadow:0 0 12px var(--rg);}
.res-panel-sub{font-family:'Share Tech Mono',monospace;font-size:.47rem;color:var(--td);letter-spacing:.1em;margin-top:4px;margin-bottom:13px;}
.res-dot-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:13px;}
.res-dot{width:100%;aspect-ratio:1;border-radius:7px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.015);color:#2a2a2a;font-family:'Share Tech Mono',monospace;font-size:.5rem;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.res-dot-ok{border-color:rgba(34,197,94,.38);color:#22c55e;background:rgba(34,197,94,.06);}
.res-dot-err{border-color:rgba(239,68,68,.38);color:#ef4444;background:rgba(239,68,68,.06);}
.res-dot-skip{border-color:rgba(100,116,139,.25);color:#64748b;}
.res-dot-active{box-shadow:0 0 10px rgba(0,200,212,.4);border-color:var(--rb)!important;}
.res-q-detail{background:rgba(255,255,255,.012);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:14px;min-height:180px;}
.rqd-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.rqd-num{font-family:'Share Tech Mono',monospace;font-size:.54rem;color:var(--r);letter-spacing:.14em;}
.rqd-sub{font-family:'Share Tech Mono',monospace;font-size:.47rem;color:var(--td);background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);padding:2px 7px;border-radius:4px;}
.rqd-verdict{font-family:'Share Tech Mono',monospace;font-size:.47rem;padding:2px 8px;border-radius:4px;margin-left:auto;}
.rqd-ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.28);color:#22c55e;}
.rqd-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.28);color:#ef4444;}
.rqd-skip{background:rgba(100,116,139,.07);border:1px solid rgba(100,116,139,.18);color:#64748b;}
.rqd-qtxt{font-size:clamp(.74rem,2.2vw,.82rem);color:#ddd;line-height:1.62;margin-bottom:11px;font-weight:300;}
.rqd-opts{display:flex;flex-direction:column;gap:5px;margin-bottom:11px;}
.rqd-opt{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.04);background:rgba(255,255,255,.012);font-size:clamp(.67rem,1.9vw,.73rem);color:#777;}
.rqd-opt-correct{border-color:rgba(34,197,94,.32);background:rgba(34,197,94,.05);color:#22c55e;}
.rqd-opt-wrong{border-color:rgba(239,68,68,.32);background:rgba(239,68,68,.05);color:#ef4444;}
.rqd-opt-key{font-family:'Share Tech Mono',monospace;font-size:.52rem;font-weight:700;flex-shrink:0;margin-top:1px;}
.rqd-opt-txt{flex:1;line-height:1.5;}
.rqd-opt-tag{font-family:'Share Tech Mono',monospace;font-size:.42rem;padding:2px 5px;border-radius:3px;flex-shrink:0;white-space:nowrap;}
.rqd-tag-correct{background:rgba(34,197,94,.12);color:#22c55e;}
.rqd-tag-wrong{background:rgba(239,68,68,.12);color:#ef4444;}
.rqd-nav{display:flex;justify-content:space-between;gap:8px;padding-top:9px;border-top:1px solid rgba(255,255,255,.04);}
.rqd-navbtn{border:1px solid rgba(255,255,255,.09);background:none;color:var(--td);font-family:'Share Tech Mono',monospace;font-size:.5rem;padding:5px 11px;border-radius:6px;cursor:pointer;transition:all .2s;}
.rqd-navbtn:hover:not(:disabled){color:var(--t);border-color:rgba(255,255,255,.22);}
.rqd-navbtn:disabled{opacity:.22;cursor:not-allowed;}

.rsub-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.rsub-name{font-family:'Share Tech Mono',monospace;font-size:clamp(.44rem,1.4vw,.52rem);color:var(--td);min-width:80px;flex-shrink:0;}
.rsub-bar-wrap{flex:1;height:5px;background:rgba(255,255,255,.04);border-radius:3px;overflow:hidden;}
.rsub-bar{height:100%;width:0;border-radius:3px;transition:width 1.4s cubic-bezier(.2,0,.1,1);}
.rsub-num{font-family:'Share Tech Mono',monospace;font-size:.5rem;min-width:32px;text-align:right;font-weight:600;}
.res-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px;}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(2,6,16,.9);backdrop-filter:blur(18px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:linear-gradient(135deg,rgba(2,8,20,.99),rgba(2,6,16,.99));border:1px solid var(--brb);border-radius:20px;padding:32px 24px;width:100%;max-width:360px;position:relative;box-shadow:0 0 80px rgba(0,140,200,.2);animation:modalIn .3s cubic-bezier(.2,0,.1,1);}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(20px)}to{opacity:1;transform:none}}
.modal-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--rb),rgba(255,80,80,.4),var(--rb),transparent);}
.modal-close{position:absolute;top:12px;right:12px;background:none;border:1px solid rgba(255,255,255,.09);color:var(--td);font-family:'Share Tech Mono',monospace;font-size:.56rem;padding:4px 9px;border-radius:5px;cursor:pointer;transition:all .2s;}
.modal-close:hover{color:#fff;border-color:rgba(255,255,255,.28);}
.modal-title{font-family:'Cinzel Decorative',serif;font-size:.98rem;color:var(--rb);letter-spacing:.16em;margin-bottom:4px;text-align:center;text-shadow:0 0 18px rgba(0,200,212,.5);}
.modal-sub{font-family:'Share Tech Mono',monospace;font-size:.5rem;color:var(--td);letter-spacing:.1em;text-align:center;margin-bottom:20px;}
.modal-field{margin-bottom:14px;}
.modal-label{font-family:'Share Tech Mono',monospace;font-size:.47rem;color:var(--td);letter-spacing:.14em;display:block;margin-bottom:6px;}
.modal-input{width:100%;background:rgba(200,20,30,.04);border:1px solid var(--br);border-radius:8px;padding:10px 12px;color:var(--t);font-family:'Share Tech Mono',monospace;font-size:.8rem;letter-spacing:.1em;outline:none;transition:border-color .2s;}
.modal-input:focus{border-color:var(--brb);box-shadow:0 0 12px rgba(200,20,30,.12);}
.modal-err{font-family:'Share Tech Mono',monospace;font-size:.54rem;color:#ff4444;letter-spacing:.08em;text-align:center;margin-bottom:12px;display:none;}
.modal-btn{width:100%;padding:12px;background:linear-gradient(135deg,rgba(0,80,120,.65),rgba(0,40,100,.55));border:1px solid var(--brb);border-radius:10px;color:#fff;font-family:'Oswald',sans-serif;font-size:.92rem;font-weight:600;letter-spacing:.14em;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.modal-btn:hover:not(:disabled){box-shadow:0 0 28px rgba(0,180,200,.4);}
.modal-btn:disabled{opacity:.5;cursor:not-allowed;}
.modal-hint{font-family:'Share Tech Mono',monospace;font-size:.47rem;color:var(--td);letter-spacing:.08em;text-align:center;margin-bottom:14px;line-height:1.7;}

.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.18);border-top-color:#fff;border-radius:50%;animation:spinAnim .8s linear infinite;}
@keyframes spinAnim{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bgfx"></div>
  <div class="scan"></div>

  <div class="topbar">
    <div class="topbar-brand">SHADE</div>
    <div class="topbar-right" id="topbar-right">
      <div class="daily-badge">◈ DAILY</div>
    </div>
  </div>

  <!-- LOGIN MODAL -->
  <div class="modal-overlay" id="modal-login" style="display:none">
    <div class="modal-box">
      <button class="modal-close" onclick="closeLogin()">✕</button>
      <div class="modal-title">OPERATIVE LOGIN</div>
      <div class="modal-sub">SHADOW ID + PASSPHRASE</div>
      <div class="modal-field">
        <label class="modal-label">SHADOW ID</label>
        <input class="modal-input" id="login-id" placeholder="SS0001" maxlength="8" onkeydown="if(event.key==='Enter')submitLogin()"/>
      </div>
      <div class="modal-field">
        <label class="modal-label">PASSPHRASE</label>
        <input class="modal-input" id="login-pw" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')submitLogin()"/>
      </div>
      <div class="modal-err" id="login-err">▲ INVALID CREDENTIALS</div>
      <button class="modal-btn" onclick="submitLogin()">◉ ENTER SHADE</button>
    </div>
  </div>

  <!-- GUEST NAME MODAL -->
  <div class="modal-overlay" id="modal-name" style="display:none">
    <div class="modal-box">
      <button class="modal-close" onclick="$('modal-name').style.display='none'">✕</button>
      <div class="modal-title">ENTER THE SHADOW</div>
      <div class="modal-sub">CODENAME FOR LEADERBOARD</div>
      <div class="modal-field">
        <label class="modal-label">CODENAME</label>
        <input class="modal-input" id="name-input" placeholder="e.g. Arjun Sharma" maxlength="24" onkeydown="if(event.key==='Enter')submitName()"/>
      </div>
      <div class="modal-err" id="name-err">▲ Enter a codename</div>
      <div class="modal-hint">Login as operative to skip this — your Shadow ID tracks everything automatically</div>
      <button class="modal-btn" id="name-btn" onclick="submitName()">◉ BEGIN DAILY MISSION</button>
    </div>
  </div>
</div>

<script>
// ═══════════════ CONFIG ═══════════════
const GAS_URL    = "https://script.google.com/macros/s/AKfycby7i3wZYpW1tPQJSVOk_-BieuaufrYmINCswtqtqe-Yaeix8UweAkVxfT9r9ctPHeOw2g/exec";
const WORKER_URL = "https://winter-frost-06b8.shadowseekersofficial.workers.dev/";

const COURSES = {
  NDA:      {label:"NDA",         fullName:"National Defence Academy",               subjects:["Mathematics","General Ability Test"]},
  CDS:      {label:"CDS",         fullName:"Combined Defence Services",              subjects:["Elementary Mathematics","English","General Knowledge"]},
  AFCAT:    {label:"AFCAT",       fullName:"Air Force Common Admission Test",         subjects:["Verbal Ability","Numerical Ability","Reasoning & Military Aptitude"]},
  JEE_MAINS:{label:"JEE Mains",   fullName:"Joint Entrance Exam — Mains",            subjects:["Physics","Chemistry","Mathematics"]},
  JEE_ADV:  {label:"JEE Adv",     fullName:"Joint Entrance Exam — Advanced",         subjects:["Physics","Chemistry","Mathematics"]},
  NEET:     {label:"NEET",        fullName:"National Eligibility cum Entrance Test",  subjects:["Physics","Chemistry","Biology (Botany)","Biology (Zoology)"]},
  SSC:      {label:"SSC",         fullName:"Staff Selection Commission",             subjects:["General Intelligence & Reasoning","General Awareness","Quantitative Aptitude","English Comprehension"]},
  UPSC:     {label:"UPSC CSE",    fullName:"Civil Services Exam (Prelims)",           subjects:["General Studies I","General Studies II (CSAT)"]},
  CUET:     {label:"CUET",        fullName:"Common University Entrance Test",         subjects:["General Test","English","Domain Subject"]},
  CA_FOUND: {label:"CA Foundation",fullName:"Chartered Accountancy Foundation",       subjects:["Principles of Accounting","Business Law","Maths & Logical Reasoning","Business Economics"]},
  CLAT:     {label:"CLAT",        fullName:"Common Law Admission Test",               subjects:["English Language","Current Affairs & GK","Legal Reasoning","Logical Reasoning","Quantitative Techniques"]},
  GATE:     {label:"GATE",        fullName:"Graduate Aptitude Test in Engineering",   subjects:["Engineering Mathematics","General Aptitude","Core Engineering"]},
};

const LEVELS = [
  {id:"Beginner",    icon:"◈",     desc:"NCERT / Entry level",      criteria:"strictly Class 11-12 NCERT syllabus level — direct formula application, basic definitions, simple one-step problems. Solvable by a sincere Class 12 student with effort. NOT trivially easy."},
  {id:"Intermediate",icon:"◈◈",   desc:"PYQ / Real exam pattern",   criteria:"strictly modelled on actual Previous Year Questions (PYQs). Match exact pattern, difficulty, trap options, and style of real exam papers. Multi-concept, elimination-based reasoning exactly as seen in real exam halls."},
  {id:"Advanced",    icon:"◈◈◈", desc:"Harder than actual exam",    criteria:"harder than the actual exam. Multi-step problems, deeply tricky distractors requiring strong conceptual clarity, edge cases and exceptions. ZERO tolerance for easy questions."},
  {id:"Elite",       icon:"◈◈◈◈",desc:"Topper killer tier",          criteria:"topper-killer difficulty — separates 95th from 99th percentile. Connecting 2-3 concepts simultaneously, heavy calculation or deep reasoning. Wrong options must be extremely deceptive."},
  {id:"Voidwalker",  icon:"⬡",    desc:"Beyond any real exam",       criteria:"beyond any official exam ever set. Questions rank-1 students would pause on. Multi-layered traps, counter-intuitive correct answers, absolute limits of conceptual understanding."},
];

function getShadowRank(pct){
  if(pct>=95)return{rank:"VOID SOVEREIGN", sigil:"⬡",color:"#ffd0d0",glow:"rgba(255,180,180,.7)",desc:"You transcend the known. The Void itself bows."};
  if(pct>=85)return{rank:"SHADOW ELITE",   sigil:"◈",color:"#ff4040",glow:"rgba(255,40,40,.7)",  desc:"The darkness chose you. Few reach this far."};
  if(pct>=70)return{rank:"NIGHTBLADE",     sigil:"◆",color:"#c084fc",glow:"rgba(192,132,252,.6)",desc:"Sharp as obsidian. Cutting through the mist."};
  if(pct>=55)return{rank:"DUSK OPERATIVE", sigil:"◇",color:"#f87171",glow:"rgba(248,113,113,.6)",desc:"You operate in twilight. Potential runs deep."};
  if(pct>=40)return{rank:"SHADOW RECRUIT", sigil:"○",color:"#64748b",glow:"rgba(100,116,139,.5)",desc:"The path is long. Begin again. Grow."};
  return            {rank:"GHOST",         sigil:"·",color:"#3f3f46",glow:"rgba(63,63,70,.4)",   desc:"Shadows don't remember you yet."};
}

const fmt=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
const $=id=>document.getElementById(id);

// ═══════════════ DATE ═══════════════
function todayKey(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function toNextMidnight(){const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);return m-n;}

// ═══════════════ STATE ═══════════════
let S={screen:"setup",course:null,level:null,questions:[],answers:{},results:null,elapsed:0,timerDuration:15,timeUp:false,timerInterval:null,startTime:null,qi:0,error:"",submitting:false};
let loggedIn=null; // {shadowId,codename}
let guestName="";
let members={};
let _resQIdx=0;

const opName=()=>loggedIn?loggedIn.codename:guestName;
const opId  =()=>loggedIn?loggedIn.shadowId:"G_"+(guestName||"SHADOW").replace(/\s/g,"_");

// ═══════════════ SESSION ═══════════════
function saveLocal(){
  if(S.screen==="quiz"||S.screen==="results"){
    try{localStorage.setItem("sdq_session",JSON.stringify({...S,todayKey:todayKey(),opId:opId()}));}catch(e){}
  }else{localStorage.removeItem("sdq_session");}
}
function loadLocal(){
  try{
    const r=JSON.parse(localStorage.getItem("sdq_session")||"null");
    if(r&&r.todayKey===todayKey()&&(r.screen==="quiz"||r.screen==="results")){Object.assign(S,r);return true;}
  }catch(e){}
  return false;
}

// ═══════════════ GAS ═══════════════
async function gas(action,data={}){
  const res=await fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action,...data}),redirect:"follow"});
  const txt=await res.text();
  try{return JSON.parse(txt);}catch(e){const m=txt.match(/([\[{][\s\S]*[\]}])/);if(m)return JSON.parse(m[1]);throw new Error("Bad response");}
}

async function pullMembers(){
  try{
    const d=await gas("readShade");
    if(d.members){members={};d.members.forEach(m=>{if(m.shadowId)members[m.shadowId]={passphrase:m.passphrase||"",codename:m.codename||m.shadowId};});localStorage.setItem("sdq_members",JSON.stringify(members));}
  }catch(e){try{members=JSON.parse(localStorage.getItem("sdq_members")||"{}");}catch(e2){}}
}

// ═══════════════ LOGIN ═══════════════
function openLogin(){$("login-id").value="";$("login-pw").value="";$("login-err").style.display="none";$("modal-login").style.display="flex";setTimeout(()=>$("login-id").focus(),50);}
function closeLogin(){$("modal-login").style.display="none";}
async function submitLogin(){
  const id=($("login-id").value||"").trim().toUpperCase(),pw=$("login-pw").value;
  $("login-err").style.display="none";
  if(members[id]&&members[id].passphrase===pw){
    loggedIn={shadowId:id,codename:members[id].codename||id};
    localStorage.setItem("sdq_user",JSON.stringify(loggedIn));
    closeLogin();renderTopbar();
  }else{$("login-err").style.display="block";}
}
function logout(){loggedIn=null;localStorage.removeItem("sdq_user");renderTopbar();}

// ═══════════════ TOPBAR ═══════════════
function renderTopbar(){
  const tr=$("topbar-right");if(!tr)return;
  if(loggedIn){
    tr.innerHTML=`<div class="session-badge"><span class="session-dot"></span>${loggedIn.shadowId} · ${loggedIn.codename}</div>
      <button class="logout-btn" onclick="logout()">[ EXIT ]</button>
      <div class="daily-badge">◈ DAILY</div>`;
  }else{
    tr.innerHTML=`<button class="login-btn" onclick="openLogin()">◈ OPERATIVE LOGIN</button>
      <div class="daily-badge">◈ DAILY</div>`;
  }
}

// ═══════════════ RENDER ═══════════════
function render(){
  const app=$("app");
  Array.from(app.children).forEach(c=>{
    if(!c.classList.contains("bgfx")&&!c.classList.contains("scan")&&!c.classList.contains("topbar")&&!c.classList.contains("modal-overlay"))c.remove();
  });
  renderTopbar();
  if(S.screen==="loading"){rLoading(app);return;}
  if(S.screen==="setup")  {rSetup(app);return;}
  if(S.screen==="quiz")   {rQuiz(app);return;}
  if(S.screen==="results"){rResults(app);return;}
}

// ═══════════════ SETUP ═══════════════
function rSetup(app){
  const d=document.createElement("div");d.className="pg";
  d.innerHTML=`
    <div class="daily-hero">
      <div class="daily-hero-tag">◉ SHADOWSEEKERS · ONE SHOT · EVERY DAY</div>
      <div class="daily-title">DAILY SHADOW QUIZ</div>
      <div class="daily-sub">FOCUS · SOLVE · ADAPT · REPEAT · EVERY SECOND IS LOGGED</div>
      <div class="daily-divider"></div>
      <div class="hero-strip">
        <span class="hero-check">10 QUESTIONS</span>
        <span class="hero-check">15 MIN LIMIT</span>
        <span class="hero-check">ONE ATTEMPT</span>
        <span class="hero-check">LIVE LEADERBOARD</span>
      </div>
    </div>

    <div class="info-bubble">
      <strong>◈ HOW IT WORKS</strong> — Pick your exam + difficulty. SHADE generates
      <strong>10 AI-crafted mix questions</strong> seeded to today's date — the server caches them so
      <strong>everyone gets the exact same 10</strong>. One attempt per day per combo.
      Score posts to the <strong>global daily leaderboard</strong> instantly. New challenge at midnight.
    </div>

    <div class="card">
      <div class="stag"><div class="stag-n">1</div>Choose Exam</div>
      <div class="exam-grid">
        ${Object.entries(COURSES).map(([k,c])=>`
          <button class="exam-btn${S.course===k?" sel":""}" onclick="pickExam('${k}')">
            ${c.label}<span class="eb-full">${c.fullName}</span>
          </button>`).join("")}
      </div>
    </div>

    ${S.course?`
    <div class="card">
      <div class="stag"><div class="stag-n">2</div>Difficulty</div>
      <div class="level-grid">
        ${LEVELS.map(l=>`
          <button class="level-btn${S.level===l.id?" sel":""}" onclick="pickLevel('${l.id}')">
            <div class="level-icon">${l.icon}</div>
            <div class="level-name">${l.id}</div>
            <div class="level-desc">${l.desc}</div>
          </button>`).join("")}
      </div>
    </div>`:""}

    ${S.error?`<div class="errmsg">${S.error}</div>`:""}

    ${S.course&&S.level?`
    <button class="genbtn" onclick="beginDaily()">
      <span>⚡</span> Begin Today's Mission — ${S.level} · ${COURSES[S.course]?.label} · Mix
    </button>`:`
    <button class="genbtn" disabled><span>◈</span> Complete setup above</button>`}

    <div style="text-align:center;margin-top:24px">
      <div style="font-family:'Share Tech Mono',monospace;font-size:.47rem;color:var(--td);letter-spacing:.18em;margin-bottom:10px">NEXT CHALLENGE RESETS IN</div>
      <div class="countdown-wrap">
        <div class="countdown-unit"><div class="countdown-num" id="cd-h">--</div><div class="countdown-lbl">Hours</div></div>
        <div class="countdown-unit"><div class="countdown-num" id="cd-m">--</div><div class="countdown-lbl">Mins</div></div>
        <div class="countdown-unit"><div class="countdown-num" id="cd-s">--</div><div class="countdown-lbl">Secs</div></div>
      </div>
    </div>`;
  app.appendChild(d);
  tickCD();
}

function pickExam(k){S.course=k;S.level=null;S.error="";render();}
function pickLevel(l){S.level=l;S.error="";render();}

// ═══════════════ LOADING ═══════════════
function rLoading(app){
  const d=document.createElement("div");d.className="pg";
  d.innerHTML=`<div class="lov">
    <div style="font-size:2.4rem;filter:drop-shadow(0 0 20px rgba(220,40,40,.6));animation:sigilPop .9s ease both">◈</div>
    <div class="ltxt">FORGING TODAY'S CHALLENGE</div>
    <div class="lsub">${S.level?.toUpperCase()} TIER · ${COURSES[S.course]?.label||""} · ALL SUBJECTS</div>
    <div class="ldots"><div class="ldot"></div><div class="ldot"></div><div class="ldot"></div></div>
  </div>`;
  app.appendChild(d);
}

// ═══════════════ QUIZ ═══════════════
function rQuiz(app){
  const {course,level,questions,answers,elapsed,timerDuration,timeUp,submitting,qi}=S;
  const answered=Object.keys(answers).length;
  const pct=questions.length?Math.round((answered/questions.length)*100):0;
  const left=timerDuration>0?timerDuration*60-elapsed:0;
  const danger=timerDuration>0&&left<60&&!timeUp;
  const idx=Math.min(Math.max(0,qi||0),questions.length-1);
  const q=questions[idx];if(!q)return;
  const isAns=!!answers[q.id];
  const allDone=answered===questions.length;

  const bar=document.createElement("div");bar.className="qbar";
  bar.innerHTML=`<div class="qbar-inner">
    <div class="qbar-lft"><div class="qmeta">
      <strong>DAILY SHADOW QUIZ</strong>
      <span>${COURSES[course]?.label||course} · ${level} · ${todayKey()}</span>
    </div></div>
    <div class="qstats">
      <div><div class="sv" id="qb-done">${answered}/${questions.length}</div><div class="slbl">Done</div></div>
      <div><div class="sv${danger?" danger":""}" id="qb-left">${timeUp?"UP":fmt(Math.max(0,left))}</div><div class="slbl">Left</div></div>
      <div><div class="sv" id="qb-el">${fmt(elapsed)}</div><div class="slbl">Time</div></div>
      <button class="qp-submit-btn" ${submitting?"disabled":""} onclick="submitQuiz()" style="padding:7px 12px;font-size:.64rem;letter-spacing:.08em;height:auto;margin-left:6px">
        ${submitting?'<span class="spin"></span>':'📋 Submit'}
      </button>
    </div>
  </div>
  <div class="ptrack"><div class="pfill" id="pfill" style="width:${pct}%"></div></div>`;
  app.appendChild(bar);

  const shell=document.createElement("div");shell.className="quiz-shell";

  const main=document.createElement("div");main.className="quiz-main";
  main.innerHTML=`
    ${timeUp?`<div class="tuban">⏰ TIME'S UP — SUBMIT NOW</div>`:`<div class="tuban" style="display:none" id="tuban">⏰ TIME'S UP</div>`}
    <div class="sq-card">
      <div class="sq-badge">
        <span class="sq-qnum">Q${String(idx+1).padStart(2,"0")} / ${questions.length}</span>
        <span class="sq-subject">${q.subject||"Mix"}</span>
        <span class="sq-status${isAns?" done":""}" id="qst">${isAns?"✓ Answered":"○ Pending"}</span>
      </div>
      <div class="sq-qtxt">${q.question}</div>
      <div class="sq-options">
        ${Object.entries(q.options||{}).map(([k,v])=>`
          <button class="sq-opt${answers[q.id]===k?" sel":""}" id="opt-${k}"
            ${submitting||timeUp?"disabled":""}
            onclick="pickAns('${q.id}','${k}')">

function goQ(idx){
  if(idx<0||idx>=S.questions.length)return;
  S.qi=idx;saveLocal();
  const app=$("app");
  Array.from(app.children).forEach(c=>{if(!c.classList.contains("bgfx")&&!c.classList.contains("scan")&&!c.classList.contains("topbar")&&!c.classList.contains("modal-overlay"))c.remove();});
  rQuiz(app);
}

function pickAns(qid,opt){
  if(S.submitting)return;
  S.answers={...S.answers,[qid]:opt};saveLocal();
  const qstEl=$("qst");if(qstEl){qstEl.textContent="✓ Answered";qstEl.className="sq-status done";}
  ["A","B","C","D"].forEach(o=>{const b=$("opt-"+o);if(b)b.className="sq-opt"+(o===opt?" sel":"");});
  const g=$("qp-grid");if(g){const bs=g.querySelectorAll(".qp-btn");if(bs[S.qi])bs[S.qi].classList.add("answered");}
  updateBar();
}

function updateBar(){
  const {questions,answers,elapsed,timerDuration,timeUp}=S;
  const answered=Object.keys(answers).length;
  const pct=questions.length?Math.round((answered/questions.length)*100):0;
  const left=timerDuration>0?timerDuration*60-elapsed:0;
  const danger=timerDuration>0&&left<60&&!timeUp;
  const de=$("qb-done"),le=$("qb-left"),el=$("qb-el"),pf=$("pfill");
  const ul=$("un-lbl"),tv=$("qp-tv");
  if(de)de.textContent=`${answered}/${questions.length}`;
  if(el)el.textContent=fmt(elapsed);
  if(pf)pf.style.width=pct+"%";
  if(ul)ul.textContent=answered===questions.length?"✓ All answered":`${questions.length-answered} unanswered`;
  if(le){le.textContent=timeUp?"UP":fmt(Math.max(0,left));le.className="sv"+(danger?" danger":"");}
  if(tv){tv.textContent=timeUp?"00:00":fmt(Math.max(0,left));tv.className="qp-timer-val"+(danger||timeUp?" danger":"");}
  if(timeUp){const tb=$("tuban");if(tb)tb.style.display="block";}
}

let _cdI=null,_rcdI=null;
function tickCD(){clearInterval(_cdI);const fn=()=>{const ms=toNextMidnight();const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000),s=Math.floor((ms%60000)/1000);const he=$("cd-h"),me=$("cd-m"),se=$("cd-s");if(he)he.textContent=String(h).padStart(2,"0");if(me)me.textContent=String(m).padStart(2,"0");if(se)se.textContent=String(s).padStart(2,"0");};fn();_cdI=setInterval(fn,1000);}
function tickRCD(){clearInterval(_rcdI);const fn=()=>{const ms=toNextMidnight();const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000),s=Math.floor((ms%60000)/1000);const he=$("rcd-h"),me=$("rcd-m"),se=$("rcd-s");if(he)he.textContent=String(h).padStart(2,"0");if(me)me.textContent=String(m).padStart(2,"0");if(se)se.textContent=String(s).padStart(2,"0");};fn();_rcdI=setInterval(fn,1000);}

// ═══════════════ TIMER ═══════════════
function startTimer(from=0){
  clearInterval(S.timerInterval);
  S.startTime=Date.now()-(from*1000);
  S.timerInterval=setInterval(()=>{
    const s=Math.floor((Date.now()-S.startTime)/1000);S.elapsed=s;
    if(S.timerDuration>0&&s>=S.timerDuration*60){clearInterval(S.timerInterval);S.timeUp=true;saveLocal();}
    updateBar();
  },500);
}

async function beginDaily(){

async function submitName(){
  const name=($("name-input").value||"").trim().toUpperCase();
  if(!name){$("name-err").style.display="block";return;}
  $("name-err").style.display="none";
  const btn=$("name-btn");btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
  localStorage.setItem("sdq_name",name);guestName=name;
  $("modal-name").style.display="none";
  btn.disabled=false;btn.textContent="◉ BEGIN DAILY MISSION";
  await startOrResume();
}

async function startOrResume(){
  const tk=todayKey(),oid=opId(),course=S.course,level=S.level;

  // Check if already done today via GAS
  try{
    const chk=await gas("checkDailyDone",{opId:oid,todayKey:tk,course,level});
    if(chk.done){
      // Show previous result if available, else just show done message
      if(chk.results){
        S.questions=chk.questions||S.questions;
        S.answers=chk.answers||{};
        S.results=chk.results;
        S.elapsed=chk.elapsed||0;
        S.screen="results";saveLocal();render();return;
      }
      S.error="▲ You already completed this challenge today. Come back at midnight!";
      render();return;
    }
  }catch(e){}

  // Load or generate questions
  S.screen="loading";S.error="";render();

  let questions=null;
  try{
    const cached=await gas("getDailyQuiz",{todayKey:tk,course,level});
    if(cached.questions&&cached.questions.length>=10)questions=cached.questions;
  }catch(e){}

  if(!questions){
    try{questions=await generateQs();}
    catch(e){S.screen="setup";S.error="▲ Generation failed: "+e.message;render();return;}
    // Cache on GAS
    gas("saveDailyQuiz",{todayKey:tk,course,level,questions}).catch(()=>{});
  }

  S.questions=questions;S.answers={};S.elapsed=0;S.timeUp=false;S.qi=0;S.timerDuration=15;S.screen="quiz";
  saveLocal();render();startTimer(0);
}

// ═══════════════ GENERATE ═══════════════
async function generateQs(){
  const course=S.course,level=S.level;
  const cd=COURSES[course];const lv=LEVELS.find(l=>l.id===level);const tk=todayKey();
  const examNote={
    NDA:"\n- NDA: UPSC conducted. Maths: Algebra, Trig, Calculus, Matrices, Stats (Class 11-12). GAT: Physics, Chem, History, Geo, Polity, Current Affairs at graduation level.",
    CDS:"\n- CDS: UPSC for defence officers. Maths is Class 10 but tricky. English and GK must match actual CDS style.",
    AFCAT:"\n- AFCAT: IAF officer selection. Verbal Ability above average SSC. Military Aptitude has spatial reasoning.",
    JEE_MAINS:"\n- JEE Mains: NTA single-correct MCQ pattern. Match actual JEE Mains difficulty exactly.",
    JEE_ADV:"\n- JEE Advanced: IIT-JEE highest difficulty. Multi-concept, must genuinely challenge IIT aspirants.",
    NEET:"\n- NEET: Biology is NCERT-heavy but application-based. Physics and Chemistry match NEET difficulty.",
    SSC:"\n- SSC: CGL/CHSL pattern. Quant is calculation-heavy. GK is specific and factual.",
    UPSC:"\n- UPSC CSE Prelims: GS Paper I covers History, Geography, Economy, Polity, Environment, Science. CSAT (GS II) covers Reading Comprehension, Reasoning, Maths. Match actual UPSC Prelims difficulty — questions are indirect, inference-based, elimination-heavy.",
    CUET:"\n- CUET: NTA pattern for central university admissions. General Test covers GK, Current Affairs, Reasoning, Numerical Ability. Domain subjects match NCERT Class 12 level. English is comprehension and grammar heavy.",
    CA_FOUND:"\n- CA Foundation: ICAI pattern. Accounts is journal-entry and final-accounts based. Business Law covers Indian Contract Act, Sale of Goods Act. Maths & Reasoning is moderate difficulty. Business Economics covers micro and macro concepts.",
    CLAT:"\n- CLAT: Law school entrance. Legal Reasoning is passage-based — no prior law knowledge needed but logical application of given rules. English is RC heavy. Current Affairs & GK is past 1 year events. Quant is data interpretation at Class 10 level.",
    GATE:"\n- GATE: Postgraduate engineering entrance. Engineering Maths covers Linear Algebra, Calculus, Probability. General Aptitude has Verbal and Numerical. Core Engineering questions are deep conceptual and numerical.",
  }[course]||"";
  const prompt=`You are SHADE, an elite exam generator for Indian competitive exam aspirants. Generate EXACTLY 10 unique MCQ questions for the DAILY SHADOW QUIZ.

DAILY SEED: ${tk}
EXAM: ${cd.label} (${cd.fullName})
SUBJECT: Balanced mix of ALL subjects: ${cd.subjects.join(", ")}
DIFFICULTY: ${level} — ${lv?.criteria||""}
${examNote}

RULES:
- Spread evenly across all subjects: ${cd.subjects.join(", ")}
- Each question tests something different — no topic overlap
- Must feel like a real daily challenge — not trivial filler
- Include subject field matching EXACTLY one of: ${cd.subjects.join(", ")}
- Include a concise explanation (1-2 sentences) for the correct answer

Return ONLY valid JSON — zero extra text or markdown:
{"questions":[{"id":"dq1","subject":"<exact subject>","question":"<text>","options":{"A":"<opt>","B":"<opt>","C":"<opt>","D":"<opt>"},"correct":"<A|B|C|D>","explanation":"<1-2 sentence explanation>"}]}`;

  const res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"grok-3",max_tokens:6000,messages:[{role:"user",content:prompt}]})});
  const d=await res.json();if(d.error)throw new Error(d.error.message||"API error");
  const out=(d.content||[]).map(i=>i.text||"").join("");if(!out)throw new Error("Empty response");
  const clean=out.replace(/```json|```/g,"").trim();
  const parsed=JSON.parse(clean);const qs=parsed.questions;if(!qs?.length)throw new Error("No questions returned");
  qs.forEach((q,i)=>{q.id=`dq${i+1}`;});
  return qs;
}

// ═══════════════ SUBMIT ═══════════════
async function submitQuiz(){
  if(S.submitting)return;
  const unan=S.questions.length-Object.keys(S.answers).length;
  if(unan>0&&!confirm(`${unan} unanswered question${unan!==1?"s":""}. Submit anyway?`))return;
  clearInterval(S.timerInterval);S.submitting=true;

  const {course,level,questions,answers,elapsed}=S;
  let score=0;
  const breakdown=questions.map(q=>{const ua=answers[q.id]||null;const ok=ua===q.correct;if(ok)score++;return{id:q.id,question:q.question,subject:q.subject,userAnswer:ua,correct:q.correct,isCorrect:ok};});
  const total=questions.length,pct=Math.round((score/total)*100);
  const rank=getShadowRank(pct);

  const sm={};breakdown.forEach(b=>{const s=b.subject||"Mix";if(!sm[s])sm[s]={correct:0,total:0};sm[s].total++;if(b.isCorrect)sm[s].correct++;});
  const subjectStats=Object.entries(sm).map(([name,d])=>({name,correct:d.correct,total:d.total,pct:Math.round((d.correct/d.total)*100)}));
  const results={rank:rank.rank,score,total,percentage:pct,breakdown,subjectStats,elapsed,timerDuration:S.timerDuration};

  S.results=results;S.submitting=false;S.screen="results";saveLocal();

  // Push to GAS
  gas("saveDailyResult",{opId:opId(),opName:opName(),shadowId:loggedIn?.shadowId||"",course,level,score,total,percentage:pct,elapsed,rank:rank.rank,todayKey:todayKey(),answers:JSON.stringify(answers)}).catch(()=>{});

  render();
}

          <div class="lb-meta">${e.score}/${e.total} · ${fmt(e.elapsed||0)}${e.shadowId?" · "+e.shadowId:""}</div>
        </div>
        <div class="lb-score">
          <div class="lb-pct" style="color:${r.color}">${e.percentage}%</div>
          <div class="lb-time">${e.rank}</div>
        </div>
      </div>`;
    }).join("");
  }catch(e){if($("lb-box"))$("lb-box").innerHTML=`<div style="font-family:'Share Tech Mono',monospace;font-size:.5rem;color:var(--td);padding:8px 0">Could not load leaderboard.</div>`;}
}

// ═══════════════ RESET ═══════════════
function reset(){
  clearInterval(S.timerInterval);clearInterval(_cdI);clearInterval(_rcdI);
  const course=S.course,level=S.level;
  S={screen:"setup",course,level,questions:[],answers:{},results:null,elapsed:0,timerDuration:15,timeUp:false,timerInterval:null,startTime:null,qi:0,error:"",submitting:false};
  localStorage.removeItem("sdq_session");render();
}


// ═══════════════ EMBERS ═══════════════
function spawnEmbers(){
  const bgfx=document.querySelector(".bgfx");if(!bgfx)return;
  for(let i=0;i<14;i++){
    const e=document.createElement("div");e.className="ember";
    const sz=Math.random()*3+1,left=Math.random()*100,dur=Math.random()*8+6,delay=Math.random()*6;
    const dx=(Math.random()-.5)*60+"px",dx2=(Math.random()-.5)*80+"px";
    e.style.cssText=`width:${sz}px;height:${sz}px;left:${left}vw;bottom:-10px;--dx:${dx};--dx2:${dx2};animation-duration:${dur}s;animation-delay:-${delay}s;`;
    bgfx.appendChild(e);
  }
}

// ═══════════════ INIT ═══════════════
(async()=>{
  spawnEmbers();
  try{const u=JSON.parse(localStorage.getItem("sdq_user")||"null");if(u?.shadowId)loggedIn=u;}catch(e){}
  guestName=localStorage.getItem("sdq_name")||"";
  pullMembers();
  const restored=loadLocal();
  if(restored){if(S.screen==="quiz"&&!S.timeUp){render();startTimer(S.elapsed);}else{render();}}
  else{render();}
})();
</script>

function getDailyQuiz(data) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName("DailyQuestions") || ss.insertSheet("DailyQuestions");
  var rows = sh.getDataRange().getValues();
  var key = data.todayKey + "_" + data.course + "_" + data.level;
  for (var i = 1; i < rows.length; i++) {
    if (rows[i][0] === key) {
      try { return { questions: JSON.parse(rows[i][3]) }; } catch(e) {}
    }
  }
  return { questions: null };
}

function saveDailyQuiz(data) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName("DailyQuestions") || ss.insertSheet("DailyQuestions");
  var key = data.todayKey + "_" + data.course + "_" + data.level;
  // Don't duplicate
  var rows = sh.getDataRange().getValues();
  for (var i = 1; i < rows.length; i++) { if (rows[i][0] === key) return { ok: true }; }
  sh.appendRow([key, data.course, data.level, JSON.stringify(data.questions), new Date().toISOString()]);
  return { ok: true };
}

function saveDailyResult(data) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName("DailyResults") || ss.insertSheet("DailyResults");
  sh.appendRow([data.todayKey, data.opId, data.opName, data.shadowId||"",
    data.course, data.level, data.score, data.total, data.percentage,
    data.elapsed, data.rank, new Date().toISOString(), data.answers||""]);
  return { ok: true };
}

function getDailyLeaderboard(data) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName("DailyResults");
  if (!sh) return { leaderboard: [] };
  var rows = sh.getDataRange().getValues();
  var seen = {};
  for (var i = 1; i < rows.length; i++) {
    var r = rows[i];
    if (r[0] == data.todayKey && r[4] == data.course && r[5] == data.level) {
      var oid = r[1];
      if (!seen[oid] || r[8] > seen[oid].percentage || (r[8] == seen[oid].percentage && r[9] < seen[oid].elapsed)) {
        seen[oid] = { opId:r[1],opName:r[2],shadowId:r[3],score:r[6],total:r[7],percentage:r[8],elapsed:r[9],rank:r[10] };
      }
    }
  }
  var lb = Object.values(seen);
  lb.sort(function(a,b){ return b.percentage-a.percentage || a.elapsed-b.elapsed; });
  return { leaderboard: lb.slice(0,20) };
}

function checkDailyDone(data) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName("DailyResults");
  if (!sh) return { done: false };
  var rows = sh.getDataRange().getValues();
  for (var i = 1; i < rows.length; i++) {
    if (rows[i][0]==data.todayKey && rows[i][1]==data.opId && rows[i][4]==data.course && rows[i][5]==data.level) {
      return { done: true };
    }
  }
  return { done: false };
}
